<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Connecticut — trails, preserves and open space near Milford</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#e9d7ac; --parch-lo:#dcc596; --parch-hi:#f2e5c4;
  --ink:#3a2a18; --ink-2:#63492b; --ink-3:#8a6c46;
  --edge:#8a6a3c; --crimson:#9c3722;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:#2b2317;color:var(--ink);font-family:'Spectral',Georgia,serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#app{display:flex;height:100vh;height:100dvh;width:100vw}
canvas{touch-action:none}
#sheetbar{display:none}
#stage{flex:1;position:relative;min-width:0;cursor:grab;background:#dcc596}
#stage.drag{cursor:grabbing}
canvas{display:block}

#tip{position:absolute;z-index:7;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  transition:opacity .1s;background:var(--parch-hi);border:1px solid var(--edge);
  padding:6px 10px;box-shadow:2px 3px 0 rgba(58,42,24,.25)}
#tip .n{font-family:'IM Fell English',serif;font-size:14px}
#tip .m{font-size:11px;color:var(--ink-2);font-style:italic;margin-top:1px}

#tools{position:absolute;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:7px}
#tools button{width:34px;height:34px;border:1px solid var(--edge);background:var(--parch-hi);
  color:var(--ink);font-family:'IM Fell English',serif;font-size:16px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,42,24,.22)}
#tools button:hover{background:#f7edd4}
#tools button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(58,42,24,.22)}

#panel{width:322px;flex:none;background:var(--parch);border-left:3px double var(--edge);
  display:flex;flex-direction:column;box-shadow:-4px 0 14px rgba(0,0,0,.35);z-index:6}
#panel header{padding:16px 18px 13px;border-bottom:1px double var(--edge);text-align:center}
#panel header h2{font-family:'IM Fell English SC',serif;font-size:17px;font-weight:400;letter-spacing:.04em}
#panel header p{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-style:italic;line-height:1.5}
.rule{height:1px;background:var(--edge);opacity:.5;margin:9px 18px}

#detail{display:none;padding:14px 18px 16px;border-bottom:1px double var(--edge);background:var(--parch-hi)}
#detail.show{display:block}
#detail .dhead{display:flex;align-items:flex-start;gap:8px}
#detail h3{font-family:'IM Fell English',serif;font-size:17px;font-weight:400;line-height:1.25;flex:1}
#detail .x{border:none;background:none;color:var(--ink-3);font-size:17px;cursor:pointer;line-height:1;font-family:'IM Fell English',serif}
#detail .x:hover{color:var(--crimson)}
#detail .sub{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--ink-2);font-style:italic}
#detail .sub i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(58,42,24,.5)}
#detail .stats{display:flex;margin:12px 0;border:1px solid var(--edge);background:rgba(255,255,255,.16)}
#detail .stat{flex:1;padding:7px 4px;text-align:center}
#detail .stat+.stat{border-left:1px solid var(--edge)}
#detail .stat b{display:block;font-family:'IM Fell English',serif;font-size:15px;font-weight:400}
#detail .stat span{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
#detail p.desc{font-size:12.5px;line-height:1.6}
#detail .pk{margin-top:11px;padding-top:10px;border-top:1px solid rgba(138,106,70,.45)}
#detail .pk h4{font-family:'IM Fell English SC',serif;font-size:11.5px;font-weight:400;letter-spacing:.06em;color:var(--ink-2);margin-bottom:3px}
#detail .pk p{font-size:12px;line-height:1.55;color:var(--ink-2)}

.filters{padding:10px 16px;border-bottom:1px double var(--edge);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:transparent;
  border:1px solid var(--edge);padding:3px 9px;cursor:pointer;font-family:'Spectral',serif}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed=false]{opacity:.38}
.chip:hover{background:rgba(255,255,255,.25)}

#list{flex:1;overflow-y:auto;padding-bottom:18px}
#list::-webkit-scrollbar{width:9px}
#list::-webkit-scrollbar-track{background:rgba(138,106,70,.12)}
#list::-webkit-scrollbar-thumb{background:rgba(138,106,70,.5)}
.band{font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.08em;color:var(--ink-2);
  padding:14px 18px 5px;text-align:center}
.band::after{content:'';display:block;width:44px;height:1px;background:var(--edge);margin:5px auto 0;opacity:.6}
.site{display:flex;align-items:baseline;gap:9px;padding:6px 18px;cursor:pointer;border-left:3px solid transparent}
.site:hover,.site.on{background:rgba(255,255,255,.32);border-left-color:var(--crimson)}
.site .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(1px);border:1px solid rgba(58,42,24,.45)}
.site .nm{font-family:'IM Fell English',serif;font-size:14px;line-height:1.3;flex:1}
.site .tw{display:block;font-family:'Spectral',serif;font-size:10.5px;color:var(--ink-3);font-style:italic}
.site .el{font-size:11px;color:var(--ink-3);flex:none;font-style:italic}
.site.off{display:none}
.note{padding:12px 18px;font-size:10.5px;line-height:1.6;color:var(--ink-3);border-top:1px double var(--edge);font-style:italic}

@media(hover:none){#tip{display:none!important}}

@media(max-width:860px){
  #app{display:block;position:relative}
  #stage{position:absolute;inset:0;width:100%;height:100%}

  #panel{
    position:absolute;left:0;right:0;bottom:0;width:100%;
    height:78dvh;max-height:78dvh;
    border-left:none;border-top:3px double var(--edge);
    border-radius:16px 16px 0 0;
    transform:translateY(calc(100% - 66px));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -6px 22px rgba(0,0,0,.4);
    z-index:20;padding-bottom:env(safe-area-inset-bottom);
  }
  #panel.open{transform:translateY(0)}

  #sheetbar{
    display:flex;align-items:center;gap:10px;padding:9px 16px 10px;
    border-bottom:1px double var(--edge);cursor:pointer;flex:none;position:relative;
  }
  #sheetbar::before{
    content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:2px;background:rgba(138,106,70,.55);
  }
  #sheetbar .lbl{font-family:'IM Fell English SC',serif;font-size:14px;flex:1;margin-top:4px}
  #sheetbar .cnt{font-size:11.5px;color:var(--ink-3);font-style:italic;margin-top:4px}

  #panel header{display:none}
  #panel.open header{display:block}

  #tools{top:auto;bottom:calc(78px + env(safe-area-inset-bottom));right:12px;gap:9px}
  #tools button{width:46px;height:46px;font-size:19px}
  #panel.open ~ #stage #tools{opacity:0}

  .filters{padding:12px 14px;gap:8px}
  .chip{padding:7px 12px;font-size:12.5px}
  .site{padding:11px 16px}
  .site .nm{font-size:15px}
  .band{padding:16px 16px 6px}
  #detail{padding:16px 16px 18px}
  #detail .x{font-size:24px;padding:0 6px}
  #list{-webkit-overflow-scrolling:touch}
}
@media(max-width:860px) and (orientation:landscape){
  #panel{height:88dvh;max-height:88dvh}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tools">
      <button id="b-in" aria-label="Zoom in">+</button>
      <button id="b-out" aria-label="Zoom out">−</button>
      <button id="b-reset" aria-label="Reset">✦</button>
    </div>
    <div id="tip"><div class="n"></div><div class="m"></div></div>
  </div>

  <aside id="panel">
    <div id="sheetbar" role="button" tabindex="0" aria-expanded="false">
      <span class="lbl">Trails &amp; Open Space</span>
      <span class="cnt" id="sheetcount"></span>
    </div>
    <header>
      <h2>Trails &amp; Open Space</h2>
      <p>Thirty-four places within 45 minutes<br>of Milford, Connecticut</p>
    </header>
    <div id="detail"></div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
    <p class="note" id="note"></p>
  </aside>
</div>

const SITES = [{"n": "Eisenhower Park", "lat": 41.2502, "lon": -73.0534, "c": "walk", "b": 0, "town": "Milford", "mi": 3, "min": 8, "d": "Town park with wooded trails and a story-book walk behind the playground and splash pad.", "p": "780 North St. Bear right — the left-hand lot is residents-only."}, {"n": "BeaverBrook Trailhead", "lat": 41.2166, "lon": -73.0787, "c": "walk", "b": 0, "town": "Milford", "mi": 2.5, "min": 8, "d": "Flat one-mile loop with a marsh boardwalk. Good birding; some highway noise.", "p": "Small pull-off lot at the trail entrance off Naugatuck Ave. Room for 8–10 cars, almost never full."}, {"n": "Solomon Woods", "lat": 41.2497, "lon": -73.0622, "c": "hike", "b": 0, "town": "Milford", "mi": 3, "min": 9, "d": "The best trails inside Milford. Stone ruins, streams, real elevation change, and it drains well after rain.", "p": "Dedicated lot at 811 W River St, right across from the trailhead. Small, but rarely more than a few cars."}, {"n": "Silver Sands State Park", "lat": 41.2004, "lon": -73.0677, "c": "walk", "b": 0, "town": "Milford", "mi": 3.5, "min": 10, "d": "Boardwalk along the beach with a sandbar out to Charles Island at low tide. Flat, wide, open year-round.", "p": "Main lot, 1 Silver Sands Pkwy. Paved and large; free with CT plates (~$22 out-of-state in season). Long boardwalk walk from lot to sand."}, {"n": "Nancy's Meadow", "lat": 41.182, "lon": -73.098, "c": "preserve", "b": 0, "town": "Milford", "mi": 4.5, "min": 12, "d": "Small Milford Land Trust parcel with a short path. Punches above its weight for birding and botany.", "p": "No lot — street parking on 1st Ave, short walk in."}, {"n": "Coastal Center, Milford Point", "lat": 41.1759, "lon": -73.1016, "c": "preserve", "b": 0, "town": "Milford", "mi": 5, "min": 13, "d": "CT Audubon sanctuary at the Housatonic mouth. Boardwalk to the Sound, observation tower, active osprey nest.", "p": "Small lot at 1 Milford Point Rd shared with Smith Point. Narrow residential road; caps out early on summer weekends. Closed Mondays."}, {"n": "Stratford Greenway", "lat": 41.1742, "lon": -73.1289, "c": "walk", "b": 0, "town": "Stratford", "mi": 6, "min": 14, "d": "Short paved waterfront path with benches over the water. Quiet, good for a quick lap.", "p": "Lot at 609 Main St by the waterfront."}, {"n": "Roosevelt Forest", "lat": 41.252, "lon": -73.1278, "c": "hike", "b": 0, "town": "Stratford", "mi": 6.5, "min": 15, "d": "2.6-mile loop, well blazed and maintained, with intersecting trails to shorten or extend. Rarely crowded.", "p": "700 Peters Ln — free, spacious, paved. AllTrails sends people to the wrong trailhead. Posted Stratford-residents-only, loosely enforced off-season."}, {"n": "Maltby Lakes", "lat": 41.3079, "lon": -72.9844, "c": "rwa", "town": "West Haven", "mi": 8, "min": 16, "d": "Three linked reservoirs with rolling trails and lake views minutes from New Haven. The Mark Schaefer Trail rings the property; a power-line clearing on the west ridge opens a view of the city skyline. Mountain biking allowed.", "p": "Small gated lot off Derby Turnpike (Route 34). RWA permit required — you get a gate code with it. Closed Saturdays.", "b": 1}, {"n": "Gristmill Open Space", "lat": 41.2787, "lon": -73.133, "c": "open", "b": 1, "town": "Shelton", "mi": 8, "min": 18, "d": "Quiet riverside walk along the Far Mill River, which is stocked with trout.", "p": "Small lot at 54 Mill St."}, {"n": "Twin Brooks Park", "lat": 41.2428, "lon": -73.1864, "c": "walk", "b": 1, "town": "Trumbull", "mi": 11, "min": 21, "d": "2.5-mile pond loop on paved paths. Farmers market on Thursdays.", "p": "Trumbull resident sticker required, front and back. Non-residents get $25 tickets and the signage is small."}, {"n": "Pine Lake", "lat": 41.3191, "lon": -73.1093, "c": "open", "b": 1, "town": "Shelton", "mi": 11, "min": 22, "d": "Gateway to Shelton’s open-space trail network. Flat, pine-shaded, bike and dog friendly.", "p": "130 Shelton Ave. Limited spaces plus a few pull-offs along the trail. No restrooms."}, {"n": "Pequonnock Valley WMA", "lat": 41.2476, "lon": -73.2006, "c": "walk", "b": 1, "town": "Trumbull", "mi": 12, "min": 22, "d": "Paved rail trail on one bank, technical singletrack on the other. Runs all the way to Indian Well.", "p": "Tait Road lot. Modest size — people get ticketed for street parking near the trail start, so use the lot. Old Mine Park is the better north-end option."}, {"n": "Osbornedale State Park", "lat": 41.3397, "lon": -73.1, "c": "hike", "b": 1, "town": "Derby", "mi": 11, "min": 22, "d": "Pond, open fields, and shaded trails full of glacial erratics. Some sections overgrown — check for ticks.", "p": "43 Chatfield St. Best parking on this list: big paved lot, restrooms, right by the pond."}, {"n": "East Rock Park", "lat": 41.3296, "lon": -72.9046, "c": "hike", "b": 1, "town": "New Haven", "mi": 12, "min": 22, "d": "Steep stone steps to the summit monument. Best skyline view in the region — New Haven, the harbor, and the Sound.", "p": "Farnam Drive lot at the top is free but small, full by early afternoon on nice weekends. College Woods lot off Cold Spring St is bigger. Summit road closes seasonally."}, {"n": "Farm River State Park", "lat": 41.2561, "lon": -72.8567, "c": "walk", "town": "East Haven", "mi": 13, "min": 22, "d": "One of the newest and least known state parks — 61 acres of bluffs and marsh where the Farm River meets the Sound. Short, easy, with osprey overhead.", "p": "Use the lot at 150 Short Beach Rd. Parking is limited and the Mansfield Grove Rd approach dead-ends into private property — do not follow GPS there.", "b": 1}, {"n": "West Rock Ridge State Park", "lat": 41.3446, "lon": -72.9662, "c": "hike", "b": 1, "town": "New Haven", "mi": 12, "min": 23, "d": "Basalt ridge trail past Judges Cave to a long clifftop overlook. Green trail to the summit is the classic.", "p": "1134 Wintergreen Ave. Gates close for winter; parking outside and walking in is normal."}, {"n": "Branford Supply Ponds", "lat": 41.3006, "lon": -72.805, "c": "hike", "town": "Branford", "mi": 14, "min": 23, "d": "A genuinely good trail complex around several scenic ponds, mostly wide and easy with a few climbs. One island is a bird sanctuary. Connects to Queach and Saltonstall Mountain for 800+ contiguous acres. Some blue-trail damage remains from the 2020 tornado.", "p": "Lot off Short Beach Rd. Free, no permit. Several roadside pull-offs if the lot is full. Can be muddy after rain.", "b": 1}, {"n": "Indian Ledge Park", "lat": 41.2792, "lon": -73.2185, "c": "walk", "b": 1, "town": "Trumbull", "mi": 13, "min": 24, "d": "Trails and river access with a large playground and splash pad. Popular for easy mountain biking.", "p": "Small lot off Indian Ledge Park Rd. Trumbull resident sticker required; enforcement is active."}, {"n": "Indian Well State Park", "lat": 41.3389, "lon": -73.1232, "c": "hike", "b": 1, "town": "Shelton", "mi": 13, "min": 24, "d": "Waterfall five minutes from the car, plus blue/white trails climbing to a Housatonic overlook. No swimming.", "p": "Two options: the small roadside lot right at the falls (fills fast) or the main lot at 1 Indian Well Rd by the river. Free with CT plates."}, {"n": "Ansonia Nature Center", "lat": 41.345, "lon": -73.0535, "c": "preserve", "b": 1, "town": "Ansonia", "mi": 12, "min": 24, "d": "Well-marked trails, a pond, and a small nature center with live animals. Ranger-led hikes.", "p": "10 Deerfield Rd, ample lot. Closed Sundays, so the gate matters here."}, {"n": "Lake Saltonstall", "lat": 41.2973, "lon": -72.8375, "c": "rwa", "town": "Branford", "mi": 15, "min": 24, "d": "Nine miles of trails around a stocked traprock lake, plus a 1.5-mile interpretive nature trail. Biking allowed; boat rental and a wheelchair-accessible fishing pier in season.", "p": "Two gated entrances off Hosley Ave. RWA permit required. No dogs, no swimming.", "b": 1}, {"n": "Old Mine Park", "lat": 41.2883, "lon": -73.2266, "c": "walk", "b": 1, "town": "Trumbull", "mi": 14, "min": 25, "d": "Historic mineral-mine site on the rail trail, with a gazebo and water. Good lunch stop.", "p": "121 Old Mine Rd. Has a porta-john. Trumbull resident sticker required."}, {"n": "Saltonstall Mountain Preserve", "lat": 41.3215, "lon": -72.8065, "c": "hike", "town": "Branford", "mi": 15, "min": 25, "d": "Steep traprock ridge straddling the Branford–North Branford line, with some of the highest points in Branford. Wide ridge trails now connect through to Supply Pond and Queach.", "p": "The weak point: Google Maps sends you to a residential dead end and there is no real lot. Park at Supply Ponds or the Laurel Hill Rd access and walk in. Trail colors changed in 2019 — get a current map.", "b": 1}, {"n": "Peter's Rock Park", "lat": 41.3406, "lon": -72.8545, "c": "hike", "town": "North Haven", "mi": 16, "min": 25, "d": "Short steep climb to a traprock summit with a genuinely big view. About 300 acres, dog friendly, with a story trail for kids.", "p": "Lot at 133 Middletown Ave. Free. Trails beyond the red blaze are poorly marked with many unmapped side paths — bring a map.", "b": 1}, {"n": "Lake Wintergreen", "lat": 41.3599, "lon": -72.9646, "c": "hike", "b": 1, "town": "Hamden", "mi": 14, "min": 26, "d": "1.5-mile lake loop (white to red/white), rocky and rooty through the middle third. Connects up to the West Rock cave and overlook.", "p": "Lot off Main St in Hamden. Trickiest on the list — GPS routes people onto a private road nearby, and the lot is tiny and full by mid-morning weekends. Go early."}, {"n": "Elderslie Preserve", "lat": 41.38, "lon": -73.0333, "c": "hike", "b": 1, "town": "Woodbridge", "mi": 14, "min": 26, "d": "Rock scrambles, vernal pools, and plank walks over marshland. Good beginner hike with real variety.", "p": "Gravel lot on Peck Hill Rd. Google and Waze overshoot the entrance by roughly 1,000 feet — watch for it early. QR trail map posted in the lot."}, {"n": "Branford Trolley Trail", "lat": 41.2696, "lon": -72.7573, "c": "walk", "town": "Branford", "mi": 17, "min": 26, "d": "Flat, straight former trolley bed running out along tidal marsh to the Sound, with a red steel footbridge and a long concrete causeway. Easy enough for small children.", "p": "Parking at both ends of the trail. Free. Muddy in places after rain.", "b": 1}, {"n": "Larsen Wildlife Sanctuary", "lat": 41.2023, "lon": -73.2936, "c": "preserve", "b": 1, "town": "Fairfield", "mi": 16, "min": 27, "d": "160+ acres of flat trails and boardwalks through ponds and marsh. Stroller and wheelchair friendly. No dogs.", "p": "Shared lot at 2325 Burr St with the CT Audubon center. Easy and free; small donation suggested."}, {"n": "Lake Chamberlain", "lat": 41.3992, "lon": -72.9881, "c": "rwa", "town": "Bethany", "mi": 17, "min": 28, "d": "About 7.5 miles of trail, with a wide woods road circling the reservoir — roughly two miles a lap, stroller-friendly. Horses are permitted, so expect to share.", "p": "Gated RWA lot; permit and gate code required. Do not let GPS route you via Sperry Road — it is a mile of narrow dirt and gated in winter. No dogs.", "b": 1}, {"n": "Pine Hill Trails", "lat": 41.386, "lon": -73.026, "c": "rwa", "town": "Seymour", "mi": 16, "min": 29, "d": "One of the smaller RWA holdings but among the more interesting underfoot, straddling the Seymour–Woodbridge line. Appeals mostly to people nearby.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map before going.", "b": 1}, {"n": "Westwoods", "lat": 41.2695, "lon": -72.6957, "c": "hike", "town": "Guilford", "mi": 22, "min": 30, "d": "One of the great trail networks on the shoreline — 40 miles of trail through boulder fields, rock walls, swamp crossings and tidal marsh. So many options that it never feels crowded.", "p": "Sam Hill Rd entrance has roadside parking for 5–6 cars; larger lots at Peddlers Rd and Denison Dr. Free. Dog friendly.", "b": 1}, {"n": "West River Greenway", "lat": 41.3623, "lon": -72.9827, "c": "rwa", "b": 2, "town": "Woodbridge", "mi": 15, "min": 28, "d": "Red/blue loop is flat and shaded along the stream. Head to the back of the preserve to escape Route 69 noise.", "p": "Roadside lot off Litchfield Turnpike; the Darling House museum lot is an easier alternative."}, {"n": "Sleeping Giant State Park", "lat": 41.421, "lon": -72.8992, "c": "hike", "b": 2, "town": "Hamden", "mi": 20, "min": 30, "d": "The marquee hike in range. Tower Trail is an easy-moderate gravel climb to a stone observation tower; the blue traverse is a full day. Rocky on dog paws.", "p": "Main lot at 200 Mt Carmel Ave (paved, restrooms, Tower Trail start) — paid, about $15 out-of-state, free with CT plates. East lot on Chestnut Ln is limited but far quieter."}, {"n": "Birchbank Mountain", "lat": 41.3553, "lon": -73.1453, "c": "open", "b": 2, "town": "Shelton", "mi": 16, "min": 30, "d": "Rugged Shelton open space climbing 250 feet from the rail line to a river bluff overlook. Some blowdowns across the trail.", "p": "Trailhead parking off Birchbank St / Dexter Dr — room for only a few cars. Map kiosk at the head."}, {"n": "Sperry Falls", "lat": 41.3836, "lon": -72.9881, "c": "rwa", "b": 2, "town": "Woodbridge", "mi": 16, "min": 30, "d": "Half-mile walk in along a rocky road to a cold, deep falls pool. Quiet even on weekends.", "p": "Park near the beginning of the dirt road, not the end — people are ticketed at the far end around dusk. RWA recreation permit required to leave the main road."}, {"n": "Jared Eliot Preserve", "lat": 41.271, "lon": -72.6845, "c": "preserve", "b": 2, "town": "Guilford", "mi": 22, "min": 30, "d": "Guilford Land Trust parcel with a small trail system and a standout marsh view. Primitive camping sites.", "p": "Roadside only, off Mulberry Farms Rd."}, {"n": "Sherwood Island State Park", "lat": 41.1155, "lon": -73.3331, "c": "walk", "b": 2, "town": "Westport", "mi": 22, "min": 32, "d": "Three-mile loop from woods out to a beach promenade. Restrooms on site; quiet at the far left end.", "p": "Large paved lots, free with CT plates. Never a problem."}, {"n": "Lake Bethany", "lat": 41.4198, "lon": -72.9647, "c": "rwa", "town": "Bethany", "mi": 19, "min": 32, "d": "A wide loop road around a pretty reservoir with brief water views. Plainer than Chamberlain, but quiet and easy walking.", "p": "Gated RWA lot; permit and code required.", "b": 2}, {"n": "Lake Gaillard", "lat": 41.3445, "lon": -72.7777, "c": "rwa", "town": "North Branford", "mi": 22, "min": 32, "d": "The largest RWA reservoir, ringed by a 6.7-mile perimeter road. Access is the most restricted of the properties — much of it opens only for permit holders on posted days and for the annual walkathon.", "p": "Gated; RWA permit required and access is limited. Check current rules with the RWA before driving out.", "b": 2}, {"n": "Wharton Brook State Park", "lat": 41.4251, "lon": -72.8376, "c": "walk", "town": "North Haven", "mi": 22, "min": 32, "d": "Small, old-fashioned state park with a stocked pond, a covered bridge, picnic groves and easy walking. More a picnic spot than a hike.", "p": "Lot off US-5. Free with CT plates. Restrooms and porta-johns on site.", "b": 2}, {"n": "Webb Mountain Park", "lat": 41.373, "lon": -73.1666, "c": "hike", "b": 2, "town": "Monroe", "mi": 19, "min": 33, "d": "Easy climb to a Housatonic River overlook, plus ten primitive campsites. Links to the blue Paugussett Trail all the way to Indian Well.", "p": "Free lot off Old Fish House Rd. Limited spaces, but the park is quiet enough that it rarely matters."}, {"n": "Big Gulph", "lat": 41.362, "lon": -72.786, "c": "rwa", "town": "North Branford", "mi": 23, "min": 33, "d": "No reservoir here — mostly wide woods roads with side trails, deep quiet, and almost no one else. Good for long easy miles rather than scenery.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map, the trailhead is not obvious from the road.", "b": 2}, {"n": "Naugatuck State Forest", "lat": 41.4545, "lon": -73.0808, "c": "hike", "b": 2, "town": "Beacon Falls", "mi": 21, "min": 34, "d": "Largest wild acreage in range. Gorge trail along Spruce Brook with a run of six waterfalls and overlooks. Hunting is permitted — wear orange in season.", "p": "Spruce Brook lot off Cold Springs Rd. Approach from the Naugatuck side to the north — the Beacon Falls road is badly rutted and has closed after flooding. Roadside pull-offs as backup."}, {"n": "West Sugarloaf", "lat": 41.3745, "lon": -72.7348, "c": "rwa", "town": "Guilford", "mi": 24, "min": 35, "d": "Mostly footpaths rather than woods roads, which makes it the most trail-like of the RWA properties. The White Owl Trail is an easy four-mile loop — expect briars along the edges.", "p": "Gated RWA lot with a well-kept porta-john, unusually. Permit and code required.", "b": 2}, {"n": "Paugussett State Forest", "lat": 41.4132, "lon": -73.2068, "c": "hike", "town": "Newtown", "mi": 23, "min": 35, "d": "Rugged and varied, with a waterfall and Housatonic river frontage. The blue-blazed Paugussett Trail runs through; most blue trails are closed to bikes.", "p": "Lot off Echo Valley Rd. Free. Gets loud and busy down by the water on summer weekends.", "b": 2}, {"n": "Kettletown State Park", "lat": 41.4272, "lon": -73.2042, "c": "hike", "b": 2, "town": "Southbury", "mi": 26, "min": 38, "d": "Brook trail is the scenic pick; blue/white runs longer. Lakeside camping on Lake Zoar.", "p": "Paved lot at 1400 Georges Hill Rd. Plenty of space, free with CT plates."}, {"n": "Roaring Brook Falls", "lat": 41.4818, "lon": -72.9349, "c": "hike", "b": 2, "town": "Cheshire", "mi": 25, "min": 38, "d": "Tallest single-drop waterfall in Connecticut. The red trail climbs steeply on loose gravel; best views in early spring or late fall.", "p": "Access via Roaring Brook Park, 857 Roaring Brook Rd, at the end of a small dead-end street. Tight — a handful of cars."}, {"n": "Hammonasset Beach State Park", "lat": 41.2667, "lon": -72.5584, "c": "walk", "b": 2, "town": "Madison", "mi": 30, "min": 38, "d": "Two miles of shoreline plus the Moraine Nature Trail at the Meigs Point end — the underrated part. Paved paths are great off-season.", "p": "Use the Meigs Point lot at the far east end for the nature trail. Much less chaotic than the main beach lots. Free with CT plates."}, {"n": "Bluff Head", "lat": 41.408, "lon": -72.6965, "c": "hike", "town": "Guilford", "mi": 28, "min": 38, "d": "The best shoreline-region viewpoint — a steep traprock cliff on the Mattabesett Trail looking out over Meyerhuber Pond and miles of forest. Never crowded.", "p": "Small lots on Durham Rd (Route 77). Free. Trail is narrow along the cliff edge — keep dogs close.", "b": 2}, {"n": "Trout Brook Valley", "lat": 41.2455, "lon": -73.3426, "c": "open", "town": "Weston", "mi": 26, "min": 38, "d": "1,000-acre Aspetuck Land Trust preserve with deep woods trails, an orchard, and long loops. Blazes do not always match the published map.", "p": "Several small lots, each serving different trails — Bradley Rd is the main one. Pick your trail before you drive out. Free.", "b": 2}, {"n": "Southford Falls State Park", "lat": 41.4589, "lon": -73.1647, "c": "hike", "b": 2, "town": "Southbury", "mi": 27, "min": 40, "d": "Covered bridge and a run of cascades right off the parking area. Boardwalk section is in rough shape.", "p": "175 Quaker Farms Rd. Dirt lot on the side of the road with no marked spots; the falls are a few steps away."}, {"n": "Lake Hammonasset", "lat": 41.3586, "lon": -72.6077, "c": "rwa", "town": "Killingworth", "mi": 32, "min": 42, "d": "The best-rated RWA hike — the White Trail loop runs about six miles with 500 feet of climbing, a mix of narrow footpath and vehicle road.", "p": "Gated entrance at 530 N Branford Rd. Permit and code required. Lot fits 6–8 cars; porta-john on site.", "b": 2}, {"n": "Genesee", "lat": 41.352, "lon": -72.628, "c": "rwa", "town": "Madison", "mi": 31, "min": 42, "d": "Nearly twelve miles of woods roads and side trails with some 19th-century quarry history along the way. Biking allowed April 15 to December 31.", "p": "Gated entrance on Durham Rd (Route 79) south of County Road. Permit and code required. No dogs. Location on this map is approximate — confirm on the RWA map.", "b": 2}, {"n": "Collis P. Huntington State Park", "lat": 41.332, "lon": -73.3593, "c": "hike", "town": "Redding", "mi": 30, "min": 42, "d": "900 acres of wide dirt roads, ponds and brooks, with bronze animal sculptures at the entrance. Flat and forgiving, good for horses and bikes as well as walking.", "p": "Large free lot at 9 Dodgingtown Rd. Easy parking even on weekends. Ticks are heavy in spring.", "b": 2}, {"n": "Devil's Den Preserve", "lat": 41.2372, "lon": -73.396, "c": "preserve", "town": "Weston", "mi": 29, "min": 42, "d": "Connecticut's largest Nature Conservancy preserve — 1,750 acres, 20 miles of well-marked trail, and Godfrey Pond with the remains of an old sawmill. Quiet and beautifully kept.", "p": "Lot at 33 Pent Rd with a touch-screen trail map. Free, but limited with no overflow — arrive early on weekends or you are out of luck.", "b": 2}, {"n": "Bent of the River Audubon", "lat": 41.4724, "lon": -73.258, "c": "preserve", "town": "Southbury", "mi": 30, "min": 42, "d": "700 acres of meadow and woodland along the Pomperaug River, and one of the better birding spots in the region. Trails are unblazed — take the free map at the kiosk.", "p": "Free lot at 185 E Flat Hill Rd. No visitor center, no dogs. Picnic tables along the trails.", "b": 2}, {"n": "Rockland Preserve", "lat": 41.4244, "lon": -72.6516, "c": "open", "town": "Madison", "mi": 33, "min": 44, "d": "700 acres best known for the best mountain-bike singletrack on the shoreline, but good hiking too. Trail junctions are poorly signed — bring a downloaded map.", "p": "Lot on Durham Rd (Route 79), with a skills area by the entrance. Free.", "b": 2}, {"n": "Chatfield Hollow State Park", "lat": 41.3659, "lon": -72.5859, "c": "hike", "town": "Killingworth", "mi": 34, "min": 45, "d": "Eighteen miles of trail plus a repaved 3.3-mile main circuit, a covered bridge, marsh boardwalk, swimming pond and caves. One of the few places plowed for winter walking.", "p": "Several lots throughout the park, plus roadside spots. Free with CT plates. Restrooms by the main pond in season.", "b": 2}];

  ctx.strokeStyle='rgba(94,74,46,.5)'; ctx.lineWidth=1/view.s;
  for(let i=0;i<W.isle.length-1;i+=1){
    const a=W.isle[i], b=W.isle[i+1];
    for(let t=0;t<1;t+=0.25){
      const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+3,py+7); ctx.stroke();
    }
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle='rgba(120,96,58,.55)'; ctx.lineWidth=0.9/view.s;
  ctx.setLineDash([5/view.s,4/view.s]);
  W.towns.forEach(t=>{ t.r.forEach(rg=>{ if(vis(rg[0][0],rg[0][1],400)){ path(rg,true); ctx.stroke(); } }); });
  ctx.restore();

  const gs=Math.max(0.75,Math.min(1.5,0.9/view.s));
  GLYPHS.forEach(gl=>{
    if(!vis(gl.x,gl.y,60)) return;
    if(gl.k===0) drawTree(gl,gs);
    else if(gl.k===1) drawHill(gl,gs);
    else drawMountain(gl,gs);
  });

  W.lakes.forEach(l=>{
    path(l.p,true);
    ctx.fillStyle='#bed0c8'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle='rgba(78,107,99,.40)';
    for(let k=1;k<=3;k++){
      ctx.lineWidth=0.8/view.s;
      ctx.beginPath();
      l.p.forEach((p,i)=>{
        const x=l.c[0]+(p[0]-l.c[0])*(1-k*0.085), y=l.c[1]+(p[1]-l.c[1])*(1-k*0.085);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      });
      ctx.closePath(); ctx.globalAlpha=0.55-k*0.12; ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    path(l.p,true);
    ctx.strokeStyle='#41615a'; ctx.lineWidth=1.25/view.s; ctx.stroke();
  });
  ctx.lineCap='round'; ctx.lineJoin='round';
  W.rivers.forEach(r=>{
    const n=r.p.length-1;
    ctx.strokeStyle='#41615a';
    for(let i=0;i<n;i++){
      const t=i/n;
      const w=(0.7+r.w*0.85)*(0.42+0.8*t);
      ctx.lineWidth=Math.max(w, 0.85/view.s);
      ctx.beginPath(); ctx.moveTo(r.p[i][0],r.p[i][1]); ctx.lineTo(r.p[i+1][0],r.p[i+1][1]); ctx.stroke();
    }
  });

  ctx.strokeStyle='#3f2f1c'; ctx.lineWidth=2.1/view.s; ctx.lineJoin='round';
  path(W.outline,true); ctx.stroke();

  drawCompass();
  drawScale();
  drawShip();
  drawTitle();

  drawLabels(vis);
  drawSites(vis);
}

function drawTree(gl,gs){
  const h=gl.h*gs;
  ctx.strokeStyle='#4a5a38'; ctx.lineWidth=0.85*gs;
  ctx.beginPath(); ctx.moveTo(gl.x,gl.y); ctx.lineTo(gl.x,gl.y-h*0.35); ctx.stroke();
  if(gl.t){
    ctx.beginPath(); ctx.moveTo(gl.x-h*0.42,gl.y-h*0.3);
    ctx.lineTo(gl.x,gl.y-h*1.15); ctx.lineTo(gl.x+h*0.42,gl.y-h*0.3);
    ctx.closePath(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(gl.x,gl.y-h*0.72,h*0.44,0,6.283); ctx.stroke();
  }
}
function drawHill(gl,gs){
  const h=gl.h*gs, w=h*1.5;
  ctx.strokeStyle='#6b543a'; ctx.lineWidth=0.95*gs;
  ctx.beginPath();
  ctx.moveTo(gl.x-w,gl.y);
  ctx.quadraticCurveTo(gl.x-w*0.45,gl.y-h*1.5,gl.x,gl.y-h*0.35);
  ctx.quadraticCurveTo(gl.x+w*0.5,gl.y-h*1.35,gl.x+w,gl.y);
  ctx.stroke();
}
function drawMountain(gl,gs){
  const h=gl.h*gs, w=h*0.85;
  ctx.strokeStyle='#4a3925'; ctx.lineWidth=1.05*gs;
  ctx.fillStyle='#e6d3a6';
  ctx.beginPath();
  ctx.moveTo(gl.x-w,gl.y);
  ctx.lineTo(gl.x-w*0.28,gl.y-h*0.82);
  ctx.lineTo(gl.x,gl.y-h);
  ctx.lineTo(gl.x+w*0.34,gl.y-h*0.7);
  ctx.lineTo(gl.x+w,gl.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.lineWidth=0.6*gs; ctx.strokeStyle='rgba(74,57,37,.65)';
  for(let i=1;i<=4;i++){
    const t=i/5;
    ctx.beginPath();
    ctx.moveTo(gl.x-w*0.02-w*0.24*t, gl.y-h*(0.92-0.16*t));
    ctx.lineTo(gl.x-w*0.10-w*0.86*t, gl.y-h*0.06);
    ctx.stroke();
  }
}

function fellText(txt,size,style){
  ctx.font=(style||'')+' '+size+"px 'IM Fell English', Georgia, serif";
}
function haloText(txt,x,y,size,color,style,spacing){
  fellText(txt,size,style);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2.4,size*0.28); ctx.strokeStyle='rgba(239,223,184,.92)'; ctx.lineJoin='round';
  if(spacing){
    const chars=txt.split(''); const wsum=chars.reduce((a,c)=>a+ctx.measureText(c).width+spacing,0)-spacing;
    let cx=x-wsum/2;
    ctx.textAlign='left';
    chars.forEach(c=>{ ctx.strokeText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    cx=x-wsum/2;
    ctx.fillStyle=color;
    chars.forEach(c=>{ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    ctx.textAlign='center';
  } else {
    ctx.strokeText(txt,x,y); ctx.fillStyle=color; ctx.fillText(txt,x,y);
  }
}

function drawLabels(vis){
  const inv=1/view.s;
  REGIONS.forEach(r=>{
    ctx.save();
    ctx.translate(wx(r.lon),wy(r.lat)); ctx.rotate(r.r);
    haloText(r.t, 0, 0, r.s*inv, 'rgba(88,66,38,.60)', '', 3.2*inv);
    ctx.restore();
  });
  if(view.s>0.55){
    ctx.save();
    W.towns.forEach(t=>{
      if(!vis(t.c[0],t.c[1],40)) return;
      haloText(t.n,t.c[0],t.c[1],10.5/view.s,'rgba(84,64,38,.85)','italic',0);
    });
    ctx.restore();
  }
  W.rivers.forEach(r=>{
    if(!r.n||r.p.length<3) return;
    if(view.s < (r.w>=2?0.62:1.05)) return;
    const i=Math.floor(r.p.length/2);
    const a=r.p[i-1], b=r.p[i];
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    ctx.save(); ctx.translate(b[0],b[1]); ctx.rotate(Math.abs(ang)>1.9?ang+Math.PI:ang);
    haloText(r.n,0,-6/view.s,10/view.s,'rgba(60,88,80,.9)','italic',0);
    ctx.restore();
  });
}

function drawSites(vis){
  const inv=1/view.s;
  const hx=wx(HOME.lon), hy=wy(HOME.lat);
  ctx.save();
  ctx.strokeStyle='#7d2b1a'; ctx.fillStyle='#efdfb8'; ctx.lineWidth=1.6*inv;
  ctx.beginPath(); ctx.rect(hx-6*inv,hy-5*inv,12*inv,8*inv); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<4;i++){ ctx.rect(hx-6*inv+i*3.2*inv, hy-7.5*inv, 2*inv, 2.6*inv); }
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx,hy-7.5*inv); ctx.lineTo(hx,hy-15*inv); ctx.stroke();
  ctx.fillStyle='#9c3722';
  ctx.beginPath(); ctx.moveTo(hx,hy-15*inv); ctx.lineTo(hx+9*inv,hy-12.5*inv); ctx.lineTo(hx,hy-10*inv); ctx.closePath(); ctx.fill();
  haloText('MILFORD',hx,hy+13*inv,12*inv,'#7d2b1a','',0.8*inv);
  ctx.restore();

  SITES.forEach((s,i)=>{
    if(!activeCat[s.c]) return;
    const x=wx(s.lon), y=wy(s.lat);
    if(!vis(x,y,60)) return;
    const sel=(i===selected), hov=(i===hovered);
    const R=(sel?7.2:5.4)*inv;
    ctx.beginPath(); ctx.arc(x,y,R,0,6.283);
    ctx.fillStyle=CAT[s.c].color; ctx.fill();
    ctx.lineWidth=1.5*inv; ctx.strokeStyle='#33261a'; ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,R*0.34,0,6.283); ctx.fillStyle='#efdfb8'; ctx.fill();
    if(sel){
      ctx.beginPath(); ctx.arc(x,y,R*2.0,0,6.283);
      ctx.lineWidth=1.2*inv; ctx.strokeStyle='rgba(156,55,34,.85)'; ctx.stroke();
      for(let k=0;k<8;k++){
        const a=k*Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(a)*R*2.3, y+Math.sin(a)*R*2.3);
        ctx.lineTo(x+Math.cos(a)*R*3.1, y+Math.sin(a)*R*3.1);
        ctx.stroke();
      }
    }
    if(view.s>0.7||sel||hov)
      haloText(s.n,x,y-(sel?15:11)*inv,(sel?13:11)*inv,'#3f2f1c','',0);
  });
}

function drawCompass(){
  const x=wx(-73.55), y=wy(41.02), R=52, inv=1;
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle='#5e4a2e'; ctx.fillStyle='rgba(239,223,184,.55)';
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,R*0.86,0,6.283); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R*0.72,0,6.283); ctx.stroke();
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4, len=(k%2===0)?R:R*0.55, wdt=(k%2===0)?0.16:0.11;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*len,Math.sin(a)*len);
    ctx.lineTo(Math.cos(a+wdt)*R*0.22,Math.sin(a+wdt)*R*0.22);
    ctx.lineTo(Math.cos(a-wdt)*R*0.22,Math.sin(a-wdt)*R*0.22);
    ctx.closePath();
    ctx.fillStyle=(k%2===0)?'#3f2f1c':'#a08051'; ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle='#3f2f1c';
  fellText('N',16,''); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('N',0,-R-11); ctx.fillText('S',0,R+11);
  ctx.fillText('E',R+11,0); ctx.fillText('W',-R-11,0);
  ctx.restore();
}

function drawScale(){

}

function drawFrame(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const grd=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.25,w/2,h/2,Math.max(w,h)*0.78);
  grd.addColorStop(0,'rgba(90,66,32,0)'); grd.addColorStop(1,'rgba(74,52,24,.30)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#6b5232'; ctx.lineWidth=8; ctx.strokeRect(4,4,w-8,h-8);
  ctx.strokeStyle='#efdfb8'; ctx.lineWidth=1.5; ctx.strokeRect(10,10,w-20,h-20);
  ctx.strokeStyle='#6b5232'; ctx.lineWidth=2.5; ctx.strokeRect(14,14,w-28,h-28);
  ctx.fillStyle='#6b5232';
  [[14,14],[w-14,14],[14,h-14],[w-14,h-14]].forEach(([cx,cy])=>{
    ctx.beginPath(); ctx.arc(cx,cy,6,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,10,0,6.283); ctx.lineWidth=1.4; ctx.strokeStyle='#6b5232'; ctx.stroke();
  });
  ctx.restore();
}

let parchPattern=null;
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  ctx.save();
  ctx.translate(view.x,view.y); ctx.scale(view.s,view.s);
  drawWorld();
  ctx.restore();
  if(!parchPattern) parchPattern=ctx.createPattern(parchCanvas,'repeat');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=0.5;
  ctx.fillStyle=parchPattern;
  ctx.fillRect(0,0,stage.clientWidth,stage.clientHeight);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  drawFrame();
}
function loop(){ if(dirty){ dirty=false; render(); } requestAnimationFrame(loop); }

function fitAll(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const phone=isPhone();
  const pad=phone?16:40;
  const bottom=phone?66:0;
  const usableH=h-bottom;
  const x0=wx(-73.80),x1=wx(-71.75),y0=wy(42.10),y1=wy(40.88);
  const s=Math.min((w-pad*2)/(x1-x0),(usableH-pad*2)/(y1-y0));
  minScale=Math.min(0.18, s*0.75);
  view.s=s;
  view.x=w/2-((x0+x1)/2)*s;
  view.y=usableH/2-((y0+y1)/2)*s;
  dirty=true;
}

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};stage.classList.add('drag')});
window.addEventListener('mouseup',e=>{
  if(drag&&!drag.moved){
    const i=pick(e);
    if(i>=0) select(i); else clearSelection();
  }
  drag=null; stage.classList.remove('drag');
});
window.addEventListener('mousemove',e=>{
  if(drag){
    if(Math.abs(e.clientX-drag.x)>3||Math.abs(e.clientY-drag.y)>3) drag.moved=true;
    view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); dirty=true;
  } else if(!isTouch) hoverAt(e);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const [wx0,wy0]=worldOf(mx,my);
  view.s=clampScale(view.s*(1-Math.sign(e.deltaY)*0.12));
  view.x=mx-wx0*view.s; view.y=my-wy0*view.s; dirty=true;
},{passive:false});

const isTouch = (window.matchMedia && window.matchMedia('(hover:none)').matches) || ('ontouchstart' in window);
const isPhone = () => window.innerWidth <= 860;

let tp=null;
function midpoint(e){
  const r=cv.getBoundingClientRect();
  let x=0,y=0;
  for(const t of e.touches){ x+=t.clientX-r.left; y+=t.clientY-r.top; }
  return [x/e.touches.length, y/e.touches.length];
}
function spread(e){
  return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                    e.touches[0].clientY-e.touches[1].clientY);
}
cv.addEventListener('touchstart',e=>{
  const r=cv.getBoundingClientRect();
  if(e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    tp={mode:'pan',px,py,vx:view.x,vy:view.y,sx:px,sy:py,t0:Date.now(),moved:false};
  } else if(e.touches.length===2){
    const [mx,my]=midpoint(e);
    tp={mode:'pinch',d:spread(e),mx,my,moved:true};
  }
},{passive:false});

cv.addEventListener('touchmove',e=>{
  if(!tp) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(tp.mode==='pan' && e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    if(Math.abs(px-tp.sx)>6||Math.abs(py-tp.sy)>6) tp.moved=true;
    view.x=tp.vx+(px-tp.sx); view.y=tp.vy+(py-tp.sy);
    dirty=true;
  } else if(e.touches.length===2){
    if(tp.mode!=='pinch'){ const [mx,my]=midpoint(e); tp={mode:'pinch',d:spread(e),mx,my,moved:true}; return; }
    const d=spread(e), [mx,my]=midpoint(e);
    const [wx0,wy0]=worldOf(mx,my);
    if(tp.d>0) view.s=clampScale(view.s*(d/tp.d));
    view.x=mx-wx0*view.s; view.y=my-wy0*view.s;
    tp.d=d; tp.mx=mx; tp.my=my;
    dirty=true;
  }
},{passive:false});

let lastTap=0;
cv.addEventListener('touchend',e=>{
  if(tp && tp.mode==='pan' && !tp.moved && Date.now()-tp.t0<400){
    const i=pickAt(tp.sx,tp.sy);
    const now=Date.now();
    if(i>=0){ select(i); }
    else if(now-lastTap<300){ zoomAt(tp.sx,tp.sy,1.6); }
    else { clearSelection(); }
    lastTap=now;
  }
  if(e.touches.length===0) tp=null;
},{passive:true});
cv.addEventListener('touchcancel',()=>{tp=null},{passive:true});

function pickAt(sx,sy){
  const [mx,my]=worldOf(sx,sy);
  let best=-1,bd=1e9;
  SITES.forEach((s,i)=>{
    if(!activeCat[s.c]) return;
    const d=Math.hypot(wx(s.lon)-mx, wy(s.lat)-my);
    if(d<bd){bd=d;best=i;}
  });
  return bd < (isTouch?22:11)/view.s ? best : -1;
}
function pick(e){
  const r=cv.getBoundingClientRect();
  return pickAt(e.clientX-r.left, e.clientY-r.top);
}
function hoverAt(e){
  const i=pick(e);
  if(i!==hovered){ hovered=i; dirty=true; }
  const r=cv.getBoundingClientRect();
  if(i>=0){
    const s=SITES[i];
    tip.querySelector('.n').textContent=s.n;
    tip.querySelector('.m').textContent=s.town+' · '+s.min+' min drive';
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top-14)+'px';
    tip.style.opacity=1; cv.style.cursor='pointer';
  } else { tip.style.opacity=0; cv.style.cursor=''; }
}

function select(i){
  selected=i; dirty=true;
  const s=SITES[i], el=document.getElementById('detail');
  el.innerHTML =
    '<div class="dhead"><h3>'+s.n+'</h3><button class="x" aria-label="Close">✕</button></div>'+
    '<div class="sub"><i style="background:'+CAT[s.c].color+'"></i>'+CAT[s.c].label+' · '+s.town+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+s.min+'</b><span>min drive</span></div>'+
      '<div class="stat"><b>'+s.mi+'</b><span>miles</span></div>'+
      '<div class="stat"><b>'+Math.round(elevFt(s.lat,s.lon))+'</b><span>feet</span></div>'+
    '</div>'+
    '<p class="desc">'+s.d+'</p>'+
    '<div class="pk"><h4>Best parking</h4><p>'+s.p+'</p></div>';
  el.classList.add('show');
  el.querySelector('.x').onclick=clearSelection;
  document.querySelectorAll('.site').forEach(r=>r.classList.toggle('on',+r.dataset.i===i));
  const row=document.querySelector('.site[data-i="'+i+'"]'); if(row) row.scrollIntoView({block:'nearest'});
  if(isPhone()) setSheet(true);
  panTo(i);
}
function clearSelection(){
  selected=-1; dirty=true;
  document.getElementById('detail').classList.remove('show');
  document.querySelectorAll('.site').forEach(r=>r.classList.remove('on'));
  if(isPhone()) setSheet(false);
}
function panTo(i){
  const s=SITES[i], w=stage.clientWidth, h=stage.clientHeight;
  const phone=isPhone();
  const ts=Math.max(view.s, phone?1.0:1.15);
  const cy=phone ? (h-66)*0.42 : h/2;
  const from={s:view.s,x:view.x,y:view.y};
  const to={s:ts,x:w/2-wx(s.lon)*ts,y:cy-wy(s.lat)*ts};
  const t0=performance.now();
  (function step(now){
    const t=Math.min(1,(now-t0)/520), e=1-Math.pow(1-t,3);
    view.s=from.s+(to.s-from.s)*e; view.x=from.x+(to.x-from.x)*e; view.y=from.y+(to.y-from.y)*e;
    dirty=true;
    if(t<1) requestAnimationFrame(step);
  })(t0);
}

document.getElementById('b-in').onclick=()=>{zoomBy(1.3)};
document.getElementById('b-out').onclick=()=>{zoomBy(1/1.3)};
document.getElementById('b-reset').onclick=()=>{fitAll();clearSelection()};
function zoomBy(k){
  const w=stage.clientWidth/2,h=stage.clientHeight/2;
  const [x0,y0]=worldOf(w,h);
  view.s=clampScale(view.s*k);
  view.x=w-x0*view.s; view.y=h-y0*view.s; dirty=true;
}

const panel=document.getElementById('panel');
const sheetbar=document.getElementById('sheetbar');
function setSheet(open){
  panel.classList.toggle('open',open);
  sheetbar.setAttribute('aria-expanded',open?'true':'false');
}
function toggleSheet(){ setSheet(!panel.classList.contains('open')); }
sheetbar.addEventListener('click',toggleSheet);
sheetbar.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSheet();} });

function buildPanel(){
  const f=document.getElementById('filters');
  Object.entries(CAT).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed','true');
    b.innerHTML='<i style="background:'+v.color+'"></i>'+v.label;
    b.onclick=()=>{
      activeCat[k]=!activeCat[k]; b.setAttribute('aria-pressed',activeCat[k]);
      document.querySelectorAll('.site').forEach(el=>el.classList.toggle('off',!activeCat[el.dataset.c]));
      if(selected>=0&&!activeCat[SITES[selected].c]) clearSelection();
      dirty=true;
    };
    f.appendChild(b);
  });
  const list=document.getElementById('list');
  BANDS.forEach((label,bi)=>{
    const hd=document.createElement('div'); hd.className='band'; hd.textContent=label; list.appendChild(hd);
    SITES.forEach((s,i)=>{
      if(s.b!==bi) return;
      const row=document.createElement('div');
      row.className='site'; row.dataset.i=i; row.dataset.c=s.c;
      row.innerHTML='<span class="dot" style="background:'+CAT[s.c].color+'"></span>'+
        '<span class="nm">'+s.n+'<span class="tw">'+s.town+' · '+s.mi+' miles</span></span>'+
        '<span class="el">'+s.min+' min</span>';
      row.onclick=()=>{ select(i); if(isPhone()) setTimeout(()=>setSheet(false),140); };
      row.onmouseenter=()=>{hovered=i;dirty=true};
      row.onmouseleave=()=>{hovered=-1;dirty=true};
      list.appendChild(row);
    });
  });
  document.getElementById('sheetcount').textContent = SITES.length + ' places';
  document.getElementById('note').textContent =
    'Drawn in an antique style, but the geography is real. Town lines and the shoreline are official Connecticut boundaries; '+
    'the Connecticut and Housatonic are real river centerlines; site coordinates are accurate. The hill and forest symbols, the smaller rivers, '+
    'and the drive times are approximations.';
}

let lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  const w=window.innerWidth, h=window.innerHeight;
  const bigChange = w!==lastW || Math.abs(h-lastH)>140;
  resize();
  if(bigChange) fitAll();
  lastW=w; lastH=h;
});
window.addEventListener('orientationchange',()=>{ setTimeout(()=>{resize();fitAll()},260); });
resize();
buildPanel();
fitAll();
loop();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{dirty=true});
</script>
</body>
</html>
