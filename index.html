<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Connecticut 1845 — trails, preserves and open space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#ede4c8; --parch-lo:#ddd2b0; --parch-hi:#f6efd9;
  --ink:#26241c; --ink-2:#4a4535; --ink-3:#77705c;
  --edge:#6d6450; --crimson:#8c3a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:#2b2317;color:var(--ink);font-family:'Spectral',Georgia,serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#app{display:flex;height:100vh;height:100dvh;width:100vw}
canvas{touch-action:none}

#stage{flex:1;position:relative;min-width:0;cursor:grab;background:#e6dcbe}
#stage.drag{cursor:grabbing}
canvas{display:block}

#tip{position:absolute;z-index:7;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  transition:opacity .1s;background:var(--parch-hi);border:1px solid var(--edge);
  padding:6px 10px;box-shadow:2px 3px 0 rgba(58,42,24,.25)}
#tip .n{font-family:'IM Fell English',serif;font-size:14px}
#tip .m{font-size:11px;color:var(--ink-2);font-style:italic;margin-top:1px}

#tools{position:absolute;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:7px}
#tools button{width:34px;height:34px;border:1px solid var(--edge);background:var(--parch-hi);
  color:var(--ink);font-family:'IM Fell English',serif;font-size:16px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,42,24,.22)}
#tools button:hover{background:#f7edd4}
#tools button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(58,42,24,.22)}

#panel{width:322px;flex:none;background:var(--parch);border-left:3px double var(--edge);
  display:flex;flex-direction:column;box-shadow:-4px 0 14px rgba(0,0,0,.35);z-index:6}
#panel header{padding:16px 18px 13px;border-bottom:1px double var(--edge);text-align:center}
#panel header h2{font-family:'IM Fell English SC',serif;font-size:17px;font-weight:400;letter-spacing:.04em}
#panel header p{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-style:italic;line-height:1.5}
.rule{height:1px;background:var(--edge);opacity:.5;margin:9px 18px}

.info{display:none;padding:13px 18px 16px;background:var(--parch-hi);
  border-top:1px solid rgba(138,106,70,.5);border-bottom:1px solid rgba(138,106,70,.5)}
.info.show{display:block}
.info .ihead{display:flex;align-items:flex-start;gap:10px}
.info h3{font-family:'IM Fell English',serif;font-size:17px;font-weight:400;line-height:1.25;flex:1}
.info .x{flex:none;border:1px solid var(--edge);background:rgba(255,255,255,.35);
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;font-family:'Spectral',serif;
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-2px}
.info .x:hover{background:var(--crimson);color:var(--parch-hi);border-color:var(--crimson)}
.info .sub{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--ink-2);font-style:italic}
.info .sub i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(58,42,24,.5)}
.info .stats{display:flex;margin:12px 0;border:1px solid var(--edge);background:rgba(255,255,255,.2)}
.info .stat{flex:1;padding:7px 4px;text-align:center}
.info .stat+.stat{border-left:1px solid var(--edge)}
.info .stat b{display:block;font-family:'IM Fell English',serif;font-size:16px;font-weight:400}
.info .stat span{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.info p.desc{font-size:13px;line-height:1.6}
.info .pk{margin-top:11px;padding-top:10px;border-top:1px solid rgba(138,106,70,.45)}
.info .pk h4{font-family:'IM Fell English SC',serif;font-size:11.5px;font-weight:400;letter-spacing:.06em;color:var(--ink-2);margin-bottom:3px}
.info .pk p{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.seek{padding:11px 16px 9px;border-bottom:1px double var(--edge)}
.seek input{width:100%;font-family:'Spectral',Georgia,serif;font-size:12.5px;color:var(--ink);
  background:rgba(255,255,255,.35);border:1px solid var(--edge);padding:6px 9px;outline:none}
.seek input::placeholder{color:var(--ink-3);font-style:italic}
.seek input:focus{background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(138,106,70,.35)}
.seek .row{display:flex;gap:6px;margin-top:7px;align-items:stretch}
.seek select{flex:1;font-family:'Spectral',Georgia,serif;font-size:12px;color:var(--ink);
  background:rgba(255,255,255,.35);border:1px solid var(--edge);padding:5px 7px;outline:none}
.seek button{flex:none;font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.05em;
  color:var(--ink);background:var(--parch-hi);border:1px solid var(--edge);padding:5px 12px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,42,24,.22)}
.seek button:hover{background:#f7edd4}
.seek button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(58,42,24,.22)}
.seek .cnt{margin-top:6px;font-size:10.5px;font-style:italic;color:var(--ink-3);text-align:center}
.band.off{display:none}
.filters{padding:10px 16px;border-bottom:1px double var(--edge);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:transparent;
  border:1px solid var(--edge);padding:3px 9px;cursor:pointer;font-family:'Spectral',serif}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed=false]{opacity:.38}
.chip:hover{background:rgba(255,255,255,.25)}

#list{flex:1;overflow-y:auto;padding-bottom:18px}
#list::-webkit-scrollbar{width:9px}
#list::-webkit-scrollbar-track{background:rgba(138,106,70,.12)}
#list::-webkit-scrollbar-thumb{background:rgba(138,106,70,.5)}
.band{font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.08em;color:var(--ink-2);
  padding:14px 18px 5px;text-align:center}
.band::after{content:'';display:block;width:44px;height:1px;background:var(--edge);margin:5px auto 0;opacity:.6}
.site{display:flex;align-items:baseline;gap:9px;padding:6px 18px;cursor:pointer;border-left:3px solid transparent}
.site:hover,.site.on{background:rgba(255,255,255,.32);border-left-color:var(--crimson)}
.site .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(1px);border:1px solid rgba(58,42,24,.45)}
.site .nm{font-family:'IM Fell English',serif;font-size:14px;line-height:1.3;flex:1}
.site .tw{display:block;font-family:'Spectral',serif;font-size:10.5px;color:var(--ink-3);font-style:italic}
.site .el{font-size:11px;color:var(--ink-3);flex:none;font-style:italic}
.site.off{display:none}
.info.off{display:none!important}
.note{padding:12px 18px;font-size:10.5px;line-height:1.6;color:var(--ink-3);border-top:1px double var(--edge);font-style:italic}

@media(hover:none){#tip{display:none!important}}

@media(max-width:860px){
  #app{flex-direction:column}
  #stage{flex:none;height:44dvh;min-height:220px;width:100%}
  #panel{
    flex:1;width:100%;min-height:0;
    border-left:none;border-top:3px double var(--edge);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #panel header{padding:11px 16px 9px}
  #panel header h2{font-size:15px}
  #panel header p{display:none}

  #tools{top:auto;bottom:12px;right:10px;gap:8px}
  #tools button{width:44px;height:44px;font-size:19px}

  .filters{padding:10px 12px;gap:7px}
  .chip{padding:7px 11px;font-size:12.5px}
  .band{padding:15px 16px 5px}
  .site{padding:12px 16px}
  .site .nm{font-size:15px}
  .site .tw{font-size:11.5px}
  .site .el{font-size:12px}
  .info{padding:14px 16px 18px}
  .info .x{width:34px;height:34px;font-size:17px}
  .info p.desc{font-size:13.5px}
  #list{-webkit-overflow-scrolling:touch}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tools">
      <button id="b-in" aria-label="Zoom in">+</button>
      <button id="b-out" aria-label="Zoom out">−</button>
      <button id="b-reset" aria-label="Reset">✦</button>
    </div>
    <div id="tip"><div class="n"></div><div class="m"></div></div>
  </div>

  <aside id="panel">
    <header>
      <h2>Connecticut Trails</h2>
      <p id="subhead">Statewide &mdash; ordered by time from Milford</p>
    </header>
    <div class="seek">
      <input id="q" type="search" autocomplete="off" placeholder="Search by name, town, or minutes away&hellip;">
      <div class="row">
        <select id="tsel">
          <option value="9999">Any drive</option>
          <option value="15">Within 15 min</option>
          <option value="30">Within 30 min</option>
          <option value="45">Within 45 min</option>
          <option value="60">Within 1 hour</option>
          <option value="90">Within 1&frac12; hours</option>
          <option value="120">Within 2 hours</option>
        </select>
        <button id="rand" type="button">Random</button>
      </div>
      <div class="cnt" id="cnt"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </aside>
</div>

const SITES = [{"n": "Ansonia Nature Center", "lat": 41.345, "lon": -73.0535, "c": "preserve", "b": "New Haven", "town": "Ansonia", "mi": 8.5, "min": 24, "d": "Well-marked trails, a pond, and a small nature center with live animals. Ranger-led hikes.", "p": "10 Deerfield Rd, ample lot. Closed Sundays, so the gate matters here."}, {"n": "BeaverBrook Trailhead", "lat": 41.2166, "lon": -73.0787, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.2, "min": 8, "d": "Flat one-mile loop with a marsh boardwalk. Good birding; some highway noise.", "p": "Small pull-off lot at the trail entrance off Naugatuck Ave. Room for 8–10 cars, almost never full."}, {"n": "Big Gulph", "lat": 41.362, "lon": -72.786, "c": "rwa", "town": "North Branford", "mi": 17.0, "min": 33, "d": "No reservoir here — mostly wide woods roads with side trails, deep quiet, and almost no one else. Good for long easy miles rather than scenery.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map, the trailhead is not obvious from the road.", "b": "New Haven"}, {"n": "Birchbank Mountain", "lat": 41.3553, "lon": -73.1453, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 10.3, "min": 30, "d": "Rugged Shelton open space climbing 250 feet from the rail line to a river bluff overlook. Some blowdowns across the trail.", "p": "Trailhead parking off Birchbank St / Dexter Dr — room for only a few cars. Map kiosk at the head."}, {"n": "Bluff Head", "lat": 41.408, "lon": -72.6965, "c": "hike", "town": "Guilford", "mi": 22.6, "min": 38, "d": "The best shoreline-region viewpoint — a steep traprock cliff on the Mattabesett Trail looking out over Meyerhuber Pond and miles of forest. Never crowded.", "p": "Small lots on Durham Rd (Route 77). Free. Trail is narrow along the cliff edge — keep dogs close.", "b": "New Haven"}, {"n": "Branford Supply Ponds", "lat": 41.3006, "lon": -72.805, "c": "hike", "town": "Branford", "mi": 14.1, "min": 23, "d": "A genuinely good trail complex around several scenic ponds, mostly wide and easy with a few climbs. One island is a bird sanctuary. Connects to Queach and Saltonstall Mountain for 800+ contiguous acres. Some blue-trail damage remains from the 2020 tornado.", "p": "Lot off Short Beach Rd. Free, no permit. Several roadside pull-offs if the lot is full. Can be muddy after rain.", "b": "New Haven"}, {"n": "Branford Trolley Trail", "lat": 41.2696, "lon": -72.7573, "c": "walk", "town": "Branford", "mi": 15.8, "min": 26, "d": "Flat, straight former trolley bed running out along tidal marsh to the Sound, with a red steel footbridge and a long concrete causeway. Easy enough for small children.", "p": "Parking at both ends of the trail. Free. Muddy in places after rain.", "b": "New Haven"}, {"n": "Case Pond / Larkin State Park Trail", "lat": 41.533, "lon": -73.147, "c": "walk", "town": "Middlebury", "mi": 21.9, "min": 43, "d": "Ten-mile linear trail on an old railbed running from Southbury to Naugatuck. Flat, wooded, popular with riders and cyclists.", "p": "Free lots off Route 188 and Whittemore Rd.", "b": "New Haven"}, {"n": "Coastal Center, Milford Point", "lat": 41.1759, "lon": -73.1016, "c": "preserve", "b": "New Haven", "town": "Milford", "mi": 4.0, "min": 13, "d": "CT Audubon sanctuary at the Housatonic mouth. Boardwalk to the Sound, observation tower, active osprey nest.", "p": "Small lot at 1 Milford Point Rd shared with Smith Point. Narrow residential road; caps out early on summer weekends. Closed Mondays."}, {"n": "East Rock Park", "lat": 41.3296, "lon": -72.9046, "c": "hike", "b": "New Haven", "town": "New Haven", "mi": 10.8, "min": 22, "d": "Steep stone steps to the summit monument. Best skyline view in the region — New Haven, the harbor, and the Sound.", "p": "Farnam Drive lot at the top is free but small, full by early afternoon on nice weekends. College Woods lot off Cold Spring St is bigger. Summit road closes seasonally."}, {"n": "Eisenhower Park", "lat": 41.2502, "lon": -73.0534, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.9, "min": 8, "d": "Town park with wooded trails and a story-book walk behind the playground and splash pad.", "p": "780 North St. Bear right — the left-hand lot is residents-only."}, {"n": "Elderslie Preserve", "lat": 41.38, "lon": -73.0333, "c": "hike", "b": "New Haven", "town": "Woodbridge", "mi": 10.9, "min": 26, "d": "Rock scrambles, vernal pools, and plank walks over marshland. Good beginner hike with real variety.", "p": "Gravel lot on Peck Hill Rd. Google and Waze overshoot the entrance by roughly 1,000 feet — watch for it early. QR trail map posted in the lot."}, {"n": "Farm River State Park", "lat": 41.2561, "lon": -72.8567, "c": "walk", "town": "East Haven", "mi": 10.6, "min": 22, "d": "One of the newest and least known state parks — 61 acres of bluffs and marsh where the Farm River meets the Sound. Short, easy, with osprey overhead.", "p": "Use the lot at 150 Short Beach Rd. Parking is limited and the Mansfield Grove Rd approach dead-ends into private property — do not follow GPS there.", "b": "New Haven"}, {"n": "Farmington Canal Heritage Trail", "lat": 41.3237, "lon": -72.9306, "c": "walk", "town": "Hamden", "mi": 9.6, "min": 22, "d": "Paved rail trail running from New Haven north toward Massachusetts, flat and shaded with historic canal locks along the way.", "p": "Free lots in Hamden, Cheshire and Southington. Lock 12 is the best starting point.", "b": "New Haven"}, {"n": "Genesee", "lat": 41.352, "lon": -72.628, "c": "rwa", "town": "Madison", "mi": 23.9, "min": 42, "d": "Nearly twelve miles of woods roads and side trails with some 19th-century quarry history along the way. Biking allowed April 15 to December 31.", "p": "Gated entrance on Durham Rd (Route 79) south of County Road. Permit and code required. No dogs. Location on this map is approximate — confirm on the RWA map.", "b": "New Haven"}, {"n": "Gristmill Open Space", "lat": 41.2787, "lon": -73.133, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 5.5, "min": 18, "d": "Quiet riverside walk along the Far Mill River, which is stocked with trout.", "p": "Small lot at 54 Mill St."}, {"n": "Hubbard Park & Castle Craig", "lat": 41.5615, "lon": -72.829, "c": "hike", "town": "Meriden", "mi": 26.2, "min": 51, "d": "Steep Metacomet Trail climbing to a stone tower on East Peak with the widest view in central Connecticut. Drivable in season.", "p": "Roadside parking on Peak Dr, or the large free Hubbard Park lot below.", "b": "New Haven"}, {"n": "Indian Well State Park", "lat": 41.3389, "lon": -73.1232, "c": "hike", "b": "New Haven", "town": "Shelton", "mi": 8.7, "min": 24, "d": "Waterfall five minutes from the car, plus blue/white trails climbing to a Housatonic overlook. No swimming.", "p": "Two options: the small roadside lot right at the falls (fills fast) or the main lot at 1 Indian Well Rd by the river. Free with CT plates."}, {"n": "Jared Eliot Preserve", "lat": 41.271, "lon": -72.6845, "c": "preserve", "b": "New Haven", "town": "Guilford", "mi": 19.6, "min": 30, "d": "Guilford Land Trust parcel with a small trail system and a standout marsh view. Primitive camping sites.", "p": "Roadside only, off Mulberry Farms Rd."}, {"n": "Lake Bethany", "lat": 41.4198, "lon": -72.9647, "c": "rwa", "town": "Bethany", "mi": 14.4, "min": 32, "d": "A wide loop road around a pretty reservoir with brief water views. Plainer than Chamberlain, but quiet and easy walking.", "p": "Gated RWA lot; permit and code required.", "b": "New Haven"}, {"n": "Lake Chamberlain", "lat": 41.3992, "lon": -72.9881, "c": "rwa", "town": "Bethany", "mi": 12.7, "min": 28, "d": "About 7.5 miles of trail, with a wide woods road circling the reservoir — roughly two miles a lap, stroller-friendly. Horses are permitted, so expect to share.", "p": "Gated RWA lot; permit and gate code required. Do not let GPS route you via Sperry Road — it is a mile of narrow dirt and gated in winter. No dogs.", "b": "New Haven"}, {"n": "Lake Gaillard", "lat": 41.3445, "lon": -72.7777, "c": "rwa", "town": "North Branford", "mi": 16.7, "min": 32, "d": "The largest RWA reservoir, ringed by a 6.7-mile perimeter road. Access is the most restricted of the properties — much of it opens only for permit holders on posted days and for the annual walkathon.", "p": "Gated; RWA permit required and access is limited. Check current rules with the RWA before driving out.", "b": "New Haven"}, {"n": "Lake Saltonstall", "lat": 41.2973, "lon": -72.8375, "c": "rwa", "town": "Branford", "mi": 12.5, "min": 24, "d": "Nine miles of trails around a stocked traprock lake, plus a 1.5-mile interpretive nature trail. Biking allowed; boat rental and a wheelchair-accessible fishing pier in season.", "p": "Two gated entrances off Hosley Ave. RWA permit required. No dogs, no swimming.", "b": "New Haven"}, {"n": "Lake Wintergreen", "lat": 41.3599, "lon": -72.9646, "c": "hike", "b": "New Haven", "town": "Hamden", "mi": 10.6, "min": 26, "d": "1.5-mile lake loop (white to red/white), rocky and rooty through the middle third. Connects up to the West Rock cave and overlook.", "p": "Lot off Main St in Hamden. Trickiest on the list — GPS routes people onto a private road nearby, and the lot is tiny and full by mid-morning weekends. Go early."}, {"n": "Larkin Bridle Trail", "lat": 41.493, "lon": -73.137, "c": "walk", "town": "Oxford", "mi": 19.1, "min": 38, "d": "Wide flat former railbed running ten miles through woods and past ponds, shared with horses and bikes.", "p": "Free lots off Route 188. Limited spaces.", "b": "New Haven"}, {"n": "Long Wharf Nature Preserve", "lat": 41.2852, "lon": -72.9258, "c": "walk", "town": "New Haven", "mi": 8.0, "min": 20, "d": "Short shoreline loop on New Haven Harbor with thousands of fiddler crabs in the mud. Urban and a bit rough around the edges.", "p": "Free roadside parking along Long Wharf Dr.", "b": "New Haven"}, {"n": "Maltby Lakes", "lat": 41.3079, "lon": -72.9844, "c": "rwa", "town": "West Haven", "mi": 7.0, "min": 16, "d": "Three linked reservoirs with rolling trails and lake views minutes from New Haven. The Mark Schaefer Trail rings the property; a power-line clearing on the west ridge opens a view of the city skyline. Mountain biking allowed.", "p": "Small gated lot off Derby Turnpike (Route 34). RWA permit required — you get a gate code with it. Closed Saturdays.", "b": "New Haven"}, {"n": "Millers Pond State Park", "lat": 41.4758, "lon": -72.632, "c": "hike", "town": "Durham", "mi": 28.1, "min": 54, "d": "White and blue trails ring a deep clear pond in a 1.5-mile loop, easy at the start and steep and rocky on the far side. Real swimming, no lifeguards.", "p": "Large free lot at 344 Foot Hills Rd with accessible spaces.", "b": "New Haven"}, {"n": "Nancy's Meadow", "lat": 41.182, "lon": -73.098, "c": "preserve", "b": "New Haven", "town": "Milford", "mi": 3.5, "min": 12, "d": "Small Milford Land Trust parcel with a short path. Punches above its weight for birding and botany.", "p": "No lot — street parking on 1st Ave, short walk in."}, {"n": "Naugatuck River Greenway", "lat": 41.49, "lon": -73.048, "c": "walk", "town": "Naugatuck", "mi": 18.5, "min": 37, "d": "Paved riverside path through the old mill towns of the Naugatuck Valley, expanding section by section.", "p": "Free lots in Naugatuck, Beacon Falls and Derby.", "b": "New Haven"}, {"n": "Naugatuck State Forest", "lat": 41.4545, "lon": -73.0808, "c": "hike", "town": "Beacon Falls", "mi": 16.1, "min": 33, "d": "Gorge trail along Spruce Brook with a run of waterfalls and overlooks. Hunting permitted — wear orange in season.", "p": "Spruce Brook lot off Cold Springs Rd. Approach from the Naugatuck side; the Beacon Falls road is badly rutted.", "b": "New Haven"}, {"n": "Osbornedale State Park", "lat": 41.3397, "lon": -73.1, "c": "hike", "b": "New Haven", "town": "Derby", "mi": 8.4, "min": 22, "d": "Pond, open fields, and shaded trails full of glacial erratics. Some sections overgrown — check for ticks.", "p": "43 Chatfield St. Best parking on this list: big paved lot, restrooms, right by the pond."}, {"n": "Peter's Rock Park", "lat": 41.3406, "lon": -72.8545, "c": "hike", "town": "North Haven", "mi": 13.3, "min": 25, "d": "Short steep climb to a traprock summit with a genuinely big view. About 300 acres, dog friendly, with a story trail for kids.", "p": "Lot at 133 Middletown Ave. Free. Trails beyond the red blaze are poorly marked with many unmapped side paths — bring a map.", "b": "New Haven"}, {"n": "Pine Hill Trails", "lat": 41.386, "lon": -73.026, "c": "rwa", "town": "Seymour", "mi": 11.4, "min": 29, "d": "One of the smaller RWA holdings but among the more interesting underfoot, straddling the Seymour–Woodbridge line. Appeals mostly to people nearby.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map before going.", "b": "New Haven"}, {"n": "Pine Lake", "lat": 41.3191, "lon": -73.1093, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 7.2, "min": 22, "d": "Gateway to Shelton’s open-space trail network. Flat, pine-shaded, bike and dog friendly.", "p": "130 Shelton Ave. Limited spaces plus a few pull-offs along the trail. No restrooms."}, {"n": "Quinnipiac River State Park", "lat": 41.436, "lon": -72.862, "c": "walk", "town": "North Haven", "mi": 17.8, "min": 36, "d": "Undeveloped riverside park with flat trails through floodplain forest and marsh. Good birding, few people.", "p": "Roadside parking on Banton St. Free.", "b": "New Haven"}, {"n": "River Highlands State Park", "lat": 41.6194, "lon": -72.6314, "c": "hike", "town": "Cromwell", "mi": 35.1, "min": 66, "d": "Bluff-top views over the Connecticut River and short trails you can combine into a longer walk. Rarely crowded.", "p": "Free lot at 113 Field Rd.", "b": "New Haven"}, {"n": "Roaring Brook Falls", "lat": 41.4818, "lon": -72.9349, "c": "hike", "b": "New Haven", "town": "Cheshire", "mi": 19.0, "min": 38, "d": "Tallest single-drop waterfall in Connecticut. The red trail climbs steeply on loose gravel; best views in early spring or late fall.", "p": "Access via Roaring Brook Park, 857 Roaring Brook Rd, at the end of a small dead-end street. Tight — a handful of cars."}, {"n": "Rockland Preserve", "lat": 41.4244, "lon": -72.6516, "c": "open", "town": "Madison", "mi": 25.2, "min": 44, "d": "700 acres best known for the best mountain-bike singletrack on the shoreline, but good hiking too. Trail junctions are poorly signed — bring a downloaded map.", "p": "Lot on Durham Rd (Route 79), with a skills area by the entrance. Free.", "b": "New Haven"}, {"n": "Roosevelt Forest", "lat": 41.252, "lon": -73.1278, "c": "hike", "b": "New Haven", "town": "Stratford", "mi": 4.2, "min": 15, "d": "2.6-mile loop, well blazed and maintained, with intersecting trails to shorten or extend. Rarely crowded.", "p": "700 Peters Ln — free, spacious, paved. AllTrails sends people to the wrong trailhead. Posted Stratford-residents-only, loosely enforced off-season."}, {"n": "Saltonstall Mountain Preserve", "lat": 41.3215, "lon": -72.8065, "c": "hike", "town": "Branford", "mi": 14.6, "min": 25, "d": "Steep traprock ridge straddling the Branford–North Branford line, with some of the highest points in Branford. Wide ridge trails now connect through to Supply Pond and Queach.", "p": "The weak point: Google Maps sends you to a residential dead end and there is no real lot. Park at Supply Ponds or the Laurel Hill Rd access and walk in. Trail colors changed in 2019 — get a current map.", "b": "New Haven"}, {"n": "Silver Sands State Park", "lat": 41.2004, "lon": -73.0677, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.6, "min": 10, "d": "Boardwalk along the beach with a sandbar out to Charles Island at low tide. Flat, wide, open year-round.", "p": "Main lot, 1 Silver Sands Pkwy. Paved and large; free with CT plates (~$22 out-of-state in season). Long boardwalk walk from lot to sand."}, {"n": "Sleeping Giant State Park", "lat": 41.421, "lon": -72.8992, "c": "hike", "town": "Hamden", "mi": 15.9, "min": 33, "d": "The marquee hike in the region. Tower Trail is an easy-moderate gravel climb to a stone tower; the blue traverse is a full day.", "p": "Main lot at 200 Mt Carmel Ave — paid, free with CT plates. East lot on Chestnut Ln is quieter.", "b": "New Haven"}, {"n": "Solomon Woods", "lat": 41.2497, "lon": -73.0622, "c": "hike", "b": "New Haven", "town": "Milford", "mi": 1.9, "min": 9, "d": "The best trails inside Milford. Stone ruins, streams, real elevation change, and it drains well after rain.", "p": "Dedicated lot at 811 W River St, right across from the trailhead. Small, but rarely more than a few cars."}, {"n": "Southford Falls State Park", "lat": 41.4589, "lon": -73.1647, "c": "hike", "b": "New Haven", "town": "Southbury", "mi": 17.2, "min": 40, "d": "Covered bridge and a run of cascades right off the parking area. Boardwalk section is in rough shape.", "p": "175 Quaker Farms Rd. Dirt lot on the side of the road with no marked spots; the falls are a few steps away."}, {"n": "Sperry Falls", "lat": 41.3836, "lon": -72.9881, "c": "rwa", "b": "New Haven", "town": "Woodbridge", "mi": 11.7, "min": 30, "d": "Half-mile walk in along a rocky road to a cold, deep falls pool. Quiet even on weekends.", "p": "Park near the beginning of the dirt road, not the end — people are ticketed at the far end around dusk. RWA recreation permit required to leave the main road."}, {"n": "Stratford Greenway", "lat": 41.1742, "lon": -73.1289, "c": "walk", "b": "New Haven", "town": "Stratford", "mi": 5.0, "min": 14, "d": "Short paved waterfront path with benches over the water. Quiet, good for a quick lap.", "p": "Lot at 609 Main St by the waterfront."}, {"n": "Wadsworth Big Falls", "lat": 41.533, "lon": -72.698, "c": "walk", "town": "Middletown", "mi": 28.4, "min": 54, "d": "The main falls at Wadsworth reached by a short flat path from a separate lot — the quickest waterfall payoff in central Connecticut.", "p": "Small free lot on Cherry Hill Rd, separate from the main park entrance.", "b": "New Haven"}, {"n": "Wadsworth Falls State Park", "lat": 41.5369, "lon": -72.686, "c": "hike", "town": "Middletown", "mi": 29.0, "min": 55, "d": "Big Falls on the main orange trail, plus a smaller cascade on a side path. About 6.5 miles of trail total.", "p": "Large free lot at 721 Wadsworth St. Restrooms. Trail markings thin where colors split.", "b": "New Haven"}, {"n": "Webb Mountain Park", "lat": 41.373, "lon": -73.1666, "c": "hike", "b": "New Haven", "town": "Monroe", "mi": 11.8, "min": 33, "d": "Easy climb to a Housatonic River overlook, plus ten primitive campsites. Links to the blue Paugussett Trail all the way to Indian Well.", "p": "Free lot off Old Fish House Rd. Limited spaces, but the park is quiet enough that it rarely matters."}, {"n": "West River Greenway", "lat": 41.3623, "lon": -72.9827, "c": "rwa", "b": "New Haven", "town": "Woodbridge", "mi": 10.4, "min": 28, "d": "Red/blue loop is flat and shaded along the stream. Head to the back of the preserve to escape Route 69 noise.", "p": "Roadside lot off Litchfield Turnpike; the Darling House museum lot is an easier alternative."}, {"n": "West Rock Ridge State Park", "lat": 41.3446, "lon": -72.9662, "c": "hike", "b": "New Haven", "town": "New Haven", "mi": 9.6, "min": 23, "d": "Basalt ridge trail past Judges Cave to a long clifftop overlook. Green trail to the summit is the classic.", "p": "1134 Wintergreen Ave. Gates close for winter; parking outside and walking in is normal."}, {"n": "West Sugarloaf", "lat": 41.3745, "lon": -72.7348, "c": "rwa", "town": "Guilford", "mi": 19.7, "min": 35, "d": "Mostly footpaths rather than woods roads, which makes it the most trail-like of the RWA properties. The White Owl Trail is an easy four-mile loop — expect briars along the edges.", "p": "Gated RWA lot with a well-kept porta-john, unusually. Permit and code required.", "b": "New Haven"}, {"n": "Westwoods", "lat": 41.2695, "lon": -72.6957, "c": "hike", "town": "Guilford", "mi": 19.0, "min": 30, "d": "One of the great trail networks on the shoreline — 40 miles of trail through boulder fields, rock walls, swamp crossings and tidal marsh. So many options that it never feels crowded.", "p": "Sam Hill Rd entrance has roadside parking for 5–6 cars; larger lots at Peddlers Rd and Denison Dr. Free. Dog friendly.", "b": "New Haven"}, {"n": "Wharton Brook State Park", "lat": 41.4251, "lon": -72.8376, "c": "walk", "town": "North Haven", "mi": 18.0, "min": 32, "d": "Small, old-fashioned state park with a stocked pond, a covered bridge, picnic groves and easy walking. More a picnic spot than a hike.", "p": "Lot off US-5. Free with CT plates. Restrooms and porta-johns on site.", "b": "New Haven"}, {"n": "Aspetuck Land Trust Haskins Preserve", "lat": 41.131, "lon": -73.3546, "c": "open", "town": "Westport", "mi": 16.7, "min": 34, "d": "Sixteen acres of streams, a small pond and picnic tables. A quick quiet walk rather than a hike.", "p": "Small roadside parking at 22 Green Acre Ln. Free.", "b": "Fairfield"}, {"n": "Bear Mountain Reservation", "lat": 41.4464, "lon": -73.467, "c": "hike", "town": "Danbury", "mi": 26.3, "min": 51, "d": "Well-marked town preserve with trails descending to the water and exercise stations along the way.", "p": "Paved free lot for about 30 cars.", "b": "Fairfield"}, {"n": "Collis P. Huntington State Park", "lat": 41.332, "lon": -73.3593, "c": "hike", "town": "Redding", "mi": 17.4, "min": 36, "d": "Nine hundred acres of wide dirt roads, ponds and brooks, with bronze animal sculptures at the gate. Flat and forgiving.", "p": "Large free lot at 9 Dodgingtown Rd.", "b": "Fairfield"}, {"n": "Devil's Den Preserve", "lat": 41.2372, "lon": -73.396, "c": "preserve", "town": "Weston", "mi": 17.6, "min": 36, "d": "Connecticut's largest Nature Conservancy holding — 1,750 acres, 20 miles of well-kept trail, and Godfrey Pond with sawmill ruins.", "p": "Lot at 33 Pent Rd with a touch-screen map. Free but small, no overflow. Arrive early.", "b": "Fairfield"}, {"n": "Greenwich Audubon Center", "lat": 41.097, "lon": -73.6879, "c": "preserve", "town": "Greenwich", "mi": 33.8, "min": 63, "d": "Beginner-friendly trails around a lake and open meadow, with an interpretive building. No dogs.", "p": "Free lot at 613 Riversville Rd. Center closed Monday through Wednesday.", "b": "Fairfield"}, {"n": "Hemlock Hills", "lat": 41.3502, "lon": -73.5049, "c": "hike", "town": "Ridgefield", "mi": 24.8, "min": 48, "d": "Big glacial boulders, technical rock gardens and a lookout at the Charles Ives cabin site. A maze of trails — bring a map.", "p": "Roadside parking off Route 7. Free. Poison ivy is heavy.", "b": "Fairfield"}, {"n": "Indian Ledge Park", "lat": 41.2792, "lon": -73.2185, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 9.3, "min": 24, "d": "Trails and river access with a large playground and splash pad. Popular for easy mountain biking.", "p": "Small lot off Indian Ledge Park Rd. Trumbull resident sticker required; enforcement is active."}, {"n": "Kettletown State Park", "lat": 41.4272, "lon": -73.2042, "c": "hike", "b": "Fairfield", "town": "Southbury", "mi": 16.1, "min": 38, "d": "Brook trail is the scenic pick; blue/white runs longer. Lakeside camping on Lake Zoar.", "p": "Paved lot at 1400 Georges Hill Rd. Plenty of space, free with CT plates."}, {"n": "Larsen Wildlife Sanctuary", "lat": 41.2023, "lon": -73.2936, "c": "preserve", "b": "Fairfield", "town": "Fairfield", "mi": 12.4, "min": 27, "d": "160+ acres of flat trails and boardwalks through ponds and marsh. Stroller and wheelchair friendly. No dogs.", "p": "Shared lot at 2325 Burr St with the CT Audubon center. Easy and free; small donation suggested."}, {"n": "Mianus River Park", "lat": 41.0819, "lon": -73.5829, "c": "hike", "town": "Stamford", "mi": 28.9, "min": 55, "d": "Many intersecting trails along a rocky river, with a nature-trail section closed to dogs and bikes.", "p": "Free lots on both the Stamford and Greenwich sides. Stamford lots are small.", "b": "Fairfield"}, {"n": "Old Mine Park", "lat": 41.2883, "lon": -73.2266, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 9.9, "min": 25, "d": "Historic mineral-mine site on the rail trail, with a gazebo and water. Good lunch stop.", "p": "121 Old Mine Rd. Has a porta-john. Trumbull resident sticker required."}, {"n": "Paugussett State Forest", "lat": 41.4132, "lon": -73.2068, "c": "hike", "town": "Newtown", "mi": 15.3, "min": 35, "d": "Rugged and varied, with a waterfall and Housatonic river frontage. The blue-blazed Paugussett Trail runs through; most blue trails are closed to bikes.", "p": "Lot off Echo Valley Rd. Free. Gets loud and busy down by the water on summer weekends.", "b": "Fairfield"}, {"n": "Pequonnock Valley WMA", "lat": 41.2476, "lon": -73.2006, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 7.7, "min": 22, "d": "Paved rail trail on one bank, technical singletrack on the other. Runs all the way to Indian Well.", "p": "Tait Road lot. Modest size — people get ticketed for street parking near the trail start, so use the lot. Old Mine Park is the better north-end option."}, {"n": "Pine Mountain", "lat": 41.3527, "lon": -73.5015, "c": "hike", "town": "Ridgefield", "mi": 24.7, "min": 48, "d": "Difficult but short climb to open ledges. Cell service is poor — photograph the map at the trailhead.", "p": "Limited roadside parking. Free, no restrooms.", "b": "Fairfield"}, {"n": "Putnam Memorial State Park", "lat": 41.376, "lon": -73.411, "c": "walk", "town": "Redding", "mi": 21.2, "min": 42, "d": "Connecticut's oldest state park, preserving a Revolutionary War winter encampment with easy paths among the hut sites.", "p": "Free lot off Route 58. Museum seasonal.", "b": "Fairfield"}, {"n": "Sherwood Island State Park", "lat": 41.1155, "lon": -73.3331, "c": "walk", "town": "Westport", "mi": 16.1, "min": 33, "d": "Three-mile loop from woods out to a beach promenade, with a 9/11 memorial and wide Sound views.", "p": "Large paved lots, free with CT plates.", "b": "Fairfield"}, {"n": "Tarrywile Park", "lat": 41.382, "lon": -73.456, "c": "hike", "town": "Danbury", "mi": 23.4, "min": 46, "d": "Seven hundred acres and 21 miles of trail around a mansion, ponds and open hills. The largest municipal park in the region.", "p": "Free lot at 70 Southern Blvd. Occasionally closed for weddings.", "b": "Fairfield"}, {"n": "Trout Brook Valley", "lat": 41.2455, "lon": -73.3426, "c": "open", "town": "Weston", "mi": 14.9, "min": 31, "d": "A thousand acres of Aspetuck Land Trust woods, an orchard, and long loops. Blazes don't always match the map.", "p": "Several small lots; Bradley Rd is the main one. Free.", "b": "Fairfield"}, {"n": "Weir Farm National Historical Park", "lat": 41.2576, "lon": -73.456, "c": "walk", "town": "Wilton", "mi": 20.8, "min": 41, "d": "The only national park in Connecticut — an American Impressionist's home and studio, with easy trails to Weir Pond and borrowable art supplies.", "p": "Free lot at 735 Nod Hill Rd. Grounds open sunrise to sunset; buildings closed Nov–Apr and Mon–Tue.", "b": "Fairfield"}, {"n": "Wooster Mountain State Park", "lat": 41.348, "lon": -73.462, "c": "hike", "town": "Danbury", "mi": 22.7, "min": 45, "d": "Steep climb on the Ives Trail with rocky ledges. A shooting range across Route 7 is audible on weekends.", "p": "Free lot off Route 7; easy to drive past.", "b": "Fairfield"}, {"n": "Above All State Park", "lat": 41.664, "lon": -73.437, "c": "walk", "town": "Warren", "mi": 36.3, "min": 68, "d": "One of the highest points in the region with a wide view east over the Litchfield Hills. Minimal trails — it's about the vista.", "p": "Roadside parking. Free, undeveloped.", "b": "Litchfield"}, {"n": "Bear Mountain", "lat": 41.9464, "lon": -73.4926, "c": "hike", "town": "Salisbury", "mi": 54.8, "min": 99, "d": "Connecticut's highest peak at 2,316 feet, climbed via the Appalachian Trail to a stone monument on the summit with views into three states.", "p": "Undermountain Trail lot on Route 41, about 3.5 miles north of Salisbury. Free, fills early on fall weekends.", "b": "Litchfield"}, {"n": "Bent of the River Audubon", "lat": 41.4724, "lon": -73.258, "c": "preserve", "town": "Southbury", "mi": 20.2, "min": 42, "d": "700 acres of meadow and woodland along the Pomperaug River, and one of the better birding spots in the region. Trails are unblazed — take the free map at the kiosk.", "p": "Free lot at 185 E Flat Hill Rd. No visitor center, no dogs. Picnic tables along the trails.", "b": "Litchfield"}, {"n": "Campbell Falls State Park", "lat": 42.0412, "lon": -73.227, "c": "hike", "town": "Norfolk", "mi": 57.2, "min": 103, "d": "A short walk to a 100-foot falls dropping through a rocky gorge on the Massachusetts line. Muddy in spring.", "p": "Small lot off Campbell Falls Rd. Free, no restrooms.", "b": "Litchfield"}, {"n": "Dennis Hill State Park", "lat": 41.972, "lon": -73.202, "c": "walk", "town": "Norfolk", "mi": 52.3, "min": 95, "d": "Drive or walk to a stone summit pavilion at 1,627 feet with views to Haystack and the Berkshires. Very little effort for a big view.", "p": "Free lot partway up; summit road seasonal.", "b": "Litchfield"}, {"n": "Flanders Nature Center", "lat": 41.6001, "lon": -73.2069, "c": "preserve", "town": "Woodbury", "mi": 27.2, "min": 52, "d": "Land trust property with a sugarhouse, easy loops, and a boggy section. Good for families.", "p": "Free lot at 5 Church Hill Rd. Office closed weekends but trails stay open.", "b": "Litchfield"}, {"n": "Haystack Mountain State Park", "lat": 42.006, "lon": -73.2118, "c": "hike", "town": "Norfolk", "mi": 54.7, "min": 99, "d": "Short but steep 1.2-mile climb to a 34-foot stone tower with a full 360-degree view into Massachusetts and New York.", "p": "Small free lot off Route 272. Restroom at the base. Gate closes early — arrive in good time.", "b": "Litchfield"}, {"n": "Hidden Valley Preserve", "lat": 41.6565, "lon": -73.3181, "c": "preserve", "town": "Washington", "mi": 32.9, "min": 62, "d": "Thoreau suspension bridge, an old mine, and a well-groomed trail network beside the Shepaug. Mostly gentle walking.", "p": "Main lot at 120 Bee Brook Rd. Free. Photograph the trail map at the kiosk — junctions are unsigned.", "b": "Litchfield"}, {"n": "Housatonic Meadows State Park", "lat": 41.8397, "lon": -73.3812, "c": "hike", "town": "Sharon", "mi": 45.8, "min": 84, "d": "Riverside camping and fly-fishing water along the Housatonic, with the Pine Knob Loop climbing off the Appalachian Trail nearby.", "p": "Roadside lot on US-7. Free. Route 7 traffic noise carries into the campground.", "b": "Litchfield"}, {"n": "Kent Falls State Park", "lat": 41.7763, "lon": -73.4179, "c": "hike", "town": "Kent", "mi": 42.6, "min": 78, "d": "A 250-foot cascade dropping in a series of falls, with a stone staircase climbing alongside to the top. Short but steep.", "p": "Large lot at 462 Kent Cornwall Rd. Free with CT plates, fee for out-of-state on weekends. Restrooms on site.", "b": "Litchfield"}, {"n": "Lake Waramaug State Park", "lat": 41.718, "lon": -73.38, "c": "walk", "town": "Kent", "mi": 38.1, "min": 71, "d": "Small shoreline park on one of the prettiest lakes in the state, with camping and flat lakeside walking.", "p": "Free with CT plates. Restrooms in season.", "b": "Litchfield"}, {"n": "Lovers Leap State Park", "lat": 41.543, "lon": -73.4087, "c": "hike", "town": "New Milford", "mi": 28.7, "min": 55, "d": "Iron bridge over the Housatonic, ruins, and overlooks above Lake Lillinonah. Compact but scenic.", "p": "Lot at 178 Short Woods Rd. Free, open 8am to sunset.", "b": "Litchfield"}, {"n": "Macedonia Brook State Park", "lat": 41.766, "lon": -73.493, "c": "hike", "town": "Kent", "mi": 43.8, "min": 80, "d": "Blue trail over Cobble Mountain gives one of the most demanding ridge walks in western Connecticut, with Catskill views.", "p": "Lot inside the park off Macedonia Brook Rd. Free with CT plates.", "b": "Litchfield"}, {"n": "Mohawk Mountain State Park", "lat": 41.8441, "lon": -73.2899, "c": "hike", "town": "Cornwall", "mi": 44.6, "min": 82, "d": "Summit road and trails to a lookout tower with one of the widest views in the state. Ski area in winter.", "p": "Drive the long summit road to lots near the tower. Free. Picnic areas all along the way up.", "b": "Litchfield"}, {"n": "Mount Tom State Park", "lat": 41.6953, "lon": -73.2779, "c": "hike", "town": "Washington", "mi": 34.6, "min": 65, "d": "Yellow trail climbs to a stone lookout tower above a small spring-fed pond. Swimming beach at the base.", "p": "Lot at Mount Tom Rd. Free with CT plates. Clean restrooms near the beach.", "b": "Litchfield"}, {"n": "Pine Knob Loop", "lat": 41.8332, "lon": -73.3836, "c": "hike", "town": "Sharon", "mi": 45.4, "min": 83, "d": "A 2.5-mile loop off the Appalachian Trail with steep rocky sections and a fine overlook of the Housatonic Valley. Go counter-clockwise.", "p": "Trailhead lot on US-7. Free, limited spaces, restrooms about a mile away at Housatonic Meadows.", "b": "Litchfield"}, {"n": "Pootatuck State Forest", "lat": 41.5113, "lon": -73.4902, "c": "hike", "town": "New Fairfield", "mi": 30.0, "min": 57, "d": "Climbs to overlooks above Candlewood Lake and Squantz Pond. Tough but rewarding; some junctions unmarked.", "p": "Park at Squantz Pond State Park; half the lot closes off-season. Fee in season.", "b": "Litchfield"}, {"n": "Squantz Pond State Park", "lat": 41.578, "lon": -73.483, "c": "walk", "town": "New Fairfield", "mi": 33.0, "min": 62, "d": "Swimming, boating and a shoreline trail beneath steep wooded slopes. Very busy in summer.", "p": "Paid lot; fills and closes by mid-morning on hot weekends.", "b": "Litchfield"}, {"n": "Steep Rock Preserve", "lat": 41.6208, "lon": -73.3232, "c": "preserve", "town": "Washington", "mi": 30.8, "min": 58, "d": "Old railroad tunnel, a swinging suspension bridge, and the Shepaug River looping below. The yellow trail to the tunnel is nearly flat.", "p": "Gravel lot at 2 Tunnel Rd, reached by a narrow one-lane road. Free.", "b": "Litchfield"}, {"n": "Sunny Valley / Iron Mountain", "lat": 41.575, "lon": -73.409, "c": "open", "town": "New Milford", "mi": 30.4, "min": 58, "d": "Nature Conservancy ridge with open farmland below and a climb to long views over the Housatonic Valley.", "p": "Small roadside lots. Free.", "b": "Litchfield"}, {"n": "Sunny Valley Preserve", "lat": 41.562, "lon": -73.421, "c": "preserve", "town": "New Milford", "mi": 30.1, "min": 57, "d": "Nature Conservancy farmland and woods with quiet loop trails and long views over the Housatonic Valley.", "p": "Small roadside lots off Long Mountain Rd. Free.", "b": "Litchfield"}, {"n": "Sweetcake Mountain", "lat": 41.4654, "lon": -73.4634, "c": "hike", "town": "New Fairfield", "mi": 26.9, "min": 52, "d": "Steep climb to a rocky overlook above Candlewood Lake. Blazes are faded — navigate carefully.", "p": "Roadside parking on Wood Creek Rd. Free, very limited.", "b": "Litchfield"}, {"n": "Twin Brooks Park", "lat": 41.2428, "lon": -73.1864, "c": "walk", "b": "Litchfield", "town": "Trumbull", "mi": 6.9, "min": 21, "d": "2.5-mile pond loop on paved paths. Farmers market on Thursdays.", "p": "Trumbull resident sticker required, front and back. Non-residents get $25 tickets and the signage is small."}, {"n": "White Memorial Conservation Center", "lat": 41.716, "lon": -73.214, "c": "preserve", "town": "Litchfield", "mi": 35.0, "min": 66, "d": "Four thousand acres and 35 miles of trail around Bantam Lake, including a boardwalk through swamp. The largest nature center in the state.", "p": "Free lots at the museum on Whitehall Rd and at several trailheads.", "b": "Litchfield"}, {"n": "American Legion State Forest", "lat": 41.918, "lon": -73.011, "c": "hike", "town": "Barkhamsted", "mi": 48.0, "min": 88, "d": "Across the Farmington River from People's Forest, with riverside camping, fly-fishing water and the Henry Buck Trail past old mill ruins.", "p": "Free lot off West River Rd. Campground fee in season.", "b": "Hartford"}, {"n": "Black Rock State Park", "lat": 41.6546, "lon": -73.1069, "c": "hike", "town": "Watertown", "mi": 29.9, "min": 57, "d": "Pond loop plus climbs onto the Mattatuck Trail, with campsites and a swimming beach.", "p": "Lot at 2065 Thomaston Rd. Free with CT plates.", "b": "Hartford"}, {"n": "Bull Pond Preserve", "lat": 41.7638, "lon": -73.047, "c": "open", "town": "Harwinton", "mi": 37.4, "min": 70, "d": "Seventy acres of forest, marsh and pond with wide easy paths and an observation platform.", "p": "Small paved lot on Locust Rd across from the fairgrounds — easy to miss, fits 3-4 cars.", "b": "Hartford"}, {"n": "Burr Pond State Park", "lat": 41.8705, "lon": -73.0925, "c": "walk", "town": "Torrington", "mi": 44.8, "min": 82, "d": "Easy 2.5-mile loop around a clean pond with a swimming beach, on the site of the world's first condensed-milk factory.", "p": "Lot at 385 Burr Mountain Rd. Free with CT plates, $15 out-of-state. Restrooms; fills fast in summer.", "b": "Hartford"}, {"n": "Dinosaur State Park", "lat": 41.6519, "lon": -72.6569, "c": "walk", "town": "Rocky Hill", "mi": 36.1, "min": 67, "d": "Five hundred Jurassic trackways under a geodesic dome, plus two miles of easy trails through an arboretum and swamp.", "p": "Large free lot at 400 West St. Exhibit fee charged; closed Mondays.", "b": "Hartford"}, {"n": "Enders State Forest", "lat": 41.9551, "lon": -72.8788, "c": "hike", "town": "Granby", "mi": 51.4, "min": 93, "d": "A chain of five waterfalls along Enders Brook, reached by a short trail with granite staircases and railings.", "p": "Roadside lots on Route 219. Free. Descents to the falls are steep.", "b": "Hartford"}, {"n": "Mattatuck State Forest", "lat": 41.6449, "lon": -73.0907, "c": "hike", "town": "Thomaston", "mi": 29.2, "min": 56, "d": "Blue-blazed Mattatuck Trail to Leatherman's Cave and the Black Rock overlook. Steep and rocky in places, and illegal ATV use has torn up sections.", "p": "Roadside parking on US-6. Free.", "b": "Hartford"}, {"n": "McLean Game Refuge", "lat": 41.9405, "lon": -72.7937, "c": "preserve", "town": "Granby", "mi": 51.4, "min": 93, "d": "Forty-four hundred acres left to the public by a former governor, with 20 miles of trail, well-signed junctions and a summit climb up the Barndoor Hills.", "p": "Free lots at 109 Salmon Brook St and the Barndoor Hills entrance on Barndoor Hills Rd. Leashed dogs allowed on most trails.", "b": "Hartford"}, {"n": "Metacomet Trail at Newgate", "lat": 41.9472, "lon": -72.7399, "c": "hike", "town": "East Granby", "mi": 52.6, "min": 95, "d": "Out-and-back ridge hiking with scenic overlooks; go as far as you like along the New England Trail.", "p": "Roadside parking on Newgate Rd. Free and limited — arrive early.", "b": "Hartford"}, {"n": "Nepaug State Forest", "lat": 41.81, "lon": -72.93, "c": "hike", "town": "New Hartford", "mi": 41.1, "min": 76, "d": "Quiet forest with the Tunxis Trail running through, plus ledges above the reservoir. Lightly visited.", "p": "Roadside parking on Route 202. Free.", "b": "Hartford"}, {"n": "Northwest Park", "lat": 41.894, "lon": -72.644, "c": "preserve", "town": "Windsor", "mi": 51.0, "min": 93, "d": "Almost 500 acres of meadow, marsh and woods with 12 miles of trail, a nature center and tobacco-barn museum.", "p": "Free lot at 145 Lang Rd.", "b": "Hartford"}, {"n": "Peak Mountain", "lat": 41.92, "lon": -72.763, "c": "hike", "town": "East Granby", "mi": 50.5, "min": 92, "d": "Short steep climb to a long ridge walk on the Metacomet with several open views west over the valley.", "p": "Roadside lot on Route 20. Free, small.", "b": "Hartford"}, {"n": "Penwood State Park", "lat": 41.872, "lon": -72.783, "c": "hike", "town": "Bloomfield", "mi": 47.0, "min": 86, "d": "Quieter neighbor to Talcott Mountain, with a paved loop road and the Metacomet Trail running the ridge.", "p": "Free lot on Route 185. Gate closes at sunset.", "b": "Hartford"}, {"n": "People's State Forest", "lat": 41.9252, "lon": -72.9988, "c": "hike", "town": "Barkhamsted", "mi": 48.6, "min": 89, "d": "Old-growth pines, the Jessie Gerard Trail with its 299 stone steps, Chaugham Lookout, and a small nature museum. Among the best hiking in the state.", "p": "Free lots along East River Rd. Restrooms at the museum. Avoid the red trail — it's out of use and easy to lose.", "b": "Hartford"}, {"n": "Ragged Mountain", "lat": 41.6339, "lon": -72.8082, "c": "hike", "town": "Berlin", "mi": 31.2, "min": 59, "d": "Cliff-top traprock loop with several vistas over the reservoirs. Rocky, muddy in places, and a real workout at 5+ miles.", "p": "Trailhead lot at 438 West Ln, or park at Timberlin golf course for the long loop. Free.", "b": "Hartford"}, {"n": "Rattlesnake Mountain", "lat": 41.7074, "lon": -72.8281, "c": "hike", "town": "Farmington", "mi": 35.5, "min": 66, "d": "Metacomet Trail climb to open ledges above the valley, with rock formations and caves along the way. Muddy at the base.", "p": "Small roadside lot on Route 6 (Colt Hwy). Free, limited.", "b": "Hartford"}, {"n": "Sessions Woods WMA", "lat": 41.7328, "lon": -72.9559, "c": "preserve", "town": "Burlington", "mi": 35.6, "min": 67, "d": "Seven hundred acres with a wide gravel main loop, a waterfall, beaver pond, observation tower and education center.", "p": "Large free lot at 341 Milford St. Exhibit building open weekdays only.", "b": "Hartford"}, {"n": "Stratton Brook State Park", "lat": 41.868, "lon": -72.828, "c": "walk", "town": "Simsbury", "mi": 46.1, "min": 84, "d": "Flat paved trails through pine woods to a pond, and one of the first fully wheelchair-accessible parks in the country.", "p": "Free with CT plates. Restrooms in season.", "b": "Hartford"}, {"n": "Sunnybrook State Park", "lat": 41.85, "lon": -73.064, "c": "hike", "town": "Torrington", "mi": 43.3, "min": 80, "d": "Undeveloped park along the Still River with quiet woods roads and stream crossings. No facilities at all.", "p": "Roadside parking on Newfield Rd. Free.", "b": "Hartford"}, {"n": "Talcott Mountain State Park", "lat": 41.8355, "lon": -72.7909, "c": "hike", "town": "Simsbury", "mi": 44.5, "min": 82, "d": "The classic Hartford-area hike: a steady climb up the traprock ridge to Heublein Tower and a view across the whole Farmington Valley.", "p": "Lot on Summit Ridge Dr. Free with CT plates, fills on weekends.", "b": "Hartford"}, {"n": "Topsmead State Forest", "lat": 41.7479, "lon": -73.153, "c": "walk", "town": "Litchfield", "mi": 36.6, "min": 68, "d": "A Tudor estate on a hilltop with mowed paths across meadows and a wildflower field. Walking rather than hiking.", "p": "Free lot inside the gate. Picnicking allowed on the lawns.", "b": "Hartford"}, {"n": "Tunxis State Forest", "lat": 41.95, "lon": -72.92, "c": "hike", "town": "Hartland", "mi": 50.7, "min": 92, "d": "Remote forest crossed by the blue-blazed Tunxis Trail, with Indian Council Caves and long stretches of nobody at all.", "p": "Roadside pull-offs on Route 20. Free, no facilities.", "b": "Hartford"}, {"n": "Chatfield Hollow State Park", "lat": 41.3659, "lon": -72.5859, "c": "hike", "town": "Killingworth", "mi": 26.3, "min": 45, "d": "Eighteen miles of trail plus a repaved 3.3-mile main circuit, a covered bridge, marsh boardwalk, swimming pond and caves. One of the few places plowed for winter walking.", "p": "Several lots throughout the park, plus roadside spots. Free with CT plates. Restrooms by the main pond in season.", "b": "Middlesex"}, {"n": "Cockaponset State Forest", "lat": 41.44, "lon": -72.51, "c": "hike", "town": "Haddam", "mi": 32.0, "min": 60, "d": "Second-largest state forest, with Pattaconk Reservoir, the Cockaponset Trail and miles of quiet woods roads.", "p": "Free lots off Cedar Lake Rd and at Pattaconk. Some roads seasonal.", "b": "Middlesex"}, {"n": "Day Pond State Park", "lat": 41.5568, "lon": -72.4191, "c": "hike", "town": "Colchester", "mi": 40.3, "min": 75, "d": "Small swimming pond with a good 2-hour loop into Salmon River forest past a waterfall. Some crossings have no bridge.", "p": "Free lots at the pond. Porta-johns and a pavilion.", "b": "Middlesex"}, {"n": "Devil's Hopyard State Park", "lat": 41.4795, "lon": -72.3416, "c": "hike", "town": "East Haddam", "mi": 41.1, "min": 76, "d": "Chapman Falls drops 60 feet just steps from the lot, with steep trails climbing into the gorge above.", "p": "Free lots at 366 Hopyard Rd. Trail markings are sparse where trails merge.", "b": "Middlesex"}, {"n": "Gillette Castle State Park", "lat": 41.4229, "lon": -72.4275, "c": "walk", "town": "East Haddam", "mi": 35.4, "min": 66, "d": "The actor's stone castle above the river, with the old narrow-gauge railbed converted to easy loop trails.", "p": "Large free lot; castle tour charged. Restrooms on site.", "b": "Middlesex"}, {"n": "Hammonasset Beach State Park", "lat": 41.2667, "lon": -72.5584, "c": "walk", "b": "Middlesex", "town": "Madison", "mi": 26.0, "min": 38, "d": "Two miles of shoreline plus the Moraine Nature Trail at the Meigs Point end — the underrated part. Paved paths are great off-season.", "p": "Use the Meigs Point lot at the far east end for the nature trail. Much less chaotic than the main beach lots. Free with CT plates."}, {"n": "Hurd State Park", "lat": 41.5217, "lon": -72.5412, "c": "hike", "town": "East Hampton", "mi": 33.7, "min": 63, "d": "Split Rock, river overlooks and primitive boater campsites on the Connecticut River. Mountain biking allowed.", "p": "Two free lots off Hurd Park Rd.", "b": "Middlesex"}, {"n": "Lake Hammonasset", "lat": 41.3586, "lon": -72.6077, "c": "rwa", "town": "Killingworth", "mi": 25.1, "min": 42, "d": "The best-rated RWA hike — the White Trail loop runs about six miles with 500 feet of climbing, a mix of narrow footpath and vehicle road.", "p": "Gated entrance at 530 N Branford Rd. Permit and code required. Lot fits 6–8 cars; porta-john on site.", "b": "Middlesex"}, {"n": "Machimoodus State Park", "lat": 41.483, "lon": -72.437, "c": "hike", "town": "East Haddam", "mi": 36.8, "min": 69, "d": "Open meadows and woods trails on a bluff above Salmon Cove, named for the mysterious 'Moodus noises'.", "p": "Free lot off Leesville Rd.", "b": "Middlesex"}, {"n": "Meshomasic State Forest", "lat": 41.575, "lon": -72.545, "c": "hike", "town": "Portland", "mi": 36.0, "min": 67, "d": "The first state forest in New England and still one of the wildest, with rocky ridges, quarry remains and rattlesnake habitat.", "p": "Roadside parking on Gadpouch Rd. Free, minimal signage.", "b": "Middlesex"}, {"n": "Mooween State Park", "lat": 41.5579, "lon": -72.2242, "c": "hike", "town": "Lebanon", "mi": 48.9, "min": 89, "d": "Former summer camp on a clear lake, now gravel trails past stone fireplace ruins and a 12-mile mountain-bike loop.", "p": "Roadside parking at the entrance, plus a lot for the bike loop. Free.", "b": "Middlesex"}, {"n": "Nehantic State Forest", "lat": 41.418, "lon": -72.251, "c": "hike", "town": "Lyme", "mi": 43.9, "min": 81, "d": "Woods roads and trails between Uncas and Norwich ponds, with swimming and near-total quiet.", "p": "Free lots off Keeny Rd. Rough gravel access roads.", "b": "Middlesex"}, {"n": "Pattaconk Reservoir", "lat": 41.423, "lon": -72.489, "c": "hike", "town": "Chester", "mi": 32.5, "min": 61, "d": "Reservoir inside Cockaponset forest with a shoreline loop and connections to the long Cockaponset Trail.", "p": "Free lot off Cedar Lake Rd. Rough gravel approach.", "b": "Middlesex"}, {"n": "Pine Brook Preserve", "lat": 41.5085, "lon": -72.4953, "c": "open", "town": "Haddam", "mi": 35.1, "min": 66, "d": "Land trust trails past old dam remnants and canal ruins, connecting to neighboring preserves.", "p": "Roadside parking on Pine Brook Rd. Free.", "b": "Middlesex"}, {"n": "Rocky Neck State Park", "lat": 41.3158, "lon": -72.2416, "c": "walk", "town": "East Lyme", "mi": 42.7, "min": 79, "d": "Boardwalk, salt marsh and a crescent beach with a historic stone pavilion. Easy walking with excellent birding.", "p": "Large lot; free with CT plates. Restrooms and showers.", "b": "Middlesex"}, {"n": "Salmon River State Forest", "lat": 41.5951, "lon": -72.4524, "c": "hike", "town": "Colchester", "mi": 40.5, "min": 75, "d": "Comstock covered bridge, first-class trout water, and the Salmon River Trail looping through the gorge. Connects to the Airline Trail.", "p": "Free lots on Route 16 near the covered bridge.", "b": "Middlesex"}, {"n": "Selden Neck State Park", "lat": 41.402, "lon": -72.373, "c": "hike", "town": "Lyme", "mi": 37.5, "min": 70, "d": "An island in the Connecticut River reachable only by boat, with primitive campsites and quiet trails. Genuinely remote.", "p": "No road access — paddle in. Camping by permit only.", "b": "Middlesex"}, {"n": "Seven Falls Park", "lat": 41.507, "lon": -72.5808, "c": "hike", "town": "Middlefield", "mi": 31.5, "min": 60, "d": "Cascades best seen after rain, plus a blue and yellow loop that scrambles up rocks beneath the power lines.", "p": "Spacious free lot on Route 154.", "b": "Middlesex"}, {"n": "Shoreline Greenway Trail", "lat": 41.274, "lon": -72.5572, "c": "walk", "town": "Madison", "mi": 26.1, "min": 50, "d": "Paved shoreline path along the beach with benches, gazebos and beach access points. Very flat.", "p": "Free lot at the eastern trailhead on US-1.", "b": "Middlesex"}, {"n": "Bluff Point State Park", "lat": 41.3355, "lon": -72.0333, "c": "hike", "town": "Groton", "mi": 53.6, "min": 97, "d": "The last undeveloped stretch of Connecticut coastline — a 3.6-mile loop out to a bluff over the Sound and a long sand spit.", "p": "Large free lot at 55 Depot Rd. Fills on summer weekends.", "b": "New London"}, {"n": "Fort Griswold Battlefield", "lat": 41.351, "lon": -72.079, "c": "walk", "town": "Groton", "mi": 51.4, "min": 93, "d": "Revolutionary War fort and monument above the Thames, with open grounds and harbor views. Short and historical.", "p": "Free lot on Park Ave. Monument climb seasonal.", "b": "New London"}, {"n": "Fort Trumbull State Park", "lat": 41.3443, "lon": -72.0931, "c": "walk", "town": "New London", "mi": 50.6, "min": 92, "d": "Nineteenth-century coastal fort with grounds and a pier looking out on the Thames. More history than hiking.", "p": "Free lot; museum admission charged.", "b": "New London"}, {"n": "Green Falls Pond", "lat": 41.5356, "lon": -71.8101, "c": "hike", "town": "Voluntown", "mi": 68.1, "min": 122, "d": "Clear pond in the Pachaug forest with a loop trail, small waterfall and primitive camping. No motorboats.", "p": "Free lot at the pond. Composting toilets, no potable water.", "b": "New London"}, {"n": "Haley Farm State Park", "lat": 41.3322, "lon": -72.0062, "c": "walk", "town": "Groton", "mi": 54.9, "min": 99, "d": "Old farm with grassy trails, enormous stone walls and a paved path, linking directly to Bluff Point next door.", "p": "Free lot at 24 Haley Farm Ln. Tight on busy days.", "b": "New London"}, {"n": "Harkness Memorial State Park", "lat": 41.3022, "lon": -72.113, "c": "walk", "town": "Waterford", "mi": 49.2, "min": 90, "d": "A mansion, formal gardens and wide lawns running down to the Sound. Flat, beautiful, and good for a slow stroll.", "p": "Large free lot with CT plates. Restrooms on site.", "b": "New London"}, {"n": "Hopeville Pond State Park", "lat": 41.6047, "lon": -71.9261, "c": "walk", "town": "Griswold", "mi": 64.2, "min": 115, "d": "Camping, swimming and easy trails that all loop back into the park, so you can't get lost.", "p": "Free with CT plates. Restrooms and showers.", "b": "New London"}, {"n": "Pachaug State Forest", "lat": 41.5842, "lon": -71.8761, "c": "hike", "town": "Voluntown", "mi": 66.0, "min": 118, "d": "The largest state forest in Connecticut at 27,000 acres, with the Nehantic and Pachaug trails, rhododendron sanctuary and Mount Misery.", "p": "Free lots throughout; main entrance off Route 49. Some access roads are rough gravel.", "b": "New London"}, {"n": "Airline State Park Trail", "lat": 41.744, "lon": -72.27, "c": "walk", "town": "Willimantic", "mi": 54.4, "min": 98, "d": "Long crushed-stone rail trail crossing eastern Connecticut on old railbed, with high viaducts and river crossings.", "p": "Free lots at multiple trailheads including Route 66 in Columbia.", "b": "Tolland"}, {"n": "Bolton Notch State Park", "lat": 41.7896, "lon": -72.4503, "c": "hike", "town": "Bolton", "mi": 50.2, "min": 91, "d": "Rail-trail through a rock tunnel plus a rocky yellow loop to Flag Rock with big views over the sandpit and valley.", "p": "Small lot for about 10 cars off Route 44. Free.", "b": "Tolland"}, {"n": "Bush Hill Preserve", "lat": 41.739, "lon": -72.5566, "c": "open", "town": "Manchester", "mi": 44.1, "min": 81, "d": "Land trust trails through woods and open fields with a small goat farm along the main path.", "p": "Limited roadside parking at 334 Bush Hill Rd. Free.", "b": "Tolland"}, {"n": "Case Mountain", "lat": 41.758, "lon": -72.493, "c": "hike", "town": "Manchester", "mi": 47.1, "min": 86, "d": "Six hundred acres of hardwood ridge with a lookout over Hartford, and some of the best mountain biking near the city.", "p": "Free lot on Line St / Birch Mountain Rd.", "b": "Tolland"}, {"n": "Gay City State Park", "lat": 41.724, "lon": -72.445, "c": "hike", "town": "Hebron", "mi": 46.9, "min": 86, "d": "Extensive trail network through the ruins of a vanished 19th-century mill village — foundations, a dam and old mill works in the woods.", "p": "Free with CT plates. Winter gate closes; park at the first lot and walk in.", "b": "Tolland"}, {"n": "Mansfield Hollow State Park", "lat": 41.7612, "lon": -72.1819, "c": "hike", "town": "Mansfield", "mi": 58.6, "min": 106, "d": "Lake trails ranging from a paved levee walk to a demanding blue trail, with excellent paddling and birding.", "p": "Free lots at 151 Bassetts Bridge Rd. Porta-johns. No swimming.", "b": "Tolland"}, {"n": "Nathan Hale State Forest", "lat": 41.729, "lon": -72.257, "c": "hike", "town": "Coventry", "mi": 54.2, "min": 98, "d": "Quiet forest around the Hale homestead with the Nathan Hale Trail and Nipmuck Trail running through.", "p": "Free lot on South St near the homestead.", "b": "Tolland"}, {"n": "Nipmuck State Forest", "lat": 42.0158, "lon": -72.1712, "c": "hike", "town": "Stafford", "mi": 71.4, "min": 127, "d": "Rugged marsh-and-ridge trail network adjoining Bigelow Hollow, with camping and fishing.", "p": "Roadside parking off Chestnut Hill Rd. Free.", "b": "Tolland"}, {"n": "Shenipsit State Forest / Soapstone Mountain", "lat": 41.9616, "lon": -72.4082, "c": "hike", "town": "Somers", "mi": 61.1, "min": 110, "d": "Observation tower on the summit with views into Massachusetts and beyond. You can drive up or hike it.", "p": "Free lot at the summit and at Gulf Rd. Porta-johns and picnic tables.", "b": "Tolland"}, {"n": "Wickham Park", "lat": 41.769, "lon": -72.558, "c": "walk", "town": "Manchester", "mi": 45.7, "min": 84, "d": "Two hundred fifty acres of formal gardens, ponds and open lawns with easy paths. Admission charged.", "p": "Paid lot at the entrance on Middle Turnpike. Seasonal hours.", "b": "Tolland"}, {"n": "Audubon Center at Pomfret", "lat": 41.8726, "lon": -71.9456, "c": "preserve", "town": "Pomfret", "mi": 73.0, "min": 130, "d": "Meadows, croplands and brooks managed for birds, linking directly to the Airline Trail for long walks.", "p": "Free lot at 218 Day Rd.", "b": "Windham"}, {"n": "Bigelow Hollow State Park", "lat": 42.0003, "lon": -72.1313, "c": "hike", "town": "Union", "mi": 72.0, "min": 128, "d": "Part of a 9,000-acre block with Nipmuck State Forest — deep woods, clear ponds and quiet trails. Among the wildest country in the state.", "p": "Lots off Bigelow Hollow Rd. Free with CT plates, $15 out-of-state. Fills on summer weekends.", "b": "Windham"}, {"n": "Goodwin State Forest", "lat": 41.783, "lon": -72.09, "c": "preserve", "town": "Hampton", "mi": 63.3, "min": 114, "d": "Pine Acres Lake, a conservation center, and easy loop trails linking into Natchaug forest. Excellent birding.", "p": "Free lot at 23 Potter Rd. Center open limited hours.", "b": "Windham"}, {"n": "Mashamoquet Brook State Park", "lat": 41.8607, "lon": -71.9813, "c": "hike", "town": "Pomfret", "mi": 71.0, "min": 127, "d": "Blue loop with real elevation, rock gardens and Wolf Den, where legend says Israel Putnam killed the last wolf in Connecticut.", "p": "Free lots at 276 Mashamoquet Rd. Porta-johns.", "b": "Windham"}, {"n": "Natchaug State Forest", "lat": 41.8642, "lon": -72.0815, "c": "hike", "town": "Eastford", "mi": 67.2, "min": 120, "d": "Easy hiking on old roadbeds, a beaver pond, and horse camping. Peaceful and lightly used.", "p": "Free lots off Route 198 and Pilfershire Rd. Limited spaces.", "b": "Windham"}, {"n": "Old Furnace State Park", "lat": 41.7881, "lon": -71.8657, "c": "hike", "town": "Killingly", "mi": 73.0, "min": 130, "d": "Easy well-marked loop with a cliff overlook and a wooden bridge over the stream. Good for all seasons.", "p": "Free lots off Route 6. Plenty of space.", "b": "Windham"}, {"n": "Quaddick State Park", "lat": 41.954, "lon": -71.8119, "c": "walk", "town": "Thompson", "mi": 81.9, "min": 145, "d": "Lakeside picnicking and a short woodland trail on a clean reservoir in the state's far northeast corner.", "p": "Free with CT plates. Porta-johns throughout.", "b": "Windham"}, {"n": "Trail Wood", "lat": 41.8095, "lon": -72.0641, "c": "preserve", "town": "Hampton", "mi": 65.4, "min": 117, "d": "Edwin Way Teale's farm, now an Audubon sanctuary — meadows, pond, and woods full of benches and interpretive stops.", "p": "Free lot at 93 Kenyon Rd.", "b": "Windham"}, {"n": "Wolf Den / Mashamoquet", "lat": 41.853, "lon": -71.972, "c": "hike", "town": "Pomfret", "mi": 71.1, "min": 127, "d": "The den where Israel Putnam is said to have killed Connecticut's last wolf in 1742, on a rocky loop with ledges and boulder caves.", "p": "Free lot at the Wolf Den entrance off Wolf Den Rd.", "b": "Windham"}, {"n": "Wyndham Land Trust Bull Hill", "lat": 41.9644, "lon": -71.941, "c": "open", "town": "Woodstock", "mi": 77.2, "min": 137, "d": "Easy climb to a bench and an overlook few people know about. Good mountain biking too.", "p": "Rough washed-out access road; small lot at the top. Free.", "b": "Windham"}, {"n": "Housatonic Overlook / Tucker's Ridge", "lat": 41.3005, "lon": -73.0855, "c": "open", "b": "New Haven", "town": "Orange", "mi": 6.5, "min": 15, "d": "Thirty-three acres of town open space on a rugged ridge 200 feet above the Housatonic. The red trail reaches the overlook bench a few steps from the kiosk — river, Two Mile Island, Shelton and Derby laid out below. Bald eagles work the water in winter. Red, blue and yellow trails total about 1.7 miles.", "p": "Small informal pull-off at the end of High Ridge Road, right by the kiosk. Park carefully — spaces are few and you can block the road. Cedar Grove Road (671) is the longer, more secluded way in. No restrooms."}, {"n": "Race Brook Tract", "lat": 41.3025, "lon": -72.9985, "c": "open", "b": "New Haven", "town": "Orange", "mi": 6.0, "min": 16, "d": "Orange Conservation Commission woodland along Race Brook, connecting toward the Woodbridge trail network. Quiet, lightly walked, good for an easy hour.", "p": "Roadside parking on Race Brook Road. Open dawn to dusk, no permit."}, {"n": "Turkey Hill Preserve", "lat": 41.3095, "lon": -73.0605, "c": "open", "b": "New Haven", "town": "Orange", "mi": 6.8, "min": 16, "d": "Headwater streams draining to Turkey Hill and Little Turkey Hill brooks and on into the Wepawaug. Easy woods walking, and close enough to Housatonic Overlook to pair the two in one outing — about a three-minute drive apart.", "p": "Trailhead off Derby-Milford Road. Small lot, dawn to dusk."}, {"n": "Wrights Pond", "lat": 41.2865, "lon": -73.0015, "c": "open", "b": "New Haven", "town": "Orange", "mi": 5.5, "min": 15, "d": "Small town preserve around a pond, with short level paths. More a stroll than a hike, but genuinely pretty and almost never busy.", "p": "Roadside parking on Old Grassy Hill Road."}, {"n": "Ewen Farm Preserve", "lat": 41.2715, "lon": -72.9905, "c": "open", "b": "New Haven", "town": "Orange", "mi": 5.0, "min": 14, "d": "Former farmland off Tyler City, now conservation land with mowed and wooded paths. Open ground makes it good in summer when the woods get buggy.", "p": "Access from Lambert Road / St John's Drive. Roadside only."}, {"n": "Paul Ode Nature Trail", "lat": 41.2775, "lon": -73.0275, "c": "walk", "b": "New Haven", "town": "Orange", "mi": 4.5, "min": 13, "d": "Short interpretive loop behind the High Plains Community Center — the most family-friendly of Orange's open spaces, and the easiest to find.", "p": "Large free lot at the community center, 525 Orange Center Road."}, {"n": "Fred Wolfe Park", "lat": 41.2925, "lon": -73.0455, "c": "walk", "b": "New Haven", "town": "Orange", "mi": 5.5, "min": 15, "d": "Town park with wooded nature trails off the playing fields. Flat, well used by locals, easy with kids.", "p": "Free lot off Hollow Road."}, {"n": "Howard Brooks Conservation Area", "lat": 41.2865, "lon": -73.0425, "c": "open", "b": "New Haven", "town": "Orange", "mi": 5.0, "min": 14, "d": "Wepawaug River woodland off Mapledale Road, one of the quieter Conservation Commission parcels. Stream crossings and old stone walls.", "p": "Roadside parking on Mapledale Road. Dawn to dusk, no permit."}, {"n": "Mondo Ponds", "lat": 41.2225, "lon": -73.0795, "c": "preserve", "b": "New Haven", "town": "Milford", "mi": 2.5, "min": 10, "d": "Thirty-six acres and five ponds left behind by 1940s gravel excavation, now a city nature preserve. A mile of trail through white pine, spruce, swamp forest and beech, with rocky islands out in the water. Around 180 bird species recorded. No bikes, no boats, no fishing.", "p": "Parking at JFK Elementary, 404 West Ave — not during school hours. Some I-95 noise carries in."}, {"n": "Wilcox Park", "lat": 41.2185, "lon": -73.0505, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.5, "min": 7, "d": "The oldest trail in town — twelve acres deeded to Milford in 1909, on land the first miller farmed. Half a mile of upper and lower path with quiet harbor views.", "p": "Lower trail starts at the boat launch lot; limited accessible parking at the end of the shared driveway off Shipyard Lane. Leashed dogs only."}, {"n": "Great River Walk", "lat": 41.2015, "lon": -73.0955, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 3.0, "min": 11, "d": "Housatonic-side path through Devon with wide water views, connecting a string of small city open spaces. Flat the whole way.", "p": "Roadside parking near the Naugatuck Ave access. Free."}, {"n": "Walnut Beach Boardwalk", "lat": 41.1948, "lon": -73.0538, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 2.5, "min": 10, "d": "Boardwalk along the shifting shoreline at Walnut Beach — salt air, benches, and an easy out-and-back that connects toward Silver Sands.", "p": "Lot at Walnut Beach. Free with Milford sticker; metered in season."}, {"n": "Silent Waters", "lat": 41.313, "lon": -73.126, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 6.5, "min": 20, "d": "The overlook reservoir in the Shelton Lakes Greenway. The Turkey Trot loop from Independence Drive runs about 2.3 easy miles past the water; the greenway as a whole holds ten miles of trail across three reservoirs.", "p": "Park at the Rec Path access or the dog park on Nells Rock Road. Free."}, {"n": "Hope Lake", "lat": 41.3035, "lon": -73.1215, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 6.0, "min": 19, "d": "Formerly Nell's Rock Reservoir, the southern lake in the Shelton Lakes chain, with the crushed-stone Rec Path running alongside — eight to twelve feet wide and good for strollers and bikes.", "p": "Access from Pine Lake on Shelton Ave or the Nells Rock Road dog park. Free."}, {"n": "Boehm Pond", "lat": 41.331, "lon": -73.15, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 9.0, "min": 25, "d": "Moderately easy trail system with several loop options, kept up by the volunteer Shelton Trails Committee. You are never far from houses and yet rarely see another hiker.", "p": "Small trailhead lot off Route 110. Free."}, {"n": "Nicholdale Farm", "lat": 41.376, "lon": -73.146, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 12.0, "min": 28, "d": "Shelton Land Conservation Trust fields managed for wildlife in the White Hills, with the Pearmain Path running back into the preserve and Willis Woods across the road.", "p": "Two hiker lots just east of Nicholdale Road, either side of 322 Leavenworth Road. Free."}, {"n": "French's Hill Open Space", "lat": 41.323, "lon": -73.139, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 8.0, "min": 24, "d": "White-blazed loop over a wooded hill above the Housatonic side of town. Short, steady climbing and almost no traffic.", "p": "Small roadside trailhead. Free, no facilities."}, {"n": "Tahmore Preserve", "lat": 41.3345, "lon": -73.1265, "c": "hike", "b": "New Haven", "town": "Shelton", "mi": 8.5, "min": 24, "d": "Blue/yellow spur off the Paugussett Trail on land trust property next to Indian Well. Paired with the state park it makes a two-mile exercise loop with steady climbing and an overlook of Lake Housatonic.", "p": "Park in the designated area opposite the Indian Well entrance, then take the stairs or the red/blue beach bypass."}, {"n": "Housatonic Woods", "lat": 41.291, "lon": -73.128, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 6.0, "min": 19, "d": "The Woodsend Trail through a compact block of city woods in southern Shelton — an easy walk close to town.", "p": "Roadside parking at the trailhead. Free."}, {"n": "Shelton Canal Locks & Bluff Walk", "lat": 41.311, "lon": -73.093, "c": "walk", "b": "New Haven", "town": "Shelton", "mi": 6.5, "min": 19, "d": "Historic walk along the old canal and locks with a bluff path above the river through Riverview Park. Short, paved in places, heavy on industrial history.", "p": "Free lots downtown near Canal Street."}, {"n": "Fitzgerald Tract", "lat": 41.352, "lon": -73.01, "c": "open", "b": "New Haven", "town": "Woodbridge", "mi": 9.5, "min": 24, "d": "Part of the twelve-mile Woodbridge Greenway, which follows the old Naugatuck Trail past mill sites and cellar holes. The land trust keeps roughly 20 miles of trail and 25 trailheads across town.", "p": "Roadside trailhead parking. Free, no permit."}, {"n": "Alice Newton Street Memorial Park", "lat": 41.345, "lon": -73.003, "c": "walk", "b": "New Haven", "town": "Woodbridge", "mi": 9.0, "min": 23, "d": "Small town park with gentle wooded paths and a stream — a good short walk when you want woods without a drive up the valley.", "p": "Free lot on Newton Road."}, {"n": "Massaro Community Farm", "lat": 41.343, "lon": -73.026, "c": "walk", "b": "New Haven", "town": "Woodbridge", "mi": 9.5, "min": 24, "d": "Working organic community farm with mowed paths around the fields and a view over the hills. Best in late summer when the beds are full.", "p": "Free lot at 41 Ford Road. Farm stand seasonal."}, {"n": "Konolds Pond", "lat": 41.335, "lon": -72.966, "c": "open", "b": "New Haven", "town": "Woodbridge", "mi": 9.0, "min": 22, "d": "West River pond on the proposed greenway link toward Pond Lily, with informal shoreline paths and good early-morning birding.", "p": "Roadside parking off Bradley Road. Free."}, {"n": "Bethany Farms Trails", "lat": 41.402, "lon": -73.01, "c": "hike", "b": "New Haven", "town": "Bethany", "mi": 12.0, "min": 28, "d": "Seventy acres of set-aside parcels stitched into a trail system by the Bethany Land Trust. The blue Naugatuck Trail — one of the oldest indigenous routes in Connecticut, later the Leatherman's road from New Haven to Naugatuck — runs downhill to the Woodbridge line.", "p": "Roadside parking at the many entrances; main one across from 59 Farm View Road. Also Country Lane, Sanford Road and Chelsea Circle."}, {"n": "Mendell's Folly", "lat": 41.446, "lon": -73.007, "c": "hike", "b": "New Haven", "town": "Bethany", "mi": 15.0, "min": 33, "d": "A 125-acre centerpiece of Bethany's northwest greenway — moderate to difficult trails through wetland with a beaver dam, climbing onto ridges. Connects to three neighboring preserves.", "p": "Roadside parking at the preserve entrance. Free."}, {"n": "Carrington Preserve", "lat": 41.409, "lon": -73.003, "c": "open", "b": "New Haven", "town": "Bethany", "mi": 12.5, "min": 29, "d": "Town-owned woods connecting into the Bethany Farms system and Whispering Pines. Quiet upland forest of oak, hickory and birch.", "p": "Roadside parking. Free, no facilities."}, {"n": "Rockhouse Hill Sanctuary", "lat": 41.412, "lon": -73.083, "c": "preserve", "b": "New Haven", "town": "Seymour", "mi": 13.0, "min": 31, "d": "Seymour Land Trust sanctuary abutting Naugatuck State Forest and the Keith Mitchell block, with ridge walking and old field edges.", "p": "Trailhead lot off Chatfield Street. Free."}, {"n": "Keith Mitchell Forest", "lat": 41.425, "lon": -73.132, "c": "hike", "b": "New Haven", "town": "Oxford", "mi": 15.0, "min": 33, "d": "The Swamp Yankee Falls Trail runs the west bank of Fourmile Brook past the falls, old mill ruins and stone walls marking farmland long since grown over.", "p": "Designated lot at the junction of Routes 34 and 188, near the Oxford–Seymour line. Free."}, {"n": "Little-Laurel Lime Ridge", "lat": 41.397, "lon": -73.075, "c": "open", "b": "New Haven", "town": "Seymour", "mi": 12.5, "min": 30, "d": "Town park on a limestone ridge with a network of short trails — unusual geology for the valley and a favorite local dog walk.", "p": "Small lot at the park entrance. Free."}, {"n": "Quillinan Reservoir", "lat": 41.405, "lon": -73.1, "c": "open", "b": "New Haven", "town": "Seymour", "mi": 13.0, "min": 31, "d": "Nine trails totalling over eight miles around the reservoir, popular with mountain bikers as well as walkers. Wear orange in hunting season.", "p": "Free lot at the reservoir access.
