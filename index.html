 No swimming."}, {"n": "Toby's Pond", "lat": 41.394, "lon": -73.086, "c": "walk", "b": "New Haven", "town": "Seymour", "mi": 12.0, "min": 29, "d": "Easy pond loop on Seymour town open space — flat, short, and a good introduction to the land trust's other properties.", "p": "Small free lot at the pond. No facilities."}, {"n": "Lantern Ridge Open Space", "lat": 41.428, "lon": -73.114, "c": "open", "b": "New Haven", "town": "Oxford", "mi": 14.5, "min": 33, "d": "Oxford town open space with a purple trail cutting diagonally across the property between two lots, plus a connecting woods road — four different route combinations depending on where you start.", "p": "Two free lots, either end of the purple trail."}, {"n": "Matthies Memorial Park", "lat": 41.442, "lon": -73.062, "c": "walk", "b": "New Haven", "town": "Beacon Falls", "mi": 15.5, "min": 33, "d": "Riverside town park in Beacon Falls with easy paths, picnic ground and access toward the Naugatuck State Forest blocks.", "p": "Free lot at the park. Restrooms seasonal."}, {"n": "Derby Greenway", "lat": 41.318, "lon": -73.088, "c": "walk", "b": "New Haven", "town": "Derby", "mi": 7.5, "min": 20, "d": "The most heavily used multi-use trail in Connecticut — 3.6 flat miles of loop along the Housatonic and Naugatuck, part of the growing Naugatuck River Greenway.", "p": "Nine-space paved lot on Division Street, plus gravel parking at O'Sullivan's Island. Derby-end parking fills fast; the Ansonia side is the better bet. Do not park at the big-box stores — they tow."}, {"n": "Ansonia Riverwalk", "lat": 41.339, "lon": -73.078, "c": "walk", "b": "New Haven", "town": "Ansonia", "mi": 9.0, "min": 23, "d": "Extends north from the Derby Greenway at Division Street, starting in a riverside park with a gazebo and following the flood wall to a bridge over the rail line.", "p": "Free parking at the Division Street riverside park."}, {"n": "Great Meadows Unit", "lat": 41.163, "lon": -73.113, "c": "preserve", "b": "New Haven", "town": "Stratford", "mi": 5.5, "min": 16, "d": "421 acres of salt marsh and upland in the Stewart B. McKinney refuge, a globally important bird area with over 270 species through the year. Recent restoration reopened 34 acres of marsh. Feels hidden despite the warehouses across the water.", "p": "Small signed lot on Long Beach Boulevard. The trail entrance is not where Google shows it — check the map board by the lot. Wear orange in hunting season."}, {"n": "Stratford Point", "lat": 41.1512, "lon": -73.105, "c": "preserve", "b": "New Haven", "town": "Stratford", "mi": 6.0, "min": 18, "d": "Connecticut Audubon coastal grassland on a point with wide Sound views and heavy migrant traffic. Short paths, big sky.", "p": "Gate open weekdays 8 to 4:30 and closes sharply. Buildings closed."}, {"n": "Boothe Memorial Park", "lat": 41.2255, "lon": -73.1435, "c": "walk", "b": "New Haven", "town": "Stratford", "mi": 5.0, "min": 15, "d": "Open grounds around the Boothe homestead, carriage house, blacksmith shop and rose garden, with easy walking among the monuments and a good picnic lawn.", "p": "Large free lot at 5800 Main Street. Restrooms seasonal."}, {"n": "Halaby Nature Preserve", "lat": 41.263, "lon": -73.213, "c": "open", "b": "Fairfield", "town": "Trumbull", "mi": 9.0, "min": 24, "d": "One of the town parcels Trumbull took on when its land trust wound up. Quiet woods and stream, little visited.", "p": "Roadside parking. Free; no resident sticker needed for this one, unlike the larger town parks."}, {"n": "Tyler Mill Preserve", "lat": 41.4805, "lon": -72.8225, "c": "hike", "b": "New Haven", "town": "Wallingford", "mi": 21.0, "min": 38, "d": "Around 1,300 acres of town preserve with a long, well-used trail network on old woods roads — the biggest walking ground between New Haven and Meriden.", "p": "Free lots off Tyler Mill Road. Bikes and horses share the trails."}, {"n": "Brooksvale Park", "lat": 41.4295, "lon": -72.9165, "c": "walk", "b": "New Haven", "town": "Hamden", "mi": 16.0, "min": 32, "d": "Hamden's farm park at the foot of the Giant, with animals, sugarhouse, and trails linking to the Farmington Canal path and the Quinnipiac Trail.", "p": "Free lot at 524 Brooksvale Ave. Restrooms."}, {"n": "Pond Lily Nature Preserve", "lat": 41.3255, "lon": -72.9585, "c": "preserve", "b": "New Haven", "town": "New Haven", "mi": 9.5, "min": 22, "d": "A dam removal turned this into one of the newer preserves in the city — the West River running free again, with short paths and surprising bird life for the neighborhood.", "p": "Small lot off Whalley Ave. Free."}, {"n": "Edgewood Park", "lat": 41.3155, "lon": -72.9455, "c": "walk", "b": "New Haven", "town": "New Haven", "mi": 9.0, "min": 21, "d": "Olmsted-influenced city park along the West River with a duck pond, ranger station, and shaded paths that link toward the Pond Lily preserve.", "p": "Free roadside parking on Edgewood Ave and West Rock Ave."}, {"n": "Burnap Brook Preserve", "lat": 41.7295, "lon": -72.372, "c": "preserve", "b": "Tolland", "town": "Andover", "mi": 50, "min": 92, "d": "Joshua's Trust land along Burnap Brook — the trust protects over 5,000 acres and 42 miles of public trail across the Windham and Tolland county towns.", "p": "Roadside parking at the preserve entrance. Free, dawn to dusk."}, {"n": "Josias Byles Sanctuary", "lat": 41.873, "lon": -72.145, "c": "preserve", "b": "Windham", "town": "Ashford", "mi": 66, "min": 118, "d": "A 1.6-mile loop with a marsh view along the Mount Hope River, on the site of one of Ashford's original homesteads. One of the better Joshua's Trust properties.", "p": "Small roadside lot. Free, no facilities."}, {"n": "Fisher Meadows Recreation Area", "lat": 41.7935, "lon": -72.8455, "c": "walk", "b": "Hartford", "town": "Avon", "mi": 42, "min": 78, "d": "Flat gravel paths around ponds and meadow along the Farmington River, tied into the Farmington River Trail. Easy walking, good birding.", "p": "Free lot off Old Farms Road. Restrooms seasonal."}, {"n": "Terre Haute Open Space", "lat": 41.3915, "lon": -73.4085, "c": "open", "b": "Fairfield", "town": "Bethel", "mi": 22, "min": 44, "d": "Bethel town open space with a wooded trail network on the Danbury line — quiet, rolling, and rarely busy.", "p": "Free lot at the trailhead. Dawn to dusk."}, {"n": "Bellamy Preserve", "lat": 41.6395, "lon": -73.2065, "c": "preserve", "b": "Litchfield", "town": "Bethlehem", "mi": 29, "min": 55, "d": "At 81 acres, the largest of the Bethlehem Land Trust's seventeen parcels, with walking paths and a posted trail map.", "p": "Access and parking on Munger Lane in the center of Bethlehem. Free."}, {"n": "Yantic River Greenway", "lat": 41.5305, "lon": -72.136, "c": "walk", "b": "New London", "town": "Bozrah", "mi": 46, "min": 85, "d": "Town parks and conservation land strung along the Yantic as it runs east toward Norwich — fishing, boating and easy riverside walking.", "p": "Roadside access at several town park entrances. Free."}, {"n": "Beardsley Park", "lat": 41.2035, "lon": -73.1885, "c": "walk", "b": "Fairfield", "town": "Bridgeport", "mi": 8, "min": 20, "d": "Olmsted-designed city park along the Pequonnock with broad lawns, river paths and the state's only zoo inside its grounds.", "p": "Free lots off Noble Ave. Zoo admission separate from the park."}, {"n": "Sunny Valley Preserve, Bridgewater", "lat": 41.5405, "lon": -73.3675, "c": "preserve", "b": "Litchfield", "town": "Bridgewater", "mi": 31, "min": 58, "d": "The Bridgewater end of the Nature Conservancy's working-farm preserve — hayfields, hedgerows and woods roads with long valley views.", "p": "Small roadside lots. Free, no facilities."}, {"n": "Indian Rock Nature Preserve", "lat": 41.7085, "lon": -72.9895, "c": "preserve", "b": "Hartford", "town": "Bristol", "mi": 34, "min": 64, "d": "Environmental Learning Centers of Connecticut property with easy interpretive trails, a nature center and programs for kids.", "p": "Free lot at 501 Wolcott Rd. Building hours limited."}, {"n": "The Ledges Preserve", "lat": 41.4655, "lon": -73.3705, "c": "hike", "b": "Fairfield", "town": "Brookfield", "mi": 24, "min": 48, "d": "Forty-five acres protected in 2024 by the Northwest Connecticut Land Conservancy. The white-blazed mile-long loop climbs through rocky outcrops and hardwood forest.", "p": "Parking area on Banquo Brae Road. Free."}, {"n": "Birch Rocks Preserve", "lat": 41.4805, "lon": -73.3395, "c": "hike", "b": "Fairfield", "town": "Brookfield", "mi": 25, "min": 49, "d": "Over 175 acres of protected hardwood forest, streams and wetland, with 2.5 miles of trail along the Lake Lillinonah shore.", "p": "Lot at 40A Obtuse Road North. Free, trail map posted."}, {"n": "Quinebaug River Trail", "lat": 41.7885, "lon": -71.9485, "c": "walk", "b": "Windham", "town": "Brooklyn", "mi": 72, "min": 129, "d": "Flat riverside walking on the Quinebaug in the heart of the Last Green Valley, linking town open space along the water.", "p": "Free roadside parking at the river access. No facilities."}, {"n": "Great Falls of the Housatonic", "lat": 41.9575, "lon": -73.3695, "c": "walk", "b": "Litchfield", "town": "Canaan", "mi": 52, "min": 95, "d": "The biggest waterfall on the Housatonic, thundering over a rock shelf at Falls Village. Short paths along the gorge rim; the flow depends entirely on the dam release.", "p": "Free lot off Water Street. Rocks near the falls are slick and dangerous when wet."}, {"n": "Quinebaug River Wildlife Management Area", "lat": 41.6795, "lon": -71.9905, "c": "open", "b": "Windham", "town": "Canterbury", "mi": 66, "min": 119, "d": "State wildlife land along the Quinebaug with woods roads and river access. Little signage, few people. Wear orange in hunting season.", "p": "Roadside pull-offs. Free, no facilities."}, {"n": "Onion Mountain Park", "lat": 41.8285, "lon": -72.9015, "c": "hike", "b": "Hartford", "town": "Canton", "mi": 41, "min": 77, "d": "Canton town park with a short steep climb to ledges and a view west over the Farmington Valley. The land trust keeps additional trails nearby.", "p": "Small free lot off Route 44. Limited spaces."}, {"n": "Diana's Pool", "lat": 41.7975, "lon": -72.1195, "c": "hike", "b": "Windham", "town": "Chaplin", "mi": 62, "min": 112, "d": "A deep swimming hole in a rocky gorge on the Natchaug River, reached by a short trail from the road. Beautiful and genuinely dangerous — people are hurt here most summers.", "p": "Small lot on Route 198. Free. Rocks are slick; no lifeguards, no rescue nearby."}, {"n": "Clinton Land Conservation Trust Preserves", "lat": 41.3125, "lon": -72.5285, "c": "preserve", "b": "Middlesex", "town": "Clinton", "mi": 27, "min": 46, "d": "The Clinton trust holds parcels across town and into Killingworth, Madison and Westbrook, most with short unblazed footpaths through coastal woods.", "p": "Roadside parking at preserve entrances. Free; check the trust for current maps."}, {"n": "Sandy Brook Trail", "lat": 42.0135, "lon": -73.0685, "c": "hike", "b": "Litchfield", "town": "Colebrook", "mi": 56, "min": 101, "d": "Colebrook Land Conservancy trail along Sandy Brook, one of four the conservancy keeps in town alongside the Hale, Rockwell and Deer Hill trails.", "p": "Roadside parking. Free. Guided hikes offered periodically."}, {"n": "Szegda Farm", "lat": 41.6905, "lon": -72.3175, "c": "open", "b": "Tolland", "town": "Columbia", "mi": 52, "min": 95, "d": "Joshua's Trust farm property with mowed field edges and woods trails above the Willimantic River.", "p": "Free lot at the farm entrance. Dawn to dusk."}, {"n": "Selleck's Woods", "lat": 41.0865, "lon": -73.4725, "c": "preserve", "b": "Fairfield", "town": "Darien", "mi": 25, "min": 49, "d": "Darien Land Trust woods with boardwalks over wetland, a pond, and well-kept short loops. One of the best small-town preserves on the southwest shore.", "p": "Free lot at the Darien Nature Center. Leashed dogs."}, {"n": "Canfield-Meadow Woods", "lat": 41.3805, "lon": -72.4245, "c": "hike", "b": "Middlesex", "town": "De const OUT = (function trimToShore(){
  const raw=GEO.outline[0];
  const SHORE_TOWNS=['Greenwich','Stamford','Darien','Norwalk','Westport','Fairfield'];

  const lonOf=(b)=>B0+(B1-B0)*b/(NBIN-1);
  const shore=new Float64Array(NBIN).fill(99);
  GEO.towns.forEach(t=>{
    if(SHORE_TOWNS.indexOf(t.n)<0) return;
    t.r.forEach(rg=>rg.forEach(([x,y])=>{
      if(x<B0||x>B1) return;
      const b=bin(x); if(y<shore[b]) shore[b]=y;
    }));
  });

  const idx=[]; for(let i=0;i<NBIN;i++) if(shore[i]<90) idx.push(i);
  if(idx.length<2) return raw;

  for(let i=0;i<idx[0];i++) shore[i]=shore[idx[0]];
  for(let i=idx[idx.length-1]+1;i<NBIN;i++) shore[i]=shore[idx[idx.length-1]];

  // a running minimum knocks those spikes down, then a light smoothing
  const er=new Float64Array(NBIN);
  for(let i=0;i<NBIN;i++){
    let m=99;
    for(let k=Math.max(0,i-2);k<=Math.min(NBIN-1,i+2);k++) m=Math.min(m,shore[k]);
    er[i]=m;

  const at=i=> closed ? pts[((i%n)+n)%n] : pts[Math.max(0,Math.min(n-1,i))];
  const out=[], last = closed ? n : n-1;
  for(let i=0;i<last;i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    for(let j=0;j<seg;j++){
      const t=j/seg, t2=t*t, t3=t2*t;
      out.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  if(!closed) out.push(pts[n-1]);
  return out;
}
function hash2(i,seed){
  let x=Math.sin(i*127.1+seed*311.7)*43758.5453;
  return (x-Math.floor(x))*2-1;
}
// Fractal midpoint displacement perpendicular to the channel.
function meander(pts, amp, seed, passes){
  let cur=pts.slice();
  for(let p=0;p<passes;p++){
    const out=[cur[0]];
    const scale=amp/Math.pow(1.85,p);
    for(let i=0;i<cur.length-1;i++){
      const a=cur[i], b=cur[i+1];
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      const dx=b[0]-a[0], dy=b[1]-a[1];
      const L=Math.hypot(dx,dy)||1;
      const nx=-dy/L, ny=dx/L;
      const k=hash2(i*7.3+p*53.1, seed) * scale * Math.min(1, L/6);
      out.push([mx+nx*k, my+ny*k]);
      out.push(b);
    }
    cur=out;
  }
  return cur;
}
function pathLen(pts){
  let L=0;
  for(let i=0;i<pts.length-1;i++) L+=Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
  return L;
}
function centroid(pts){
  let x=0,y=0; pts.forEach(p=>{x+=p[0];y+=p[1]});
  return [x/pts.length, y/pts.length];
}
function toWorld(ring){ return ring.map(([lo,la])=>[wx(lo),wy(la)]); }

function countyOf(la,lo){
  if(lo<=-73.20 && la<41.45) return 'Fairfield';
  if(lo<=-73.17) return 'Litchfield';
  if(lo>-73.17 && lo<=-72.62) return la>=41.62 ? 'Hartford' : 'New Haven';
  if(lo>-72.62 && lo<=-72.15) return la>=41.62 ? 'Tolland' : 'Middlesex';
  return la>=41.72 ? 'Windham' : 'New London';
}

// ---- river names as an engraver would letter them --------------------------
const RIVER_RENAME = {
  'Quinnipiac (upper)'      : '',
  'Poquetanuck Cove'        : 'Poquetanuck Brook',
  'Indian River (Guilford)' : 'Indian River',
  'Eightmile (East)'        : 'Eight Mile River',
  'Eightmile'               : 'Eight Mile River',
  'Eightmile Brook'         : 'Eight Mile Brook',

  'Tenmile River'           : 'Ten Mile River',

  'Mill'                    : 'Mill River',

function riverLabel(name, w){
  if(name===undefined || name===null) return '';
  let n = RIVER_RENAME.hasOwnProperty(name) ? RIVER_RENAME[name] : name;
  if(!n) return '';
  n = n.replace(/\s*\(.*\)\s*$/,'').trim();
  if(!/(River|Brook|Creek)$/.test(n)) n += ' River';
  if(w>=3) return n.toUpperCase();          // the great rivers, lettered large
  if(w>=2) return n;                        // secondary rivers, spelled out
  return n.replace(/ River$/,' R.');        // lesser streams, abbreviated
}
function makeRiver(worldPts, w, seed){
  const base = spline(worldPts, false, 4);
  const bent = meander(base, w>=3?5.2:(w===2?3.8:2.6), seed, 4);
  const smooth = spline(bent, false, 3);
  return smooth;
}

// spatial hash of all water, so terrain symbols keep clear of the channels
const WGRID=new Map(), WCELL=7;
function wkey(x,y){ return Math.floor(x/WCELL)+','+Math.floor(y/WCELL); }
(function indexWater(){
  const put=(x,y,r)=>{
    const k=wkey(x,y);
    let a=WGRID.get(k); if(!a){a=[];WGRID.set(k,a);}
    a.push([x,y,r]);
  };
  W.rivers.forEach(r=>{
    const step=Math.max(1,Math.floor(r.p.length/900));
    const clear=1.6+r.w*1.5;
    for(let i=0;i<r.p.length;i+=step) put(r.p[i][0],r.p[i][1],clear);
  });
  W.lakes.forEach(l=>{
    const step=Math.max(1,Math.floor(l.p.length/220));
    for(let i=0;i<l.p.length;i+=step) put(l.p[i][0],l.p[i][1],2.2);
    put(l.c[0],l.c[1],Math.max(2,l.rad*0.72));
  });
})();
function nearWater(x,y,extra){
  const cx=Math.floor(x/WCELL), cy=Math.floor(y/WCELL);
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const a=WGRID.get((cx+i)+','+(cy+j));
    if(!a) continue;
    for(const [px,py,r] of a){
      const rr=r+extra;
      if((px-x)*(px-x)+(py-y)*(py-y) < rr*rr) return true;
    }
  }
  return false;
}

function vnoise(x,y,seed){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const h=(a,b)=>{ let n=Math.sin(a*127.1+b*311.7+seed*74.7)*43758.5453; return n-Math.floor(n); };
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v) + (h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;
}
function forestField(lat,lon){
  return vnoise(lon*7.5, lat*7.5, 3)*0.6 + vnoise(lon*17, lat*17, 9)*0.4;
}

const GLYPHS=[];
(function buildGlyphs(){
  // relief drawn the old way: little sugarloaf hills, larger and closer
  // together where the ground rises hardest, shaded on one flank.
  const stepLat=0.0150, stepLon=0.0180, D=0.006;
  for(let lat=40.98; lat<42.06; lat+=stepLat){
    for(let lon=-73.76; lon<-71.77; lon+=stepLon){
      const jlat=lat+(rnd()-0.5)*stepLat*0.9, jlon=lon+(rnd()-0.5)*stepLon*0.9;
      if(!inCT(jlon,jlat)) continue;
      const z =elevFt(jlat,jlon);
      const zx=(elevFt(jlat,jlon+D)-elevFt(jlat,jlon-D))/2;
      const zy=(elevFt(jlat+D,jlon)-elevFt(jlat-D,jlon))/2;
      const slope=Math.hypot(zx,zy);
      if(slope<11 && z<620) continue;
      const x=wx(jlon), y=wy(jlat);
      if(nearWater(x,y,1.6)) continue;
      const inten=Math.max(0, Math.min(1,(slope-8)/44));
      if(rnd()>0.42+inten*0.58) continue;
      GLYPHS.push({
        x, y,
        w: 3.0+inten*3.4+rnd()*1.0,
        h: 2.2+inten*3.0+rnd()*0.8,
        a: 0.40+inten*0.40,
        s: rnd()<0.5?1:-1,            // which flank carries the shading
        hi: z>760
      });
    }
  }
  GLYPHS.sort((a,b)=>a.y-b.y);   // southern hills overlap those behind them
})();

function makeParchment(){
  const c=document.createElement('canvas'); c.width=c.height=440;
  const x=c.getContext('2d');
  x.fillStyle='#efe7cd'; x.fillRect(0,0,440,440);
  const r=mulberry(7);
  for(let i=0;i<2200;i++){
    const px=r()*440, py=r()*440, rad=1+r()*14;
    x.globalAlpha=0.012+r()*0.028;
    x.fillStyle = r()<0.5 ? '#cbbe96' : '#faf5e4';
    x.beginPath(); x.arc(px,py,rad,0,6.283); x.fill();
  }
  // foxing: the small rust spots on old plates
  for(let i=0;i<190;i++){
    x.globalAlpha=0.05+r()*0.10;
    x.fillStyle= r()<0.6 ? '#b99a63' : '#a8823f';
    const px=r()*440, py=r()*440, rad=0.7+r()*2.6;
    x.beginPath(); x.arc(px,py,rad,0,6.283); x.fill();
  }
  for(let i=0;i<320;i++){
    x.globalAlpha=0.02+r()*0.035; x.strokeStyle='#c3b892'; x.lineWidth=0.4+r()*0.7;
    x.beginPath();
    const px=r()*440, py=r()*440, len=8+r()*30, ang=r()*6.283;
    x.moveTo(px,py); x.lineTo(px+Math.cos(ang)*len, py+Math.sin(ang)*len); x.stroke();
  }
  x.globalAlpha=1;
  parchTex=x.createPattern(c,'repeat');

}

function drawUnexplored(x0,y0,x1,y1){

let padX=0, padY=0;
function drawWorld(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const [x0,y0]=worldOf(-padX,-padY), [x1,y1]=worldOf(w+padX,h+padY);
  const gdetail = window.innerWidth<=860 ? 0.58 : 1;
  const vis=(x,y,m)=> x>x0-m && x<x1+m && y>y0-m && y<y1+m;

  // everything beyond the state line is blank, unsurveyed paper
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=UNK; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.restore();
  drawUnexplored(x0,y0,x1,y1);

  // the surveyed ground: everything from here on is confined to the state
  ctx.save();
  path(W.outline,true); ctx.clip();
  ctx.fillStyle=LAND_HI; ctx.fillRect(x0-50,y0-50,(x1-x0)+100,(y1-y0)+100);

  ctx.save();
  ctx.strokeStyle='rgba(42,36,24,.62)'; ctx.lineWidth=0.6/view.s;
  ctx.setLineDash([]);
  W.towns.forEach(t=>{ t.r.forEach(rg=>{ if(vis(rg[0][0],rg[0][1],400)){ path(rg,true); ctx.stroke(); } }); });
  ctx.restore();

  const gs=Math.max(0.75,Math.min(1.5,0.9/view.s));
  const gskip = gdetail<1 ? 2 : 1;   // thin the hills out on small screens
  GLYPHS.forEach((gl,gi)=>{
    if(gskip>1 && (gi%gskip)) return;
    if(!vis(gl.x,gl.y,60)) return;
    drawHill(gl,gs);
  });

  ctx.lineCap='round'; ctx.lineJoin='round';

  // ---- lakes: parchment-toned wash, ruled hatching, ink shore (antique convention)
  W.lakes.forEach(l=>{
    path(l.p,true);
    ctx.fillStyle='#dfe0d2'; ctx.fill();
    ctx.save(); ctx.clip();
    const step=Math.max(1.5, Math.min(3.4, l.rad*0.16));
    ctx.strokeStyle=WATER_INK; ctx.globalAlpha=0.30; ctx.lineWidth=0.55/view.s;
    ctx.beginPath();
    for(let y=l.c[1]-l.rad; y<=l.c[1]+l.rad; y+=step){
      ctx.moveTo(l.c[0]-l.rad, y); ctx.lineTo(l.c[0]+l.rad, y);
    }
    ctx.stroke();
    ctx.globalAlpha=0.5;
    for(let k=1;k<=2;k++){
      ctx.lineWidth=0.7/view.s;
      ctx.beginPath();
      l.p.forEach((p,i)=>{
        const x=l.c[0]+(p[0]-l.c[0])*(1-k*0.06), y=l.c[1]+(p[1]-l.c[1])*(1-k*0.06);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      });
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    path(l.p,true);
    ctx.strokeStyle=WATER_INK; ctx.lineWidth=1.15/view.s; ctx.stroke();
  });

  // ---- rivers: filled tapered channel, drawn like a pen nib widening downstream
  W.rivers.forEach(r=>{
    const n=r.p.length;
    if(n<3) return;
    const head=(0.20+r.w*0.16), mouth=(0.55+r.w*0.92);
    const minW=0.55/view.s;
    const L=[], R=[];
    for(let i=0;i<n;i++){
      const a=r.p[Math.max(0,i-1)], b=r.p[Math.min(n-1,i+1)];
      let dx=b[0]-a[0], dy=b[1]-a[1];
      const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
      const t2=i/(n-1);
      const ease=Math.pow(t2,0.72);
      let w=(head+(mouth-head)*ease)*0.5;
      w*= 1 + Math.sin(i*0.21+r.w*3.3)*0.10;
      w=Math.max(w, minW);
      L.push([r.p[i][0]-dy*w, r.p[i][1]+dx*w]);
      R.push([r.p[i][0]+dy*w, r.p[i][1]-dx*w]);
    }
    ctx.beginPath();
    ctx.moveTo(L[0][0],L[0][1]);
    for(let i=1;i<n;i++) ctx.lineTo(L[i][0],L[i][1]);
    for(let i=n-1;i>=0;i--) ctx.lineTo(R[i][0],R[i][1]);
    ctx.closePath();
    ctx.fillStyle=WATER_INK; ctx.fill();

    // faint bank echo alongside larger rivers, as engravers drew them
    if(r.w>=2 && view.s>0.5){
      ctx.strokeStyle=WATER_INK; ctx.globalAlpha=0.22; ctx.lineWidth=0.5/view.s;
      for(const side of [L,R]){
        ctx.beginPath();
        for(let i=0;i<n;i+=2){
          const a=r.p[Math.max(0,i-1)], b=r.p[Math.min(n-1,i+1)];
          let dx=b[0]-a[0], dy=b[1]-a[1];
          const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
          const off=(side===L?-1:1)*1.5/view.s;
          const x=side[i][0]-dy*off, y=side[i][1]+dx*off;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  });

  // inner shading band, laid just inside the boundary
  ctx.strokeStyle='rgba(42,36,24,.20)'; ctx.lineWidth=7/view.s; ctx.lineJoin='round';
  path(W.outline,true); ctx.stroke();
  ctx.restore();   // end of the state clip

  // the state line itself: one clean drawn border
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='rgba(42,36,24,.35)'; ctx.lineWidth=3.2/view.s;
  path(W.outline,true); ctx.stroke();
  ctx.strokeStyle=INK; ctx.lineWidth=1.6/view.s;
  path(W.outline,true); ctx.stroke();

  drawCompass();
  drawTitle();

  drawLabels(vis);
  drawSites(vis);
}

function drawHill(gl,gs){
  const w=gl.w*gs, h=gl.h*gs, x=gl.x, y=gl.y, f=gl.s;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(42,36,24,'+gl.a.toFixed(2)+')';
  ctx.lineWidth=Math.max(0.25, 0.42*gs);

  // the profile: a leaning hump, steeper on the shaded side
  const apexX = x + f*w*0.06;
  ctx.beginPath();
  ctx.moveTo(x-f*w*0.5, y);
  ctx.quadraticCurveTo(x-f*w*0.26, y-h*1.02, apexX, y-h);
  ctx.quadraticCurveTo(x+f*w*0.28, y-h*0.52, x+f*w*0.5, y);
  ctx.stroke();

  // short strokes down the shaded flank
  ctx.lineWidth=Math.max(0.18, 0.30*gs);
  ctx.globalAlpha=0.75;
  for(let k=1;k<=3;k++){
    const t=k/4;
    const sx=apexX + f*w*0.44*t, sy=y-h*(1-t*t*0.92);
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx + f*w*0.06, sy + h*0.30);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  if(gl.hi){   // the high summits get a crown stroke
    ctx.lineWidth=Math.max(0.22, 0.36*gs);
    ctx.beginPath();
    ctx.moveTo(apexX-f*w*0.10, y-h*0.94);
    ctx.lineTo(apexX+f*w*0.10, y-h*0.86);
    ctx.stroke();
  }
}

  ctx.lineWidth=Math.max(2.4,size*0.28); ctx.strokeStyle='rgba(244,238,219,.92)'; ctx.lineJoin='round';
  if(spacing){
    const chars=txt.split(''); const wsum=chars.reduce((a,c)=>a+ctx.measureText(c).width+spacing,0)-spacing;
    let cx=x-wsum/2;
    ctx.textAlign='left';
    chars.forEach(c=>{ ctx.strokeText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    cx=x-wsum/2;
    ctx.fillStyle=color;
    chars.forEach(c=>{ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    ctx.textAlign='center';
  } else {
    ctx.strokeText(txt,x,y); ctx.fillStyle=color; ctx.fillText(txt,x,y);
  }
}

// A name is set once, straight, on the calmest reach of the channel — the way
// an engraver would letter it, rather than bending it around every meander.
function textAlongPath(txt, pts, size, color, startFrac, track){
  if(!txt || pts.length<2) return false;
  const sp=size*(track===undefined?0.10:track);
  fellText(txt,size,'italic');
  const hasLS=('letterSpacing' in ctx);
  if(hasLS) ctx.letterSpacing=sp.toFixed(2)+'px';
  const wTxt=ctx.measureText(txt).width + (hasLS?0:sp*(txt.length-1));
  const done=(v)=>{ if(hasLS) ctx.letterSpacing='0px'; return v; };

  // even resample of the channel
  const step=Math.max(size*0.45, 1.5);
  const P=[pts[0]];
  let acc=0;
  for(let i=0;i<pts.length-1;i++){
    const [ax,ay]=pts[i], [bx,by]=pts[i+1];
    const d=Math.hypot(bx-ax,by-ay);
    if(d<=0) continue;
    let t=step-acc;
    while(t<d){ P.push([ax+(bx-ax)*(t/d), ay+(by-ay)*(t/d)]); t+=step; }
    acc=(acc+d)%step;
  }
  if(P.length<3) return done(false);

  // for each start, walk until the straight-line span covers the name;
  // score by how little the channel wanders over that span
  let best=null;
  for(let i=0;i<P.length-1;i++){
    let j=i+1, run=0;
    while(j<P.length && Math.hypot(P[j][0]-P[i][0], P[j][1]-P[i][1]) < wTxt){
      run+=Math.hypot(P[j][0]-P[j-1][0], P[j][1]-P[j-1][1]);
      j++;
    }
    if(j>=P.length) break;
    run+=Math.hypot(P[j][0]-P[j-1][0], P[j][1]-P[j-1][1]);
    const straight=wTxt/(run||1);                 // 1.0 for a perfectly straight reach
    const centred=1-Math.abs(((i+j)/2)/(P.length-1) - startFrac);
    let th=Math.abs(Math.atan2(P[j][1]-P[i][1], P[j][0]-P[i][0]));
    if(th>Math.PI/2) th=Math.PI-th;               // 0 flat, PI/2 straight up the page
    const level=1-th/(Math.PI/2);                 // names read best near horizontal
    const score=straight*2.2 + level*1.1 + centred*0.6;
    if(!best || score>best.score) best={score, a:P[i], b:P[j]};
  }
  if(!best) return done(false);

  let ang=Math.atan2(best.b[1]-best.a[1], best.b[0]-best.a[0]);
  if(ang>  Math.PI/2) ang-=Math.PI;               // never mirrored, never upside down
  if(ang< -Math.PI/2) ang+=Math.PI;
  const mx=(best.a[0]+best.b[0])/2, my=(best.a[1]+best.b[1])/2;
  const off=size*0.75;                            // sit the name just off the water

  ctx.save();
  ctx.translate(mx + Math.sin(ang)*off, my - Math.cos(ang)*off);
  ctx.rotate(ang);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.lineWidth=Math.max(2.4,size*0.34);
  ctx.strokeStyle='rgba(244,238,219,.92)';
  ctx.strokeText(txt,0,0);
  ctx.fillStyle=color;
  ctx.fillText(txt,0,0);
  ctx.restore();
  return done(true);
}

// longest stretch of a world-space path that lies within the state line
function insideRun(pts){
  let best=[], cur=[];
  for(const p of pts){
    const lon=p[0]/(DEG*COSL)+LON0, lat=-p[1]/DEG+LAT0;
    if(inCT(lon,lat)){ cur.push(p); if(cur.length>best.length) best=cur; }
    else cur=[];
  }
  return best;
}
function drawWaterLabels(vis){
  const inv=1/view.s;
  const RIVER_INK='rgba(47,58,64,.95)';

  W.rivers.forEach((r,idx)=>{
    if(!r.n) return;
    if(!r.pin) r.pin=insideRun(r.p);
    if(r.pin.length<8) return;
    const minZ = r.w>=3 ? 0.24 : (r.w===2 ? 0.34 : 0.80);
    if(view.s < minZ) return;
    const mid=r.pin[Math.floor(r.pin.length/2)];
    if(!vis(mid[0],mid[1],220)) return;
    const size=(r.w>=3?11.5:r.w===2?10.5:9.5)*inv;
    const frac = r.w>=3 ? 0.35 : 0.5;
    const track = r.w>=3 ? 0.30 : (r.w===2 ? 0.16 : 0.10);
    textAlongPath(r.n, r.pin, size, RIVER_INK, frac, track);
  });

  W.lakes.forEach(l=>{
    if(!vis(l.c[0],l.c[1],120)) return;
    const px=l.rad*view.s;
    if(px<26) return;
    const size=Math.max(9, Math.min(13, l.rad*0.42))*inv;
    haloText(l.n, l.c[0], l.c[1], size, 'rgba(47,58,64,.95)', 'italic', 0.6*inv);
  });
}

function drawSites(vis){
  const inv=1/view.s;

  const hx=wx(HOME.lon), hy=wy(HOME.lat);
  ctx.save();
  ctx.strokeStyle=INK; ctx.lineWidth=1.1*inv;
  ctx.fillStyle='#8c3a2a';
  ctx.beginPath(); ctx.arc(hx,hy,3.4*inv,0,6.283); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(hx,hy,5.8*inv,0,6.283); ctx.stroke();
  haloText('MILFORD',hx,hy+11*inv,10.5*inv,'#8c3a2a','',0.8*inv);
  ctx.restore();

  SITES.forEach((s,i)=>{
    if(shown ? !shown.has(i) : !activeCat[s.c]) return;
    const x=wx(s.lon), y=wy(s.lat);
    if(!vis(x,y,60)) return;
    const sel=(i===selected), hov=(i===hovered);
    const S=(sel?1.4:1)*inv;
    const col=CAT[s.c].color;
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=INK; ctx.lineWidth=0.9*S;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(x,y,3.1*S,0,6.283); ctx.fill(); ctx.stroke();
    if(s.c==='hike'){
      ctx.beginPath(); ctx.arc(x,y,5.2*S,0,6.283); ctx.stroke();
    } else if(s.c==='rwa'){
      ctx.beginPath();
      ctx.moveTo(x-5.0*S,y); ctx.lineTo(x+5.0*S,y);
      ctx.moveTo(x,y-5.0*S); ctx.lineTo(x,y+5.0*S);
      ctx.stroke();
    } else if(s.c==='preserve'){
      ctx.beginPath();
      for(let k=0;k<4;k++){
        const a=Math.PI/4+k*Math.PI/2;
        ctx.moveTo(x+Math.cos(a)*3.9*S, y+Math.sin(a)*3.9*S);
        ctx.lineTo(x+Math.cos(a)*6.0*S, y+Math.sin(a)*6.0*S);
      }
      ctx.stroke();
    } else if(s.c==='open'){
      ctx.beginPath(); ctx.rect(x-5.0*S,y-5.0*S,10.0*S,10.0*S); ctx.stroke();
    }
    if(sel){
      ctx.strokeStyle='rgba(140,58,42,.9)'; ctx.lineWidth=1.0*S;
      ctx.beginPath(); ctx.arc(x,y,9.5*S,0,6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,y,11.8*S,0,6.283); ctx.stroke();
    }
    ctx.restore();
    if(view.s>1.15||sel||hov)
      haloText(s.n,x,y-(sel?15:9.5)*inv,(sel?12:10)*inv,LABEL,'',0.3*inv);
  });
}

function drawCompass(){
  const x=wx(-73.30), y=wy(40.94), R=36, inv=1;
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle=INK; ctx.fillStyle='rgba(246,239,217,.6)';
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,R*0.86,0,6.283); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R*0.72,0,6.283); ctx.stroke();
  for(let k=0;k<8;k++){
    const a=k*Math.PI/4, len=(k%2===0)?R:R*0.55, wdt=(k%2===0)?0.16:0.11;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*len,Math.sin(a)*len);
    ctx.lineTo(Math.cos(a+wdt)*R*0.22,Math.sin(a+wdt)*R*0.22);
    ctx.lineTo(Math.cos(a-wdt)*R*0.22,Math.sin(a-wdt)*R*0.22);
    ctx.closePath();
    ctx.fillStyle=(k%2===0)?INK:'#b8b09a'; ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle=INK;
  fellText('N',16,''); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('N',0,-R-11); ctx.fillText('S',0,R+11);
  ctx.fillText('E',R+11,0); ctx.fillText('W',-R-11,0);
  ctx.restore();
}

function drawFrame(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const grd=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.25,w/2,h/2,Math.max(w,h)*0.78);
  grd.addColorStop(0,'rgba(120,100,60,0)'); grd.addColorStop(0.70,'rgba(120,100,60,.07)'); grd.addColorStop(1,'rgba(96,78,44,.24)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#2a2418'; ctx.lineWidth=7; ctx.strokeRect(4,4,w-8,h-8);
  ctx.strokeStyle='#f6efd9'; ctx.lineWidth=2; ctx.strokeRect(9.5,9.5,w-19,h-19);
  ctx.strokeStyle='#2a2418'; ctx.lineWidth=1.2; ctx.strokeRect(13,13,w-26,h-26);
  ctx.strokeStyle='#2a2418'; ctx.lineWidth=0.8;
  ctx.beginPath();
  for(let i=1;i<12;i++){
    const px=13+(w-26)*i/12, py=13+(h-26)*i/12;
    ctx.moveTo(px,4); ctx.lineTo(px,13);
    ctx.moveTo(px,h-13); ctx.lineTo(px,h-4);
    ctx.moveTo(4,py); ctx.lineTo(13,py);
    ctx.moveTo(w-13,py); ctx.lineTo(w-4,py);
  }
  ctx.stroke();
  ctx.restore();
}

let parchPattern=null;
const snap={cv:document.createElement('canvas'),ok:false,s:1,x:0,y:0,px:0,py:0,w:0,h:0};
let interacting=false, idleTimer=null;

function beginInteract(){
  interacting=true;
  if(idleTimer) clearTimeout(idleTimer);
}
function endInteract(delay){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ interacting=false; dirty=true; }, delay===undefined?110:delay);
}

function renderFull(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const px=Math.round(w*0.28), py=Math.round(h*0.28);
  const sw=w+px*2, sh=h+py*2;
  if(snap.cv.width!==Math.round(sw*dpr)||snap.cv.height!==Math.round(sh*dpr)){
    snap.cv.width=Math.round(sw*dpr); snap.cv.height=Math.round(sh*dpr);
  }
  const sctx=snap.cv.getContext('2d');
  const prev=ctx; ctx=sctx;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,sw,sh);
  ctx.save();
  ctx.translate(view.x+px, view.y+py); ctx.scale(view.s,view.s);
  padX=px; padY=py;
  drawWorld();
  padX=0; padY=0;
  ctx.restore();
  ctx=prev;
  snap.s=view.s; snap.x=view.x; snap.y=view.y;
  snap.px=px; snap.py=py; snap.w=sw; snap.h=sh; snap.ok=true;
  blit();
}

function blit(){
  const w=stage.clientWidth, h=stage.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=UNK;
  ctx.fillRect(0,0,w,h);
  if(snap.ok){
    const k=view.s/snap.s;
    const wx0=(-snap.px-snap.x)/snap.s, wy0=(-snap.py-snap.y)/snap.s;
    const dx=wx0*view.s+view.x, dy=wy0*view.s+view.y;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(snap.cv, 0,0,snap.cv.width,snap.cv.height, dx,dy, snap.w*k, snap.h*k);
  }
  if(!parchPattern) parchPattern=ctx.createPattern(parchCanvas,'repeat');
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=0.5;
  ctx.fillStyle=parchPattern;
  ctx.fillRect(0,0,w,h);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  drawFrame();
}

function loop(){
  if(inertia) stepInertia();
  if(dirty){ dirty=false; interacting ? blit() : renderFull(); }
  requestAnimationFrame(loop);
}

let inertia=null;
function stepInertia(){
  view.x+=inertia.vx; view.y+=inertia.vy;
  inertia.vx*=0.92; inertia.vy*=0.92;
  dirty=true;
  if(Math.hypot(inertia.vx,inertia.vy)<0.4){ inertia=null; endInteract(30); }
}

function fitSites(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const usableH=h, pad=isPhone()?26:60;
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  SITES.forEach(s=>{
    a=Math.min(a,wx(s.lon)); b=Math.max(b,wx(s.lon));
    c=Math.min(c,wy(s.lat)); d=Math.max(d,wy(s.lat));
  });
  const s=Math.min((w-pad*2)/(b-a),(usableH-pad*2)/(d-c));
  view.s=clampScale(s);
  view.x=w/2-((a+b)/2)*view.s;
  view.y=usableH/2-((c+d)/2)*view.s;
  dirty=true;
}
function fitAll(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const pad=isPhone()?18:40;
  const usableH=h;
  const x0=wx(-73.78),x1=wx(-71.76),y0=wy(42.09),y1=wy(40.96);
  const s=Math.max(0.02, Math.min((w-pad*2)/(x1-x0),(usableH-pad*2)/(y1-y0)));
  minScale=Math.min(0.18, s*0.75);
  view.s=s;
  view.x=w/2-((x0+x1)/2)*s;
  view.y=usableH/2-((y0+y1)/2)*s;
  dirty=true;
}

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};stage.classList.add('drag');beginInteract();});
window.addEventListener('mouseup',e=>{
  if(drag&&!drag.moved){
    const i=pick(e);
    if(i>=0) select(i); else clearSelection();
  }
  drag=null; stage.classList.remove('drag'); endInteract();
});
window.addEventListener('mousemove',e=>{
  if(drag){
    if(Math.abs(e.clientX-drag.x)>3||Math.abs(e.clientY-drag.y)>3) drag.moved=true;
    view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); dirty=true;
  } else if(!isTouch) hoverAt(e);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  beginInteract(); endInteract(160);
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const [wx0,wy0]=worldOf(mx,my);
  view.s=clampScale(view.s*(1-Math.sign(e.deltaY)*0.12));
  view.x=mx-wx0*view.s; view.y=my-wy0*view.s; dirty=true;
},{passive:false});

const isTouch = (window.matchMedia && window.matchMedia('(hover:none)').matches) || ('ontouchstart' in window);
const isPhone = () => window.innerWidth <= 860;

let tp=null;
function midpoint(e){
  const r=cv.getBoundingClientRect();
  let x=0,y=0;
  for(const t of e.touches){ x+=t.clientX-r.left; y+=t.clientY-r.top; }
  return [x/e.touches.length, y/e.touches.length];
}
function spread(e){
  return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                    e.touches[0].clientY-e.touches[1].clientY);
}
cv.addEventListener('touchstart',e=>{
  const r=cv.getBoundingClientRect();
  inertia=null; beginInteract();
  if(e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    tp={mode:'pan',px,py,vx:view.x,vy:view.y,sx:px,sy:py,t0:Date.now(),moved:false,
        lx:px,ly:py,lt:Date.now(),vX:0,vY:0};
  } else if(e.touches.length===2){
    const [mx,my]=midpoint(e);
    tp={mode:'pinch',d:spread(e),mx,my,moved:true};
  }
},{passive:false});

cv.addEventListener('touchmove',e=>{
  if(!tp) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(tp.mode==='pan' && e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    if(Math.abs(px-tp.sx)>6||Math.abs(py-tp.sy)>6) tp.moved=true;
    const now=Date.now(), dt=Math.max(1,now-tp.lt);
    tp.vX=(px-tp.lx)/dt*16; tp.vY=(py-tp.ly)/dt*16;
    tp.lx=px; tp.ly=py; tp.lt=now;
    view.x=tp.vx+(px-tp.sx); view.y=tp.vy+(py-tp.sy);
    dirty=true;
  } else if(e.touches.length===2){
    if(tp.mode!=='pinch'){ const [mx,my]=midpoint(e); tp={mode:'pinch',d:spread(e),mx,my,moved:true}; return; }
    const d=spread(e), [mx,my]=midpoint(e);
    const [wx0,wy0]=worldOf(mx,my);
    if(tp.d>0) view.s=clampScale(view.s*(d/tp.d));
    view.x=mx-wx0*view.s; view.y=my-wy0*view.s;
    tp.d=d; tp.mx=mx; tp.my=my;
    dirty=true;
  }
},{passive:false});

let lastTap=0;
cv.addEventListener('touchend',e=>{
  if(tp && tp.mode==='pan' && tp.moved && Date.now()-tp.lt<90 && Math.hypot(tp.vX,tp.vY)>3){
    inertia={vx:Math.max(-38,Math.min(38,tp.vX)), vy:Math.max(-38,Math.min(38,tp.vY))};
  } else if(e.touches.length===0){ endInteract(); }
  if(tp && tp.mode==='pan' && !tp.moved && Date.now()-tp.t0<400){
    const i=pickAt(tp.sx,tp.sy);
    const now=Date.now();
    if(i>=0){ select(i); }
    else if(now-lastTap<300){ zoomAt(tp.sx,tp.sy,1.6); }
    else { clearSelection(); }
    lastTap=now;
  }
  if(e.touches.length===0) tp=null;
},{passive:true});
cv.addEventListener('touchcancel',()=>{tp=null;inertia=null;endInteract()},{passive:true});

function pickAt(sx,sy){
  const [mx,my]=worldOf(sx,sy);
  let best=-1,bd=1e9;
  SITES.forEach((s,i)=>{
    if(!activeCat[s.c]) return;
    const d=Math.hypot(wx(s.lon)-mx, wy(s.lat)-my);
    if(d<bd){bd=d;best=i;}
  });
  return bd < (isTouch?22:11)/view.s ? best : -1;
}
function pick(e){
  const r=cv.getBoundingClientRect();
  return pickAt(e.clientX-r.left, e.clientY-r.top);
}
function hoverAt(e){
  const i=pick(e);
  if(i!==hovered){ hovered=i; dirty=true; }
  const r=cv.getBoundingClientRect();
  if(i>=0){
    const s=SITES[i];
    tip.querySelector('.n').textContent=s.n;
    tip.querySelector('.m').textContent=s.town+' · '+s.min+' min drive';
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top-14)+'px';
    tip.style.opacity=1; cv.style.cursor='pointer';
  } else { tip.style.opacity=0; cv.style.cursor=''; }
}

function siteRow(i){ return document.querySelector('.site[data-i="'+i+'"]'); }
function siteInfo(i){ return document.querySelector('.info[data-i="'+i+'"]'); }

function select(i){
  if(selected>=0 && selected!==i){
    const pi=siteInfo(selected); if(pi) pi.classList.remove('show');
    const pr=siteRow(selected); if(pr) pr.classList.remove('on');
  }
  selected=i; dirty=true;
  const s=SITES[i], box=siteInfo(i), row=siteRow(i);
  if(!box) return;
  box.innerHTML =
    '<div class="ihead"><h3>'+s.n+'</h3>'+
      '<button class="x" aria-label="Close details">\u2715</button></div>'+
    '<div class="sub"><i style="background:'+CAT[s.c].color+'"></i>'+CAT[s.c].label+' \u00b7 '+s.town+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+s.min+'</b><span>min drive</span></div>'+
      '<div class="stat"><b>'+s.mi+'</b><span>mi from Milford</span></div>'+
      '<div class="stat"><b>'+Math.round(elevFt(s.lat,s.lon))+'</b><span>feet</span></div>'+
    '</div>'+
    '<p class="desc">'+s.d+'</p>'+
    '<div class="pk"><h4>Best parking</h4><p>'+s.p+'</p></div>';
  box.classList.add('show');
  box.querySelector('.x').onclick=ev=>{ ev.stopPropagation(); clearSelection(); };
  if(row){ row.classList.add('on'); row.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  panTo(i);
}

function clearSelection(){
  if(selected>=0){
    const b=siteInfo(selected); if(b) b.classList.remove('show');
    const r=siteRow(selected); if(r) r.classList.remove('on');
  }
  selected=-1; dirty=true;
}

function panTo(i){
  const s=SITES[i], w=stage.clientWidth, h=stage.clientHeight;
  const ts=Math.max(view.s, isPhone()?1.0:1.15);
  const cy=h/2;
  const from={s:view.s,x:view.x,y:view.y};
  const to={s:ts,x:w/2-wx(s.lon)*ts,y:cy-wy(s.lat)*ts};
  const t0=performance.now();
  beginInteract();
  (function step(now){
    const t=Math.min(1,(now-t0)/520), e=1-Math.pow(1-t,3);
    view.s=from.s+(to.s-from.s)*e; view.x=from.x+(to.x-from.x)*e; view.y=from.y+(to.y-from.y)*e;
    dirty=true;
    if(t<1) requestAnimationFrame(step); else endInteract(20);
  })(t0);
}

document.getElementById('b-in').onclick=()=>{beginInteract();zoomBy(1.35);endInteract(140)};
document.getElementById('b-out').onclick=()=>{beginInteract();zoomBy(1/1.35);endInteract(140)};
let resetToggle=0;
document.getElementById('b-reset').onclick=()=>{
  clearSelection();
  beginInteract();
  fitAll();
  endInteract(140);
};
function zoomBy(k){
  const w=stage.clientWidth/2,h=stage.clientHeight/2;
  const [x0,y0]=worldOf(w,h);
  view.s=clampScale(view.s*k);
  view.x=w-x0*view.s; view.y=h-y0*view.s; dirty=true;
}

function buildPanel(){
  const f=document.getElementById('filters');
  Object.entries(CAT).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed','true');
    b.innerHTML='<i style="background:'+v.color+'"></i>'+v.label;
    b.onclick=()=>{
      activeCat[k]=!activeCat[k]; b.setAttribute('aria-pressed',activeCat[k]);
      if(selected>=0&&!activeCat[SITES[selected].c]) clearSelection();
      applyFilters();
    };
    f.appendChild(b);
  });

  const list=document.getElementById('list');
  const order=SITES.map((s,i)=>i).sort((a,b)=> SITES[a].min-SITES[b].min || SITES[a].n.localeCompare(SITES[b].n));

  TIME_BANDS.forEach((band,bi)=>{
    const inBand=order.filter(i=> SITES[i].min>=band.lo && SITES[i].min<band.hi);
    if(!inBand.length) return;
    const hd=document.createElement('div');
    hd.className='band'; hd.dataset.band=bi; hd.textContent=band.t;
    list.appendChild(hd);
    inBand.forEach(i=>{
      const s=SITES[i];
      const row=document.createElement('div');
      row.className='site'; row.dataset.i=i; row.dataset.c=s.c; row.dataset.band=bi;
      row.innerHTML='<span class="dot" style="background:'+CAT[s.c].color+'"></span>'+
        '<span class="nm">'+s.n+'<span class="tw">'+s.town+' \u00b7 '+s.mi+' miles</span></span>'+
        '<span class="el">'+s.min+' min</span>';
      row.onclick=()=>{ selected===i ? clearSelection() : select(i); };
      if(!isTouch){
        row.onmouseenter=()=>{hovered=i;dirty=true};
        row.onmouseleave=()=>{hovered=-1;dirty=true};
      }
      list.appendChild(row);

      const box=document.createElement('div');
      box.className='info'; box.dataset.i=i; box.dataset.c=s.c; box.dataset.band=bi;
      list.appendChild(box);
    });
  });

  const q=document.getElementById('q'), tsel=document.getElementById('tsel');
  q.addEventListener('input', applyFilters);
  tsel.addEventListener('change', applyFilters);
  document.getElementById('rand').onclick=surpriseMe;
  applyFilters();
}

// ---- searching: by name/town, or by the minutes of the ride --------------
let shown=null;   // Set of visible site indices, shared with the map
function parseQuery(raw){
  const q=(raw||'').trim().toLowerCase();
  if(!q) return {text:'', mins:0};
  const m=q.match(/^(?:under|within|<=?|less than)?\s*(\d{1,3})\s*(?:min|mins|minutes|m)?$/);
  if(m) return {text:'', mins:parseInt(m[1],10)};
  const h=q.match(/^(?:under|within|<=?)?\s*(\d(?:\.\d)?)\s*(?:h|hr|hrs|hour|hours)$/);
  if(h) return {text:'', mins:Math.round(parseFloat(h[1])*60)};
  return {text:q, mins:0};
}
function matches(i){
  const s=SITES[i];
  if(!activeCat[s.c]) return false;
  const cap=parseInt(document.getElementById('tsel').value,10);
  if(s.min>cap) return false;
  const {text,mins}=parseQuery(document.getElementById('q').value);
  if(mins && s.min>mins) return false;
  if(text && !(s.n+' '+s.town+' '+(s.b||'')).toLowerCase().includes(text)) return false;
  return true;
}
function applyFilters(){
  shown=new Set();
  SITES.forEach((s,i)=>{ if(matches(i)) shown.add(i); });
  document.querySelectorAll('.site,.info').forEach(el=>{
    el.classList.toggle('off', !shown.has(+el.dataset.i));
  });
  document.querySelectorAll('.band').forEach(hd=>{
    const any=[...document.querySelectorAll('.site[data-band="'+hd.dataset.band+'"]')]
      .some(r=>!r.classList.contains('off'));
    hd.classList.toggle('off', !any);
  });
  const n=shown.size;
  document.getElementById('cnt').textContent =
    n===0 ? 'no places answer to that' : (n===1 ? '1 place' : n+' places');
  if(selected>=0 && !shown.has(selected)) clearSelection();
  dirty=true;
}

// ---- pick one at random from whatever is presently shown -----------------
function surpriseMe(){
  const pool=[...shown];
  if(!pool.length) return;
  let i=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1 && i===selected) i=pool[(pool.indexOf(i)+1)%pool.length];
  select(i);
  const row=siteRow(i);
  if(row) row.scrollIntoView({block:'center',behavior:'smooth'});
}

let lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  const w=window.innerWidth, h=window.innerHeight;
  const bigChange = w!==lastW || Math.abs(h-lastH)>140;
  resize();
  if(bigChange) fitAll();
  lastW=w; lastH=h;
});
window.addEventListener('orientationchange',()=>{ setTimeout(()=>{resize();fitAll()},260); });
resize();
buildPanel();
fitAll();
loop();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{dirty=true});
</script>
