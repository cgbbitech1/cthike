<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Connecticut — every trail, preserve and open space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#dbbe86; --parch-lo:#c9a869; --parch-hi:#e8d3a2;
  --ink:#4a2c12; --ink-2:#6b4520; --ink-3:#8d6635;
  --edge:#7a5227; --crimson:#8c2f18;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:#2b2317;color:var(--ink);font-family:'Spectral',Georgia,serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#app{display:flex;height:100vh;height:100dvh;width:100vw}
canvas{touch-action:none}

#stage{flex:1;position:relative;min-width:0;cursor:grab;background:#cdae76}
#stage.drag{cursor:grabbing}
canvas{display:block}

#tip{position:absolute;z-index:7;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  transition:opacity .1s;background:var(--parch-hi);border:1px solid var(--edge);
  padding:6px 10px;box-shadow:2px 3px 0 rgba(58,42,24,.25)}
#tip .n{font-family:'IM Fell English',serif;font-size:14px}
#tip .m{font-size:11px;color:var(--ink-2);font-style:italic;margin-top:1px}

#tools{position:absolute;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:7px}
#tools button{width:34px;height:34px;border:1px solid var(--edge);background:var(--parch-hi);
  color:var(--ink);font-family:'IM Fell English',serif;font-size:16px;cursor:pointer;
  box-shadow:2px 2px 0 rgba(58,42,24,.22)}
#tools button:hover{background:#f7edd4}
#tools button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(58,42,24,.22)}

#panel{width:322px;flex:none;background:var(--parch);border-left:3px double var(--edge);
  display:flex;flex-direction:column;box-shadow:-4px 0 14px rgba(0,0,0,.35);z-index:6}
#panel header{padding:16px 18px 13px;border-bottom:1px double var(--edge);text-align:center}
#panel header h2{font-family:'IM Fell English SC',serif;font-size:17px;font-weight:400;letter-spacing:.04em}
#panel header p{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-style:italic;line-height:1.5}
.rule{height:1px;background:var(--edge);opacity:.5;margin:9px 18px}

.info{display:none;padding:13px 18px 16px;background:var(--parch-hi);
  border-top:1px solid rgba(138,106,70,.5);border-bottom:1px solid rgba(138,106,70,.5)}
.info.show{display:block}
.info .ihead{display:flex;align-items:flex-start;gap:10px}
.info h3{font-family:'IM Fell English',serif;font-size:17px;font-weight:400;line-height:1.25;flex:1}
.info .x{flex:none;border:1px solid var(--edge);background:rgba(255,255,255,.35);
  color:var(--ink-2);font-size:15px;line-height:1;cursor:pointer;font-family:'Spectral',serif;
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-2px}
.info .x:hover{background:var(--crimson);color:var(--parch-hi);border-color:var(--crimson)}
.info .sub{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:11.5px;color:var(--ink-2);font-style:italic}
.info .sub i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(58,42,24,.5)}
.info .stats{display:flex;margin:12px 0;border:1px solid var(--edge);background:rgba(255,255,255,.2)}
.info .stat{flex:1;padding:7px 4px;text-align:center}
.info .stat+.stat{border-left:1px solid var(--edge)}
.info .stat b{display:block;font-family:'IM Fell English',serif;font-size:16px;font-weight:400}
.info .stat span{font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.info p.desc{font-size:13px;line-height:1.6}
.info .pk{margin-top:11px;padding-top:10px;border-top:1px solid rgba(138,106,70,.45)}
.info .pk h4{font-family:'IM Fell English SC',serif;font-size:11.5px;font-weight:400;letter-spacing:.06em;color:var(--ink-2);margin-bottom:3px}
.info .pk p{font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.filters{padding:10px 16px;border-bottom:1px double var(--edge);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:transparent;
  border:1px solid var(--edge);padding:3px 9px;cursor:pointer;font-family:'Spectral',serif}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed=false]{opacity:.38}
.chip:hover{background:rgba(255,255,255,.25)}

#list{flex:1;overflow-y:auto;padding-bottom:18px}
#list::-webkit-scrollbar{width:9px}
#list::-webkit-scrollbar-track{background:rgba(138,106,70,.12)}
#list::-webkit-scrollbar-thumb{background:rgba(138,106,70,.5)}
.band{font-family:'IM Fell English SC',serif;font-size:12px;letter-spacing:.08em;color:var(--ink-2);
  padding:14px 18px 5px;text-align:center}
.band::after{content:'';display:block;width:44px;height:1px;background:var(--edge);margin:5px auto 0;opacity:.6}
.site{display:flex;align-items:baseline;gap:9px;padding:6px 18px;cursor:pointer;border-left:3px solid transparent}
.site:hover,.site.on{background:rgba(255,255,255,.32);border-left-color:var(--crimson)}
.site .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(1px);border:1px solid rgba(58,42,24,.45)}
.site .nm{font-family:'IM Fell English',serif;font-size:14px;line-height:1.3;flex:1}
.site .tw{display:block;font-family:'Spectral',serif;font-size:10.5px;color:var(--ink-3);font-style:italic}
.site .el{font-size:11px;color:var(--ink-3);flex:none;font-style:italic}
.site.off{display:none}
.info.off{display:none!important}
.note{padding:12px 18px;font-size:10.5px;line-height:1.6;color:var(--ink-3);border-top:1px double var(--edge);font-style:italic}

@media(hover:none){#tip{display:none!important}}

@media(max-width:860px){
  #app{flex-direction:column}
  #stage{flex:none;height:44dvh;min-height:220px;width:100%}
  #panel{
    flex:1;width:100%;min-height:0;
    border-left:none;border-top:3px double var(--edge);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #panel header{padding:11px 16px 9px}
  #panel header h2{font-size:15px}
  #panel header p{display:none}

  #tools{top:auto;bottom:12px;right:10px;gap:8px}
  #tools button{width:44px;height:44px;font-size:19px}

  .filters{padding:10px 12px;gap:7px}
  .chip{padding:7px 11px;font-size:12.5px}
  .band{padding:15px 16px 5px}
  .site{padding:12px 16px}
  .site .nm{font-size:15px}
  .site .tw{font-size:11.5px}
  .site .el{font-size:12px}
  .info{padding:14px 16px 18px}
  .info .x{width:34px;height:34px;font-size:17px}
  .info p.desc{font-size:13.5px}
  #list{-webkit-overflow-scrolling:touch}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="tools">
      <button id="b-in" aria-label="Zoom in">+</button>
      <button id="b-out" aria-label="Zoom out">−</button>
      <button id="b-reset" aria-label="Reset">✦</button>
    </div>
    <div id="tip"><div class="n"></div><div class="m"></div></div>
  </div>

  <aside id="panel">
    <header>
      <h2>Connecticut Trails</h2>
      <p id="subhead">Statewide &mdash; by county</p>
    </header>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </aside>
</div>

const SITES = [{"n": "Ansonia Nature Center", "lat": 41.345, "lon": -73.0535, "c": "preserve", "b": "New Haven", "town": "Ansonia", "mi": 8.5, "min": 24, "d": "Well-marked trails, a pond, and a small nature center with live animals. Ranger-led hikes.", "p": "10 Deerfield Rd, ample lot. Closed Sundays, so the gate matters here."}, {"n": "BeaverBrook Trailhead", "lat": 41.2166, "lon": -73.0787, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.2, "min": 8, "d": "Flat one-mile loop with a marsh boardwalk. Good birding; some highway noise.", "p": "Small pull-off lot at the trail entrance off Naugatuck Ave. Room for 8–10 cars, almost never full."}, {"n": "Big Gulph", "lat": 41.362, "lon": -72.786, "c": "rwa", "town": "North Branford", "mi": 17.0, "min": 33, "d": "No reservoir here — mostly wide woods roads with side trails, deep quiet, and almost no one else. Good for long easy miles rather than scenery.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map, the trailhead is not obvious from the road.", "b": "New Haven"}, {"n": "Birchbank Mountain", "lat": 41.3553, "lon": -73.1453, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 10.3, "min": 30, "d": "Rugged Shelton open space climbing 250 feet from the rail line to a river bluff overlook. Some blowdowns across the trail.", "p": "Trailhead parking off Birchbank St / Dexter Dr — room for only a few cars. Map kiosk at the head."}, {"n": "Bluff Head", "lat": 41.408, "lon": -72.6965, "c": "hike", "town": "Guilford", "mi": 22.6, "min": 38, "d": "The best shoreline-region viewpoint — a steep traprock cliff on the Mattabesett Trail looking out over Meyerhuber Pond and miles of forest. Never crowded.", "p": "Small lots on Durham Rd (Route 77). Free. Trail is narrow along the cliff edge — keep dogs close.", "b": "New Haven"}, {"n": "Branford Supply Ponds", "lat": 41.3006, "lon": -72.805, "c": "hike", "town": "Branford", "mi": 14.1, "min": 23, "d": "A genuinely good trail complex around several scenic ponds, mostly wide and easy with a few climbs. One island is a bird sanctuary. Connects to Queach and Saltonstall Mountain for 800+ contiguous acres. Some blue-trail damage remains from the 2020 tornado.", "p": "Lot off Short Beach Rd. Free, no permit. Several roadside pull-offs if the lot is full. Can be muddy after rain.", "b": "New Haven"}, {"n": "Branford Trolley Trail", "lat": 41.2696, "lon": -72.7573, "c": "walk", "town": "Branford", "mi": 15.8, "min": 26, "d": "Flat, straight former trolley bed running out along tidal marsh to the Sound, with a red steel footbridge and a long concrete causeway. Easy enough for small children.", "p": "Parking at both ends of the trail. Free. Muddy in places after rain.", "b": "New Haven"}, {"n": "Case Pond / Larkin State Park Trail", "lat": 41.533, "lon": -73.147, "c": "walk", "town": "Middlebury", "mi": 21.9, "min": 43, "d": "Ten-mile linear trail on an old railbed running from Southbury to Naugatuck. Flat, wooded, popular with riders and cyclists.", "p": "Free lots off Route 188 and Whittemore Rd.", "b": "New Haven"}, {"n": "Coastal Center, Milford Point", "lat": 41.1759, "lon": -73.1016, "c": "preserve", "b": "New Haven", "town": "Milford", "mi": 4.0, "min": 13, "d": "CT Audubon sanctuary at the Housatonic mouth. Boardwalk to the Sound, observation tower, active osprey nest.", "p": "Small lot at 1 Milford Point Rd shared with Smith Point. Narrow residential road; caps out early on summer weekends. Closed Mondays."}, {"n": "East Rock Park", "lat": 41.3296, "lon": -72.9046, "c": "hike", "b": "New Haven", "town": "New Haven", "mi": 10.8, "min": 22, "d": "Steep stone steps to the summit monument. Best skyline view in the region — New Haven, the harbor, and the Sound.", "p": "Farnam Drive lot at the top is free but small, full by early afternoon on nice weekends. College Woods lot off Cold Spring St is bigger. Summit road closes seasonally."}, {"n": "Eisenhower Park", "lat": 41.2502, "lon": -73.0534, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.9, "min": 8, "d": "Town park with wooded trails and a story-book walk behind the playground and splash pad.", "p": "780 North St. Bear right — the left-hand lot is residents-only."}, {"n": "Elderslie Preserve", "lat": 41.38, "lon": -73.0333, "c": "hike", "b": "New Haven", "town": "Woodbridge", "mi": 10.9, "min": 26, "d": "Rock scrambles, vernal pools, and plank walks over marshland. Good beginner hike with real variety.", "p": "Gravel lot on Peck Hill Rd. Google and Waze overshoot the entrance by roughly 1,000 feet — watch for it early. QR trail map posted in the lot."}, {"n": "Farm River State Park", "lat": 41.2561, "lon": -72.8567, "c": "walk", "town": "East Haven", "mi": 10.6, "min": 22, "d": "One of the newest and least known state parks — 61 acres of bluffs and marsh where the Farm River meets the Sound. Short, easy, with osprey overhead.", "p": "Use the lot at 150 Short Beach Rd. Parking is limited and the Mansfield Grove Rd approach dead-ends into private property — do not follow GPS there.", "b": "New Haven"}, {"n": "Farmington Canal Heritage Trail", "lat": 41.3237, "lon": -72.9306, "c": "walk", "town": "Hamden", "mi": 9.6, "min": 22, "d": "Paved rail trail running from New Haven north toward Massachusetts, flat and shaded with historic canal locks along the way.", "p": "Free lots in Hamden, Cheshire and Southington. Lock 12 is the best starting point.", "b": "New Haven"}, {"n": "Genesee", "lat": 41.352, "lon": -72.628, "c": "rwa", "town": "Madison", "mi": 23.9, "min": 42, "d": "Nearly twelve miles of woods roads and side trails with some 19th-century quarry history along the way. Biking allowed April 15 to December 31.", "p": "Gated entrance on Durham Rd (Route 79) south of County Road. Permit and code required. No dogs. Location on this map is approximate — confirm on the RWA map.", "b": "New Haven"}, {"n": "Gristmill Open Space", "lat": 41.2787, "lon": -73.133, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 5.5, "min": 18, "d": "Quiet riverside walk along the Far Mill River, which is stocked with trout.", "p": "Small lot at 54 Mill St."}, {"n": "Hubbard Park & Castle Craig", "lat": 41.5615, "lon": -72.829, "c": "hike", "town": "Meriden", "mi": 26.2, "min": 51, "d": "Steep Metacomet Trail climbing to a stone tower on East Peak with the widest view in central Connecticut. Drivable in season.", "p": "Roadside parking on Peak Dr, or the large free Hubbard Park lot below.", "b": "New Haven"}, {"n": "Indian Well State Park", "lat": 41.3389, "lon": -73.1232, "c": "hike", "b": "New Haven", "town": "Shelton", "mi": 8.7, "min": 24, "d": "Waterfall five minutes from the car, plus blue/white trails climbing to a Housatonic overlook. No swimming.", "p": "Two options: the small roadside lot right at the falls (fills fast) or the main lot at 1 Indian Well Rd by the river. Free with CT plates."}, {"n": "Jared Eliot Preserve", "lat": 41.271, "lon": -72.6845, "c": "preserve", "b": "New Haven", "town": "Guilford", "mi": 19.6, "min": 30, "d": "Guilford Land Trust parcel with a small trail system and a standout marsh view. Primitive camping sites.", "p": "Roadside only, off Mulberry Farms Rd."}, {"n": "Lake Bethany", "lat": 41.4198, "lon": -72.9647, "c": "rwa", "town": "Bethany", "mi": 14.4, "min": 32, "d": "A wide loop road around a pretty reservoir with brief water views. Plainer than Chamberlain, but quiet and easy walking.", "p": "Gated RWA lot; permit and code required.", "b": "New Haven"}, {"n": "Lake Chamberlain", "lat": 41.3992, "lon": -72.9881, "c": "rwa", "town": "Bethany", "mi": 12.7, "min": 28, "d": "About 7.5 miles of trail, with a wide woods road circling the reservoir — roughly two miles a lap, stroller-friendly. Horses are permitted, so expect to share.", "p": "Gated RWA lot; permit and gate code required. Do not let GPS route you via Sperry Road — it is a mile of narrow dirt and gated in winter. No dogs.", "b": "New Haven"}, {"n": "Lake Gaillard", "lat": 41.3445, "lon": -72.7777, "c": "rwa", "town": "North Branford", "mi": 16.7, "min": 32, "d": "The largest RWA reservoir, ringed by a 6.7-mile perimeter road. Access is the most restricted of the properties — much of it opens only for permit holders on posted days and for the annual walkathon.", "p": "Gated; RWA permit required and access is limited. Check current rules with the RWA before driving out.", "b": "New Haven"}, {"n": "Lake Saltonstall", "lat": 41.2973, "lon": -72.8375, "c": "rwa", "town": "Branford", "mi": 12.5, "min": 24, "d": "Nine miles of trails around a stocked traprock lake, plus a 1.5-mile interpretive nature trail. Biking allowed; boat rental and a wheelchair-accessible fishing pier in season.", "p": "Two gated entrances off Hosley Ave. RWA permit required. No dogs, no swimming.", "b": "New Haven"}, {"n": "Lake Wintergreen", "lat": 41.3599, "lon": -72.9646, "c": "hike", "b": "New Haven", "town": "Hamden", "mi": 10.6, "min": 26, "d": "1.5-mile lake loop (white to red/white), rocky and rooty through the middle third. Connects up to the West Rock cave and overlook.", "p": "Lot off Main St in Hamden. Trickiest on the list — GPS routes people onto a private road nearby, and the lot is tiny and full by mid-morning weekends. Go early."}, {"n": "Larkin Bridle Trail", "lat": 41.493, "lon": -73.137, "c": "walk", "town": "Oxford", "mi": 19.1, "min": 38, "d": "Wide flat former railbed running ten miles through woods and past ponds, shared with horses and bikes.", "p": "Free lots off Route 188. Limited spaces.", "b": "New Haven"}, {"n": "Long Wharf Nature Preserve", "lat": 41.2852, "lon": -72.9258, "c": "walk", "town": "New Haven", "mi": 8.0, "min": 20, "d": "Short shoreline loop on New Haven Harbor with thousands of fiddler crabs in the mud. Urban and a bit rough around the edges.", "p": "Free roadside parking along Long Wharf Dr.", "b": "New Haven"}, {"n": "Maltby Lakes", "lat": 41.3079, "lon": -72.9844, "c": "rwa", "town": "West Haven", "mi": 7.0, "min": 16, "d": "Three linked reservoirs with rolling trails and lake views minutes from New Haven. The Mark Schaefer Trail rings the property; a power-line clearing on the west ridge opens a view of the city skyline. Mountain biking allowed.", "p": "Small gated lot off Derby Turnpike (Route 34). RWA permit required — you get a gate code with it. Closed Saturdays.", "b": "New Haven"}, {"n": "Millers Pond State Park", "lat": 41.4758, "lon": -72.632, "c": "hike", "town": "Durham", "mi": 28.1, "min": 54, "d": "White and blue trails ring a deep clear pond in a 1.5-mile loop, easy at the start and steep and rocky on the far side. Real swimming, no lifeguards.", "p": "Large free lot at 344 Foot Hills Rd with accessible spaces.", "b": "New Haven"}, {"n": "Nancy's Meadow", "lat": 41.182, "lon": -73.098, "c": "preserve", "b": "New Haven", "town": "Milford", "mi": 3.5, "min": 12, "d": "Small Milford Land Trust parcel with a short path. Punches above its weight for birding and botany.", "p": "No lot — street parking on 1st Ave, short walk in."}, {"n": "Naugatuck River Greenway", "lat": 41.49, "lon": -73.048, "c": "walk", "town": "Naugatuck", "mi": 18.5, "min": 37, "d": "Paved riverside path through the old mill towns of the Naugatuck Valley, expanding section by section.", "p": "Free lots in Naugatuck, Beacon Falls and Derby.", "b": "New Haven"}, {"n": "Naugatuck State Forest", "lat": 41.4545, "lon": -73.0808, "c": "hike", "town": "Beacon Falls", "mi": 16.1, "min": 33, "d": "Gorge trail along Spruce Brook with a run of waterfalls and overlooks. Hunting permitted — wear orange in season.", "p": "Spruce Brook lot off Cold Springs Rd. Approach from the Naugatuck side; the Beacon Falls road is badly rutted.", "b": "New Haven"}, {"n": "Osbornedale State Park", "lat": 41.3397, "lon": -73.1, "c": "hike", "b": "New Haven", "town": "Derby", "mi": 8.4, "min": 22, "d": "Pond, open fields, and shaded trails full of glacial erratics. Some sections overgrown — check for ticks.", "p": "43 Chatfield St. Best parking on this list: big paved lot, restrooms, right by the pond."}, {"n": "Peter's Rock Park", "lat": 41.3406, "lon": -72.8545, "c": "hike", "town": "North Haven", "mi": 13.3, "min": 25, "d": "Short steep climb to a traprock summit with a genuinely big view. About 300 acres, dog friendly, with a story trail for kids.", "p": "Lot at 133 Middletown Ave. Free. Trails beyond the red blaze are poorly marked with many unmapped side paths — bring a map.", "b": "New Haven"}, {"n": "Pine Hill Trails", "lat": 41.386, "lon": -73.026, "c": "rwa", "town": "Seymour", "mi": 11.4, "min": 29, "d": "One of the smaller RWA holdings but among the more interesting underfoot, straddling the Seymour–Woodbridge line. Appeals mostly to people nearby.", "p": "Gated RWA entrance; permit and code required. Confirm the gate location on the RWA map before going.", "b": "New Haven"}, {"n": "Pine Lake", "lat": 41.3191, "lon": -73.1093, "c": "open", "b": "New Haven", "town": "Shelton", "mi": 7.2, "min": 22, "d": "Gateway to Shelton’s open-space trail network. Flat, pine-shaded, bike and dog friendly.", "p": "130 Shelton Ave. Limited spaces plus a few pull-offs along the trail. No restrooms."}, {"n": "Quinnipiac River State Park", "lat": 41.436, "lon": -72.862, "c": "walk", "town": "North Haven", "mi": 17.8, "min": 36, "d": "Undeveloped riverside park with flat trails through floodplain forest and marsh. Good birding, few people.", "p": "Roadside parking on Banton St. Free.", "b": "New Haven"}, {"n": "River Highlands State Park", "lat": 41.6194, "lon": -72.6314, "c": "hike", "town": "Cromwell", "mi": 35.1, "min": 66, "d": "Bluff-top views over the Connecticut River and short trails you can combine into a longer walk. Rarely crowded.", "p": "Free lot at 113 Field Rd.", "b": "New Haven"}, {"n": "Roaring Brook Falls", "lat": 41.4818, "lon": -72.9349, "c": "hike", "b": "New Haven", "town": "Cheshire", "mi": 19.0, "min": 38, "d": "Tallest single-drop waterfall in Connecticut. The red trail climbs steeply on loose gravel; best views in early spring or late fall.", "p": "Access via Roaring Brook Park, 857 Roaring Brook Rd, at the end of a small dead-end street. Tight — a handful of cars."}, {"n": "Rockland Preserve", "lat": 41.4244, "lon": -72.6516, "c": "open", "town": "Madison", "mi": 25.2, "min": 44, "d": "700 acres best known for the best mountain-bike singletrack on the shoreline, but good hiking too. Trail junctions are poorly signed — bring a downloaded map.", "p": "Lot on Durham Rd (Route 79), with a skills area by the entrance. Free.", "b": "New Haven"}, {"n": "Roosevelt Forest", "lat": 41.252, "lon": -73.1278, "c": "hike", "b": "New Haven", "town": "Stratford", "mi": 4.2, "min": 15, "d": "2.6-mile loop, well blazed and maintained, with intersecting trails to shorten or extend. Rarely crowded.", "p": "700 Peters Ln — free, spacious, paved. AllTrails sends people to the wrong trailhead. Posted Stratford-residents-only, loosely enforced off-season."}, {"n": "Saltonstall Mountain Preserve", "lat": 41.3215, "lon": -72.8065, "c": "hike", "town": "Branford", "mi": 14.6, "min": 25, "d": "Steep traprock ridge straddling the Branford–North Branford line, with some of the highest points in Branford. Wide ridge trails now connect through to Supply Pond and Queach.", "p": "The weak point: Google Maps sends you to a residential dead end and there is no real lot. Park at Supply Ponds or the Laurel Hill Rd access and walk in. Trail colors changed in 2019 — get a current map.", "b": "New Haven"}, {"n": "Silver Sands State Park", "lat": 41.2004, "lon": -73.0677, "c": "walk", "b": "New Haven", "town": "Milford", "mi": 1.6, "min": 10, "d": "Boardwalk along the beach with a sandbar out to Charles Island at low tide. Flat, wide, open year-round.", "p": "Main lot, 1 Silver Sands Pkwy. Paved and large; free with CT plates (~$22 out-of-state in season). Long boardwalk walk from lot to sand."}, {"n": "Sleeping Giant State Park", "lat": 41.421, "lon": -72.8992, "c": "hike", "town": "Hamden", "mi": 15.9, "min": 33, "d": "The marquee hike in the region. Tower Trail is an easy-moderate gravel climb to a stone tower; the blue traverse is a full day.", "p": "Main lot at 200 Mt Carmel Ave — paid, free with CT plates. East lot on Chestnut Ln is quieter.", "b": "New Haven"}, {"n": "Solomon Woods", "lat": 41.2497, "lon": -73.0622, "c": "hike", "b": "New Haven", "town": "Milford", "mi": 1.9, "min": 9, "d": "The best trails inside Milford. Stone ruins, streams, real elevation change, and it drains well after rain.", "p": "Dedicated lot at 811 W River St, right across from the trailhead. Small, but rarely more than a few cars."}, {"n": "Southford Falls State Park", "lat": 41.4589, "lon": -73.1647, "c": "hike", "b": "New Haven", "town": "Southbury", "mi": 17.2, "min": 40, "d": "Covered bridge and a run of cascades right off the parking area. Boardwalk section is in rough shape.", "p": "175 Quaker Farms Rd. Dirt lot on the side of the road with no marked spots; the falls are a few steps away."}, {"n": "Sperry Falls", "lat": 41.3836, "lon": -72.9881, "c": "rwa", "b": "New Haven", "town": "Woodbridge", "mi": 11.7, "min": 30, "d": "Half-mile walk in along a rocky road to a cold, deep falls pool. Quiet even on weekends.", "p": "Park near the beginning of the dirt road, not the end — people are ticketed at the far end around dusk. RWA recreation permit required to leave the main road."}, {"n": "Stratford Greenway", "lat": 41.1742, "lon": -73.1289, "c": "walk", "b": "New Haven", "town": "Stratford", "mi": 5.0, "min": 14, "d": "Short paved waterfront path with benches over the water. Quiet, good for a quick lap.", "p": "Lot at 609 Main St by the waterfront."}, {"n": "Wadsworth Big Falls", "lat": 41.533, "lon": -72.698, "c": "walk", "town": "Middletown", "mi": 28.4, "min": 54, "d": "The main falls at Wadsworth reached by a short flat path from a separate lot — the quickest waterfall payoff in central Connecticut.", "p": "Small free lot on Cherry Hill Rd, separate from the main park entrance.", "b": "New Haven"}, {"n": "Wadsworth Falls State Park", "lat": 41.5369, "lon": -72.686, "c": "hike", "town": "Middletown", "mi": 29.0, "min": 55, "d": "Big Falls on the main orange trail, plus a smaller cascade on a side path. About 6.5 miles of trail total.", "p": "Large free lot at 721 Wadsworth St. Restrooms. Trail markings thin where colors split.", "b": "New Haven"}, {"n": "Webb Mountain Park", "lat": 41.373, "lon": -73.1666, "c": "hike", "b": "New Haven", "town": "Monroe", "mi": 11.8, "min": 33, "d": "Easy climb to a Housatonic River overlook, plus ten primitive campsites. Links to the blue Paugussett Trail all the way to Indian Well.", "p": "Free lot off Old Fish House Rd. Limited spaces, but the park is quiet enough that it rarely matters."}, {"n": "West River Greenway", "lat": 41.3623, "lon": -72.9827, "c": "rwa", "b": "New Haven", "town": "Woodbridge", "mi": 10.4, "min": 28, "d": "Red/blue loop is flat and shaded along the stream. Head to the back of the preserve to escape Route 69 noise.", "p": "Roadside lot off Litchfield Turnpike; the Darling House museum lot is an easier alternative."}, {"n": "West Rock Ridge State Park", "lat": 41.3446, "lon": -72.9662, "c": "hike", "b": "New Haven", "town": "New Haven", "mi": 9.6, "min": 23, "d": "Basalt ridge trail past Judges Cave to a long clifftop overlook. Green trail to the summit is the classic.", "p": "1134 Wintergreen Ave. Gates close for winter; parking outside and walking in is normal."}, {"n": "West Sugarloaf", "lat": 41.3745, "lon": -72.7348, "c": "rwa", "town": "Guilford", "mi": 19.7, "min": 35, "d": "Mostly footpaths rather than woods roads, which makes it the most trail-like of the RWA properties. The White Owl Trail is an easy four-mile loop — expect briars along the edges.", "p": "Gated RWA lot with a well-kept porta-john, unusually. Permit and code required.", "b": "New Haven"}, {"n": "Westwoods", "lat": 41.2695, "lon": -72.6957, "c": "hike", "town": "Guilford", "mi": 19.0, "min": 30, "d": "One of the great trail networks on the shoreline — 40 miles of trail through boulder fields, rock walls, swamp crossings and tidal marsh. So many options that it never feels crowded.", "p": "Sam Hill Rd entrance has roadside parking for 5–6 cars; larger lots at Peddlers Rd and Denison Dr. Free. Dog friendly.", "b": "New Haven"}, {"n": "Wharton Brook State Park", "lat": 41.4251, "lon": -72.8376, "c": "walk", "town": "North Haven", "mi": 18.0, "min": 32, "d": "Small, old-fashioned state park with a stocked pond, a covered bridge, picnic groves and easy walking. More a picnic spot than a hike.", "p": "Lot off US-5. Free with CT plates. Restrooms and porta-johns on site.", "b": "New Haven"}, {"n": "Aspetuck Land Trust Haskins Preserve", "lat": 41.131, "lon": -73.3546, "c": "open", "town": "Westport", "mi": 16.7, "min": 34, "d": "Sixteen acres of streams, a small pond and picnic tables. A quick quiet walk rather than a hike.", "p": "Small roadside parking at 22 Green Acre Ln. Free.", "b": "Fairfield"}, {"n": "Bear Mountain Reservation", "lat": 41.4464, "lon": -73.467, "c": "hike", "town": "Danbury", "mi": 26.3, "min": 51, "d": "Well-marked town preserve with trails descending to the water and exercise stations along the way.", "p": "Paved free lot for about 30 cars.", "b": "Fairfield"}, {"n": "Collis P. Huntington State Park", "lat": 41.332, "lon": -73.3593, "c": "hike", "town": "Redding", "mi": 17.4, "min": 36, "d": "Nine hundred acres of wide dirt roads, ponds and brooks, with bronze animal sculptures at the gate. Flat and forgiving.", "p": "Large free lot at 9 Dodgingtown Rd.", "b": "Fairfield"}, {"n": "Devil's Den Preserve", "lat": 41.2372, "lon": -73.396, "c": "preserve", "town": "Weston", "mi": 17.6, "min": 36, "d": "Connecticut's largest Nature Conservancy holding — 1,750 acres, 20 miles of well-kept trail, and Godfrey Pond with sawmill ruins.", "p": "Lot at 33 Pent Rd with a touch-screen map. Free but small, no overflow. Arrive early.", "b": "Fairfield"}, {"n": "Greenwich Audubon Center", "lat": 41.097, "lon": -73.6879, "c": "preserve", "town": "Greenwich", "mi": 33.8, "min": 63, "d": "Beginner-friendly trails around a lake and open meadow, with an interpretive building. No dogs.", "p": "Free lot at 613 Riversville Rd. Center closed Monday through Wednesday.", "b": "Fairfield"}, {"n": "Hemlock Hills", "lat": 41.3502, "lon": -73.5049, "c": "hike", "town": "Ridgefield", "mi": 24.8, "min": 48, "d": "Big glacial boulders, technical rock gardens and a lookout at the Charles Ives cabin site. A maze of trails — bring a map.", "p": "Roadside parking off Route 7. Free. Poison ivy is heavy.", "b": "Fairfield"}, {"n": "Indian Ledge Park", "lat": 41.2792, "lon": -73.2185, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 9.3, "min": 24, "d": "Trails and river access with a large playground and splash pad. Popular for easy mountain biking.", "p": "Small lot off Indian Ledge Park Rd. Trumbull resident sticker required; enforcement is active."}, {"n": "Kettletown State Park", "lat": 41.4272, "lon": -73.2042, "c": "hike", "b": "Fairfield", "town": "Southbury", "mi": 16.1, "min": 38, "d": "Brook trail is the scenic pick; blue/white runs longer. Lakeside camping on Lake Zoar.", "p": "Paved lot at 1400 Georges Hill Rd. Plenty of space, free with CT plates."}, {"n": "Larsen Wildlife Sanctuary", "lat": 41.2023, "lon": -73.2936, "c": "preserve", "b": "Fairfield", "town": "Fairfield", "mi": 12.4, "min": 27, "d": "160+ acres of flat trails and boardwalks through ponds and marsh. Stroller and wheelchair friendly. No dogs.", "p": "Shared lot at 2325 Burr St with the CT Audubon center. Easy and free; small donation suggested."}, {"n": "Mianus River Park", "lat": 41.0819, "lon": -73.5829, "c": "hike", "town": "Stamford", "mi": 28.9, "min": 55, "d": "Many intersecting trails along a rocky river, with a nature-trail section closed to dogs and bikes.", "p": "Free lots on both the Stamford and Greenwich sides. Stamford lots are small.", "b": "Fairfield"}, {"n": "Old Mine Park", "lat": 41.2883, "lon": -73.2266, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 9.9, "min": 25, "d": "Historic mineral-mine site on the rail trail, with a gazebo and water. Good lunch stop.", "p": "121 Old Mine Rd. Has a porta-john. Trumbull resident sticker required."}, {"n": "Paugussett State Forest", "lat": 41.4132, "lon": -73.2068, "c": "hike", "town": "Newtown", "mi": 15.3, "min": 35, "d": "Rugged and varied, with a waterfall and Housatonic river frontage. The blue-blazed Paugussett Trail runs through; most blue trails are closed to bikes.", "p": "Lot off Echo Valley Rd. Free. Gets loud and busy down by the water on summer weekends.", "b": "Fairfield"}, {"n": "Pequonnock Valley WMA", "lat": 41.2476, "lon": -73.2006, "c": "walk", "b": "Fairfield", "town": "Trumbull", "mi": 7.7, "min": 22, "d": "Paved rail trail on one bank, technical singletrack on the other. Runs all the way to Indian Well.", "p": "Tait Road lot. Modest size — people get ticketed for street parking near the trail start, so use the lot. Old Mine Park is the better north-end option."}, {"n": "Pine Mountain", "lat": 41.3527, "lon": -73.5015, "c": "hike", "town": "Ridgefield", "mi": 24.7, "min": 48, "d": "Difficult but short climb to open ledges. Cell service is poor — photograph the map at the trailhead.", "p": "Limited roadside parking. Free, no restrooms.", "b": "Fairfield"}, {"n": "Putnam Memorial State Park", "lat": 41.376, "lon": -73.411, "c": "walk", "town": "Redding", "mi": 21.2, "min": 42, "d": "Connecticut's oldest state park, preserving a Revolutionary War winter encampment with easy paths among the hut sites.", "p": "Free lot off Route 58. Museum seasonal.", "b": "Fairfield"}, {"n": "Sherwood Island State Park", "lat": 41.1155, "lon": -73.3331, "c": "walk", "town": "Westport", "mi": 16.1, "min": 33, "d": "Three-mile loop from woods out to a beach promenade, with a 9/11 memorial and wide Sound views.", "p": "Large paved lots, free with CT plates.", "b": "Fairfield"}, {"n": "Tarrywile Park", "lat": 41.382, "lon": -73.456, "c": "hike", "town": "Danbury", "mi": 23.4, "min": 46, "d": "Seven hundred acres and 21 miles of trail around a mansion, ponds and open hills. The largest municipal park in the region.", "p": "Free lot at 70 Southern Blvd. Occasionally closed for weddings.", "b": "Fairfield"}, {"n": "Trout Brook Valley", "lat": 41.2455, "lon": -73.3426, "c": "open", "town": "Weston", "mi": 14.9, "min": 31, "d": "A thousand acres of Aspetuck Land Trust woods, an orchard, and long loops. Blazes don't always match the map.", "p": "Several small lots; Bradley Rd is the main one. Free.", "b": "Fairfield"}, {"n": "Weir Farm National Historical Park", "lat": 41.2576, "lon": -73.456, "c": "walk", "town": "Wilton", "mi": 20.8, "min": 41, "d": "The only national park in Connecticut — an American Impressionist's home and studio, with easy trails to Weir Pond and borrowable art supplies.", "p": "Free lot at 735 Nod Hill Rd. Grounds open sunrise to sunset; buildings closed Nov–Apr and Mon–Tue.", "b": "Fairfield"}, {"n": "Wooster Mountain State Park", "lat": 41.348, "lon": -73.462, "c": "hike", "town": "Danbury", "mi": 22.7, "min": 45, "d": "Steep climb on the Ives Trail with rocky ledges. A shooting range across Route 7 is audible on weekends.", "p": "Free lot off Route 7; easy to drive past.", "b": "Fairfield"}, {"n": "Above All State Park", "lat": 41.664, "lon": -73.437, "c": "walk", "town": "Warren", "mi": 36.3, "min": 68, "d": "One of the highest points in the region with a wide view east over the Litchfield Hills. Minimal trails — it's about the vista.", "p": "Roadside parking. Free, undeveloped.", "b": "Litchfield"}, {"n": "Bear Mountain", "lat": 41.9464, "lon": -73.4926, "c": "hike", "town": "Salisbury", "mi": 54.8, "min": 99, "d": "Connecticut's highest peak at 2,316 feet, climbed via the Appalachian Trail to a stone monument on the summit with views into three states.", "p": "Undermountain Trail lot on Route 41, about 3.5 miles north of Salisbury. Free, fills early on fall weekends.", "b": "Litchfield"}, {"n": "Bent of the River Audubon", "lat": 41.4724, "lon": -73.258, "c": "preserve", "town": "Southbury", "mi": 20.2, "min": 42, "d": "700 acres of meadow and woodland along the Pomperaug River, and one of the better birding spots in the region. Trails are unblazed — take the free map at the kiosk.", "p": "Free lot at 185 E Flat Hill Rd. No visitor center, no dogs. Picnic tables along the trails.", "b": "Litchfield"}, {"n": "Campbell Falls State Park", "lat": 42.0412, "lon": -73.227, "c": "hike", "town": "Norfolk", "mi": 57.2, "min": 103, "d": "A short walk to a 100-foot falls dropping through a rocky gorge on the Massachusetts line. Muddy in spring.", "p": "Small lot off Campbell Falls Rd. Free, no restrooms.", "b": "Litchfield"}, {"n": "Dennis Hill State Park", "lat": 41.972, "lon": -73.202, "c": "walk", "town": "Norfolk", "mi": 52.3, "min": 95, "d": "Drive or walk to a stone summit pavilion at 1,627 feet with views to Haystack and the Berkshires. Very little effort for a big view.", "p": "Free lot partway up; summit road seasonal.", "b": "Litchfield"}, {"n": "Flanders Nature Center", "lat": 41.6001, "lon": -73.2069, "c": "preserve", "town": "Woodbury", "mi": 27.2, "min": 52, "d": "Land trust property with a sugarhouse, easy loops, and a boggy section. Good for families.", "p": "Free lot at 5 Church Hill Rd. Office closed weekends but trails stay open.", "b": "Litchfield"}, {"n": "Haystack Mountain State Park", "lat": 42.006, "lon": -73.2118, "c": "hike", "town": "Norfolk", "mi": 54.7, "min": 99, "d": "Short but steep 1.2-mile climb to a 34-foot stone tower with a full 360-degree view into Massachusetts and New York.", "p": "Small free lot off Route 272. Restroom at the base. Gate closes early — arrive in good time.", "b": "Litchfield"}, {"n": "Hidden Valley Preserve", "lat": 41.6565, "lon": -73.3181, "c": "preserve", "town": "Washington", "mi": 32.9, "min": 62, "d": "Thoreau suspension bridge, an old mine, and a well-groomed trail network beside the Shepaug. Mostly gentle walking.", "p": "Main lot at 120 Bee Brook Rd. Free. Photograph the trail map at the kiosk — junctions are unsigned.", "b": "Litchfield"}, {"n": "Housatonic Meadows State Park", "lat": 41.8397, "lon": -73.3812, "c": "hike", "town": "Sharon", "mi": 45.8, "min": 84, "d": "Riverside camping and fly-fishing water along the Housatonic, with the Pine Knob Loop climbing off the Appalachian Trail nearby.", "p": "Roadside lot on US-7. Free. Route 7 traffic noise carries into the campground.", "b": "Litchfield"}, {"n": "Kent Falls State Park", "lat": 41.7763, "lon": -73.4179, "c": "hike", "town": "Kent", "mi": 42.6, "min": 78, "d": "A 250-foot cascade dropping in a series of falls, with a stone staircase climbing alongside to the top. Short but steep.", "p": "Large lot at 462 Kent Cornwall Rd. Free with CT plates, fee for out-of-state on weekends. Restrooms on site.", "b": "Litchfield"}, {"n": "Lake Waramaug State Park", "lat": 41.718, "lon": -73.38, "c": "walk", "town": "Kent", "mi": 38.1, "min": 71, "d": "Small shoreline park on one of the prettiest lakes in the state, with camping and flat lakeside walking.", "p": "Free with CT plates. Restrooms in season.", "b": "Litchfield"}, {"n": "Lovers Leap State Park", "lat": 41.543, "lon": -73.4087, "c": "hike", "town": "New Milford", "mi": 28.7, "min": 55, "d": "Iron bridge over the Housatonic, ruins, and overlooks above Lake Lillinonah. Compact but scenic.", "p": "Lot at 178 Short Woods Rd. Free, open 8am to sunset.", "b": "Litchfield"}, {"n": "Macedonia Brook State Park", "lat": 41.766, "lon": -73.493, "c": "hike", "town": "Kent", "mi": 43.8, "min": 80, "d": "Blue trail over Cobble Mountain gives one of the most demanding ridge walks in western Connecticut, with Catskill views.", "p": "Lot inside the park off Macedonia Brook Rd. Free with CT plates.", "b": "Litchfield"}, {"n": "Mohawk Mountain State Park", "lat": 41.8441, "lon": -73.2899, "c": "hike", "town": "Cornwall", "mi": 44.6, "min": 82, "d": "Summit road and trails to a lookout tower with one of the widest views in the state. Ski area in winter.", "p": "Drive the long summit road to lots near the tower. Free. Picnic areas all along the way up.", "b": "Litchfield"}, {"n": "Mount Tom State Park", "lat": 41.6953, "lon": -73.2779, "c": "hike", "town": "Washington", "mi": 34.6, "min": 65, "d": "Yellow trail climbs to a stone lookout tower above a small spring-fed pond. Swimming beach at the base.", "p": "Lot at Mount Tom Rd. Free with CT plates. Clean restrooms near the beach.", "b": "Litchfield"}, {"n": "Pine Knob Loop", "lat": 41.8332, "lon": -73.3836, "c": "hike", "town": "Sharon", "mi": 45.4, "min": 83, "d": "A 2.5-mile loop off the Appalachian Trail with steep rocky sections and a fine overlook of the Housatonic Valley. Go counter-clockwise.", "p": "Trailhead lot on US-7. Free, limited spaces, restrooms about a mile away at Housatonic Meadows.", "b": "Litchfield"}, {"n": "Pootatuck State Forest", "lat": 41.5113, "lon": -73.4902, "c": "hike", "town": "New Fairfield", "mi": 30.0, "min": 57, "d": "Climbs to overlooks above Candlewood Lake and Squantz Pond. Tough but rewarding; some junctions unmarked.", "p": "Park at Squantz Pond State Park; half the lot closes off-season. Fee in season.", "b": "Litchfield"}, {"n": "Squantz Pond State Park", "lat": 41.578, "lon": -73.483, "c": "walk", "town": "New Fairfield", "mi": 33.0, "min": 62, "d": "Swimming, boating and a shoreline trail beneath steep wooded slopes. Very busy in summer.", "p": "Paid lot; fills and closes by mid-morning on hot weekends.", "b": "Litchfield"}, {"n": "Steep Rock Preserve", "lat": 41.6208, "lon": -73.3232, "c": "preserve", "town": "Washington", "mi": 30.8, "min": 58, "d": "Old railroad tunnel, a swinging suspension bridge, and the Shepaug River looping below. The yellow trail to the tunnel is nearly flat.", "p": "Gravel lot at 2 Tunnel Rd, reached by a narrow one-lane road. Free.", "b": "Litchfield"}, {"n": "Sunny Valley / Iron Mountain", "lat": 41.575, "lon": -73.409, "c": "open", "town": "New Milford", "mi": 30.4, "min": 58, "d": "Nature Conservancy ridge with open farmland below and a climb to long views over the Housatonic Valley.", "p": "Small roadside lots. Free.", "b": "Litchfield"}, {"n": "Sunny Valley Preserve", "lat": 41.562, "lon": -73.421, "c": "preserve", "town": "New Milford", "mi": 30.1, "min": 57, "d": "Nature Conservancy farmland and woods with quiet loop trails and long views over the Housatonic Valley.", "p": "Small roadside lots off Long Mountain Rd. Free.", "b": "Litchfield"}, {"n": "Sweetcake Mountain", "lat": 41.4654, "lon": -73.4634, "c": "hike", "town": "New Fairfield", "mi": 26.9, "min": 52, "d": "Steep climb to a rocky overlook above Candlewood Lake. Blazes are faded — navigate carefully.", "p": "Roadside parking on Wood Creek Rd. Free, very limited.", "b": "Litchfield"}, {"n": "Twin Brooks Park", "lat": 41.2428, "lon": -73.1864, "c": "walk", "b": "Litchfield", "town": "Trumbull", "mi": 6.9, "min": 21, "d": "2.5-mile pond loop on paved paths. Farmers market on Thursdays.", "p": "Trumbull resident sticker required, front and back. Non-residents get $25 tickets and the signage is small."}, {"n": "White Memorial Conservation Center", "lat": 41.716, "lon": -73.214, "c": "preserve", "town": "Litchfield", "mi": 35.0, "min": 66, "d": "Four thousand acres and 35 miles of trail around Bantam Lake, including a boardwalk through swamp. The largest nature center in the state.", "p": "Free lots at the museum on Whitehall Rd and at several trailheads.", "b": "Litchfield"}, {"n": "American Legion State Forest", "lat": 41.918, "lon": -73.011, "c": "hike", "town": "Barkhamsted", "mi": 48.0, "min": 88, "d": "Across the Farmington River from People's Forest, with riverside camping, fly-fishing water and the Henry Buck Trail past old mill ruins.", "p": "Free lot off West River Rd. Campground fee in season.", "b": "Hartford"}, {"n": "Black Rock State Park", "lat": 41.6546, "lon": -73.1069, "c": "hike", "town": "Watertown", "mi": 29.9, "min": 57, "d": "Pond loop plus climbs onto the Mattatuck Trail, with campsites and a swimming beach.", "p": "Lot at 2065 Thomaston Rd. Free with CT plates.", "b": "Hartford"}, {"n": "Bull Pond Preserve", "lat": 41.7638, "lon": -73.047, "c": "open", "town": "Harwinton", "mi": 37.4, "min": 70, "d": "Seventy acres of forest, marsh and pond with wide easy paths and an observation platform.", "p": "Small paved lot on Locust Rd across from the fairgrounds — easy to miss, fits 3-4 cars.", "b": "Hartford"}, {"n": "Burr Pond State Park", "lat": 41.8705, "lon": -73.0925, "c": "walk", "town": "Torrington", "mi": 44.8, "min": 82, "d": "Easy 2.5-mile loop around a clean pond with a swimming beach, on the site of the world's first condensed-milk factory.", "p": "Lot at 385 Burr Mountain Rd. Free with CT plates, $15 out-of-state. Restrooms; fills fast in summer.", "b": "Hartford"}, {"n": "Dinosaur State Park", "lat": 41.6519, "lon": -72.6569, "c": "walk", "town": "Rocky Hill", "mi": 36.1, "min": 67, "d": "Five hundred Jurassic trackways under a geodesic dome, plus two miles of easy trails through an arboretum and swamp.", "p": "Large free lot at 400 West St. Exhibit fee charged; closed Mondays.", "b": "Hartford"}, {"n": "Enders State Forest", "lat": 41.9551, "lon": -72.8788, "c": "hike", "town": "Granby", "mi": 51.4, "min": 93, "d": "A chain of five waterfalls along Enders Brook, reached by a short trail with granite staircases and railings.", "p": "Roadside lots on Route 219. Free. Descents to the falls are steep.", "b": "Hartford"}, {"n": "Mattatuck State Forest", "lat": 41.6449, "lon": -73.0907, "c": "hike", "town": "Thomaston", "mi": 29.2, "min": 56, "d": "Blue-blazed Mattatuck Trail to Leatherman's Cave and the Black Rock overlook. Steep and rocky in places, and illegal ATV use has torn up sections.", "p": "Roadside parking on US-6. Free.", "b": "Hartford"}, {"n": "McLean Game Refuge", "lat": 41.9405, "lon": -72.7937, "c": "preserve", "town": "Granby", "mi": 51.4, "min": 93, "d": "Forty-four hundred acres left to the public by a former governor, with 20 miles of trail, well-signed junctions and a summit climb up the Barndoor Hills.", "p": "Free lots at 109 Salmon Brook St and the Barndoor Hills entrance on Barndoor Hills Rd. Leashed dogs allowed on most trails.", "b": "Hartford"}, {"n": "Metacomet Trail at Newgate", "lat": 41.9472, "lon": -72.7399, "c": "hike", "town": "East Granby", "mi": 52.6, "min": 95, "d": "Out-and-back ridge hiking with scenic overlooks; go as far as you like along the New England Trail.", "p": "Roadside parking on Newgate Rd. Free and limited — arrive early.", "b": "Hartford"}, {"n": "Nepaug State Forest", "lat": 41.81, "lon": -72.93, "c": "hike", "town": "New Hartford", "mi": 41.1, "min": 76, "d": "Quiet forest with the Tunxis Trail running through, plus ledges above the reservoir. Lightly visited.", "p": "Roadside parking on Route 202. Free.", "b": "Hartford"}, {"n": "Northwest Park", "lat": 41.894, "lon": -72.644, "c": "preserve", "town": "Windsor", "mi": 51.0, "min": 93, "d": "Almost 500 acres of meadow, marsh and woods with 12 miles of trail, a nature center and tobacco-barn museum.", "p": "Free lot at 145 Lang Rd.", "b": "Hartford"}, {"n": "Peak Mountain", "lat": 41.92, "lon": -72.763, "c": "hike", "town": "East Granby", "mi": 50.5, "min": 92, "d": "Short steep climb to a long ridge walk on the Metacomet with several open views west over the valley.", "p": "Roadside lot on Route 20. Free, small.", "b": "Hartford"}, {"n": "Penwood State Park", "lat": 41.872, "lon": -72.783, "c": "hike", "town": "Bloomfield", "mi": 47.0, "min": 86, "d": "Quieter neighbor to Talcott Mountain, with a paved loop road and the Metacomet Trail running the ridge.", "p": "Free lot on Route 185. Gate closes at sunset.", "b": "Hartford"}, {"n": "People's State Forest", "lat": 41.9252, "lon": -72.9988, "c": "hike", "town": "Barkhamsted", "mi": 48.6, "min": 89, "d": "Old-growth pines, the Jessie Gerard Trail with its 299 stone steps, Chaugham Lookout, and a small nature museum. Among the best hiking in the state.", "p": "Free lots along East River Rd. Restrooms at the museum. Avoid the red trail — it's out of use and easy to lose.", "b": "Hartford"}, {"n": "Ragged Mountain", "lat": 41.6339, "lon": -72.8082, "c": "hike", "town": "Berlin", "mi": 31.2, "min": 59, "d": "Cliff-top traprock loop with several vistas over the reservoirs. Rocky, muddy in places, and a real workout at 5+ miles.", "p": "Trailhead lot at 438 West Ln, or park at Timberlin golf course for the long loop. Free.", "b": "Hartford"}, {"n": "Rattlesnake Mountain", "lat": 41.7074, "lon": -72.8281, "c": "hike", "town": "Farmington", "mi": 35.5, "min": 66, "d": "Metacomet Trail climb to open ledges above the valley, with rock formations and caves along the way. Muddy at the base.", "p": "Small roadside lot on Route 6 (Colt Hwy). Free, limited.", "b": "Hartford"}, {"n": "Sessions Woods WMA", "lat": 41.7328, "lon": -72.9559, "c": "preserve", "town": "Burlington", "mi": 35.6, "min": 67, "d": "Seven hundred acres with a wide gravel main loop, a waterfall, beaver pond, observation tower and education center.", "p": "Large free lot at 341 Milford St. Exhibit building open weekdays only.", "b": "Hartford"}, {"n": "Stratton Brook State Park", "lat": 41.868, "lon": -72.828, "c": "walk", "town": "Simsbury", "mi": 46.1, "min": 84, "d": "Flat paved trails through pine woods to a pond, and one of the first fully wheelchair-accessible parks in the country.", "p": "Free with CT plates. Restrooms in season.", "b": "Hartford"}, {"n": "Sunnybrook State Park", "lat": 41.85, "lon": -73.064, "c": "hike", "town": "Torrington", "mi": 43.3, "min": 80, "d": "Undeveloped park along the Still River with quiet woods roads and stream crossings. No facilities at all.", "p": "Roadside parking on Newfield Rd. Free.", "b": "Hartford"}, {"n": "Talcott Mountain State Park", "lat": 41.8355, "lon": -72.7909, "c": "hike", "town": "Simsbury", "mi": 44.5, "min": 82, "d": "The classic Hartford-area hike: a steady climb up the traprock ridge to Heublein Tower and a view across the whole Farmington Valley.", "p": "Lot on Summit Ridge Dr. Free with CT plates, fills on weekends.", "b": "Hartford"}, {"n": "Topsmead State Forest", "lat": 41.7479, "lon": -73.153, "c": "walk", "town": "Litchfield", "mi": 36.6, "min": 68, "d": "A Tudor estate on a hilltop with mowed paths across meadows and a wildflower field. Walking rather than hiking.", "p": "Free lot inside the gate. Picnicking allowed on the lawns.", "b": "Hartford"}, {"n": "Tunxis State Forest", "lat": 41.95, "lon": -72.92, "c": "hike", "town": "Hartland", "mi": 50.7, "min": 92, "d": "Remote forest crossed by the blue-blazed Tunxis Trail, with Indian Council Caves and long stretches of nobody at all.", "p": "Roadside pull-offs on Route 20. Free, no facilities.", "b": "Hartford"}, {"n": "Chatfield Hollow State Park", "lat": 41.3659, "lon": -72.5859, "c": "hike", "town": "Killingworth", "mi": 26.3, "min": 45, "d": "Eighteen miles of trail plus a repaved 3.3-mile main circuit, a covered bridge, marsh boardwalk, swimming pond and caves. One of the few places plowed for winter walking.", "p": "Several lots throughout the park, plus roadside spots. Free with CT plates. Restrooms by the main pond in season.", "b": "Middlesex"}, {"n": "Cockaponset State Forest", "lat": 41.44, "lon": -72.51, "c": "hike", "town": "Haddam", "mi": 32.0, "min": 60, "d": "Second-largest state forest, with Pattaconk Reservoir, the Cockaponset Trail and miles of quiet woods roads.", "p": "Free lots off Cedar Lake Rd and at Pattaconk. Some roads seasonal.", "b": "Middlesex"}, {"n": "Day Pond State Park", "lat": 41.5568, "lon": -72.4191, "c": "hike", "town": "Colchester", "mi": 40.3, "min": 75, "d": "Small swimming pond with a good 2-hour loop into Salmon River forest past a waterfall. Some crossings have no bridge.", "p": "Free lots at the pond. Porta-johns and a pavilion.", "b": "Middlesex"}, {"n": "Devil's Hopyard State Park", "lat": 41.4795, "lon": -72.3416, "c": "hike", "town": "East Haddam", "mi": 41.1, "min": 76, "d": "Chapman Falls drops 60 feet just steps from the lot, with steep trails climbing into the gorge above.", "p": "Free lots at 366 Hopyard Rd. Trail markings are sparse where trails merge.", "b": "Middlesex"}, {"n": "Gillette Castle State Park", "lat": 41.4229, "lon": -72.4275, "c": "walk", "town": "East Haddam", "mi": 35.4, "min": 66, "d": "The actor's stone castle above the river, with the old narrow-gauge railbed converted to easy loop trails.", "p": "Large free lot; castle tour charged. Restrooms on site.", "b": "Middlesex"}, {"n": "Hammonasset Beach State Park", "lat": 41.2667, "lon": -72.5584, "c": "walk", "b": "Middlesex", "town": "Madison", "mi": 26.0, "min": 38, "d": "Two miles of shoreline plus the Moraine Nature Trail at the Meigs Point end — the underrated part. Paved paths are great off-season.", "p": "Use the Meigs Point lot at the far east end for the nature trail. Much less chaotic than the main beach lots. Free with CT plates."}, {"n": "Hurd State Park", "lat": 41.5217, "lon": -72.5412, "c": "hike", "town": "East Hampton", "mi": 33.7, "min": 63, "d": "Split Rock, river overlooks and primitive boater campsites on the Connecticut River. Mountain biking allowed.", "p": "Two free lots off Hurd Park Rd.", "b": "Middlesex"}, {"n": "Lake Hammonasset", "lat": 41.3586, "lon": -72.6077, "c": "rwa", "town": "Killingworth", "mi": 25.1, "min": 42, "d": "The best-rated RWA hike — the White Trail loop runs about six miles with 500 feet of climbing, a mix of narrow footpath and vehicle road.", "p": "Gated entrance at 530 N Branford Rd. Permit and code required. Lot fits 6–8 cars; porta-john on site.", "b": "Middlesex"}, {"n": "Machimoodus State Park", "lat": 41.483, "lon": -72.437, "c": "hike", "town": "East Haddam", "mi"     for(let i=0;i<l.p.length;i+=step) put(l.p[i][0],l.p[i][1],2.2);
    put(l.c[0],l.c[1],Math.max(2,l.rad*0.72));

})();
function nearWater(x,y,extra){
  const cx=Math.floor(x/WCELL), cy=Math.floor(y/WCELL);
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const a=WGRID.get((cx+i)+','+(cy+j));
    if(!a) continue;
    for(const [px,py,r] of a){
      const rr=r+extra;
      if((px-x)*(px-x)+(py-y)*(py-y) < rr*rr) return true;
    }
  }
  return false;
}

function vnoise(x,y,seed){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const h=(a,b)=>{ let n=Math.sin(a*127.1+b*311.7+seed*74.7)*43758.5453; return n-Math.floor(n); };
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v) + (h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;
}
function forestField(lat,lon){
  return vnoise(lon*7.5, lat*7.5, 3)*0.6 + vnoise(lon*17, lat*17, 9)*0.4;
}

const GLYPHS=[];
(function buildGlyphs(){
  const stepLat=0.0108, stepLon=0.0132;
  for(let lat=40.98; lat<42.06; lat+=stepLat){
    for(let lon=-73.76; lon<-71.77; lon+=stepLon){
      const jlat=lat+(rnd()-0.5)*stepLat*0.9, jlon=lon+(rnd()-0.5)*stepLon*0.9;
      if(!inCT(jlon,jlat)) continue;
      const ft=elevFt(jlat,jlon);
      const x=wx(jlon), y=wy(jlat), s=rnd();
      if(nearWater(x,y, ft>700?2.4:1.3)) continue;

      const fv=forestField(jlat,jlon);
      if(ft>1080){
        if(s<0.72) GLYPHS.push({k:2,x,y,h:10+(ft-1080)/130+rnd()*5,q:rnd(),f:rnd()});
        continue;
      }
      if(ft>640){
        if(s<0.34) GLYPHS.push({k:1,x,y,h:6+rnd()*3.2,q:rnd(),f:rnd()});
        else if(fv>0.54 && s<0.62) GLYPHS.push({k:0,x,y,h:4.4+rnd()*2.4,q:rnd(),f:rnd(),t:rnd()<0.45,shade:fv});
        continue;
      }
      if(fv>0.47){
        const dens=Math.min(0.92,(fv-0.47)*3.4);
        if(s<dens) GLYPHS.push({k:0,x,y,h:4.6+rnd()*2.8,q:rnd(),f:rnd(),t:rnd()<0.26,shade:fv});
      } else if(s<0.06){
        GLYPHS.push({k:3,x,y,h:2.4+rnd()*1.4,q:rnd()});
      }
    }
  }
  GLYPHS.sort((a,b)=>a.y-b.y);
})();

function makeParchment(){

    x.fillStyle = k<0.34 ? '#a8834a' : (k<0.68 ? '#f0dcaa' : '#c19a58');
    x.beginPath(); x.arc(px,py,rad,0,6.283); x.fill();
  }
  for(let i=0;i<1100;i++){
    x.globalAlpha=0.035+r()*0.06; x.strokeStyle= r()<0.5?'#9c7840':'#efdcae';
    x.lineWidth=0.4+r()*1.3;
    x.beginPath();
    const px=r()*460, py=r()*460, len=10+r()*54, ang=r()*6.283;
    x.moveTo(px,py); x.lineTo(px+Math.cos(ang)*len, py+Math.sin(ang)*len); x.stroke();
  }
  for(let i=0;i<70;i++){
    x.globalAlpha=0.05+r()*0.09;

let padX=0, padY=0;

  ctx.restore();

  ctx.strokeStyle=SEA_HI;
  for(let k=1;k<=4;k++){
    ctx.lineWidth=(1.5-k*0.22)/view.s; ctx.globalAlpha=0.62-k*0.13;
    ctx.beginPath();
    for(let i=0;i<W.outline.length-1;i++){
      const a=W.outline[i], b=W.outline[i+1];
      const mid=(a[1]+b[1])/2;
      if(mid < wy(41.42)) continue;
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
      const nx=dy/L*k*4.5, ny=-dx/L*k*4.5;
      ctx.moveTo(a[0]+nx,a[1]+ny); ctx.lineTo(b[0]+nx,b[1]+ny);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  ctx.strokeStyle=INK; ctx.lineWidth=1.7/view.s; ctx.lineJoin='round';
  path(W.isle,false); ctx.stroke();
  ctx.save();
  ctx.strokeStyle=INK_SOFT; ctx.lineWidth=1/view.s;
  for(let i=0;i<W.isle.length-1;i+=1){
    const a=W.isle[i], b=W.isle[i+1];
    for(let t=0;t<1;t+=0.25){
      const px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;

  W.lakes.forEach(l=>{

    ctx.fillStyle=SEA_HI; ctx.fill();
    ctx.save(); ctx.clip();

    }
    ctx.stroke();

    for(let k=1;k<=2;k++){

      ctx.beginPath();
      l.p.forEach((p,i)=>{

      });
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    path(l.p,true);
    ctx.strokeStyle=WATER_INK; ctx.lineWidth=1.15/view.s; ctx.stroke();
  });

  // ---- rivers: filled tapered channel, drawn like a pen nib widening downstream
  W.rivers.forEach(r=>{
    const n=r.p.length;
    if(n<3) return;
    const head=(0.20+r.w*0.16), mouth=(0.55+r.w*0.92);
    const minW=0.55/view.s;
    const L=[], R=[];
    for(let i=0;i<n;i++){
      const a=r.p[Math.max(0,i-1)], b=r.p[Math.min(n-1,i+1)];
      let dx=b[0]-a[0], dy=b[1]-a[1];
      const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
      const t2=i/(n-1);
      const ease=Math.pow(t2,0.72);
      let w=(head+(mouth-head)*ease)*0.5;
      w*= 1 + Math.sin(i*0.21+r.w*3.3)*0.10;
      w=Math.max(w, minW);
      L.push([r.p[i][0]-dy*w, r.p[i][1]+dx*w]);

function drawTree(gl,gs){
  const h=gl.h*gs;
  const shade = gl.shade!==undefined ? gl.shade : 0.7;
  ctx.strokeStyle=FOREST_DK; ctx.lineWidth=0.6*gs;
  // trunk
  ctx.beginPath(); ctx.moveTo(gl.x,gl.y); ctx.lineTo(gl.x,gl.y-h*0.42); ctx.stroke();
  if(gl.t){
    // conifer
    ctx.fillStyle = gl.f<0.5 ? FOREST : FOREST_DK;
    ctx.beginPath();
    ctx.moveTo(gl.x-h*0.46,gl.y-h*0.30);
    ctx.lineTo(gl.x,gl.y-h*1.45);
    ctx.lineTo(gl.x+h*0.46,gl.y-h*0.30);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    // broadleaf: lobed canopy, lit on the left
    const cx=gl.x, cy=gl.y-h*0.92, R=h*0.60;
    ctx.fillStyle = gl.f<0.42 ? FOREST_LT : FOREST;
    ctx.beginPath();
    const lobes=6;
    for(let i=0;i<=lobes;i++){
      const a=Math.PI*2*i/lobes + gl.q*2;
      const rr=R*(0.80+((i*37+gl.q*90)%23)/23*0.36);
      const xx=cx+Math.cos(a)*rr, yy=cy+Math.sin(a)*rr*0.86;
      if(i===0) ctx.moveTo(xx,yy);
      else{
        const pa=Math.PI*2*(i-0.5)/lobes + gl.q*2;
        ctx.quadraticCurveTo(cx+Math.cos(pa)*rr*1.24, cy+Math.sin(pa)*rr*1.06, xx, yy);
      }
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // shadow underside
    ctx.fillStyle='rgba(70,80,34,'+(0.20+shade*0.22).toFixed(2)+')';
    ctx.beginPath();
    ctx.arc(cx+R*0.20, cy+R*0.26, R*0.56, 0, Math.PI);
    ctx.fill();
  }
}

function drawGrass(gl,gs){
  const h=gl.h*gs;
  ctx.strokeStyle=INK_SOFT; ctx.lineWidth=0.55*gs;
  ctx.beginPath();
  for(let i=-1;i<=1;i++){

    ctx.lineTo(gl.x+i*h*0.62, gl.y-h*(1-Math.abs(i)*0.25));

}

function drawHill(gl,gs){
  const h=gl.h*gs, w=h*1.55;
  ctx.fillStyle=MTN_FILL;
  ctx.strokeStyle=INK; ctx.lineWidth=0.85*gs; ctx.lineJoin='round';

  ctx.quadraticCurveTo(gl.x-w*0.42,gl.y-h*1.55,gl.x-h*0.05,gl.y-h*0.55);
  ctx.quadraticCurveTo(gl.x+w*0.42,gl.y-h*1.30,gl.x+w,gl.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // hatching on the shaded right flank
  ctx.strokeStyle=INK_SOFT; ctx.lineWidth=0.45*gs;

    const t2=i/4.4;
    ctx.moveTo(gl.x+w*0.14+w*0.52*t2, gl.y-h*(0.72-0.42*t2));
    ctx.lineTo(gl.x+w*0.30+w*0.62*t2, gl.y-h*0.04);
  }
  ctx.stroke();
}

function drawMountain(gl,gs){
  const h=gl.h*gs, w=h*0.92;
  ctx.lineJoin='round';
  // main ridge silhouette
  ctx.fillStyle=MTN_FILL;
  ctx.strokeStyle=INK; ctx.lineWidth=0.95*gs;
  ctx.beginPath();
  ctx.moveTo(gl.x-w,gl.y);
  ctx.lineTo(gl.x-w*0.34,gl.y-h*0.78);
  ctx.lineTo(gl.x-w*0.06,gl.y-h);
  ctx.lineTo(gl.x+w*0.30,gl.y-h*0.66);
  ctx.lineTo(gl.x+w*0.58,gl.y-h*0.80);
  ctx.lineTo(gl.x+w,gl.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // sunlit western face
  ctx.fillStyle=MTN_LT;
  ctx.beginPath();
  ctx.moveTo(gl.x-w,gl.y);
  ctx.lineTo(gl.x-w*0.34,gl.y-h*0.78);
  ctx.lineTo(gl.x-w*0.06,gl.y-h);
  ctx.lineTo(gl.x-w*0.02,gl.y);
  ctx.closePath(); ctx.fill();
  // engraved hatching down the shaded face
  ctx.strokeStyle=INK_SOFT; ctx.lineWidth=0.5*gs;
  ctx.beginPath();
  for(let i=1;i<=5;i++){
    const t2=i/6;
    ctx.moveTo(gl.x-w*0.04+w*0.30*t2, gl.y-h*(0.96-0.20*t2));
    ctx.lineTo(gl.x+w*0.10+w*0.86*t2, gl.y-h*0.05);
  }
  ctx.stroke();
  // secondary peak behind, to build a range
  if(gl.f<0.45){
    ctx.fillStyle=MTN_FILL; ctx.strokeStyle=INK; ctx.lineWidth=0.75*gs;
    ctx.beginPath();
    ctx.moveTo(gl.x+w*0.42,gl.y-h*0.06);
    ctx.lineTo(gl.x+w*0.92,gl.y-h*0.74);
    ctx.lineTo(gl.x+w*1.46,gl.y-h*0.06);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function fellText(txt,size,style){
  ctx.font=(style||'')+' '+size+"px 'IM Fell English', Georgia, serif";
}
function haloText(txt,x,y,size,color,style,spacing){
  fellText(txt,size,style);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2.4,size*0.28); ctx.strokeStyle='rgba(228,206,158,.90)'; ctx.lineJoin='round';
  if(spacing){
    const chars=txt.split(''); const wsum=chars.reduce((a,c)=>a+ctx.measureText(c).width+spacing,0)-spacing;
    let cx=x-wsum/2;
    ctx.textAlign='left';
    chars.forEach(c=>{ ctx.strokeText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    cx=x-wsum/2;
    ctx.fillStyle=color;
    chars.forEach(c=>{ ctx.fillText(c,cx,y); cx+=ctx.measureText(c).width+spacing; });
    ctx.textAlign='center';
  } else {
    ctx.strokeText(txt,x,y); ctx.fillStyle=color; ctx.fillText(txt,x,y);
  }
}

// text following the river channel, letter by letter
function textAlongPath(txt, pts, size, color, startFrac){
  fellText(txt,size,'italic');
  const chars=txt.split('');
  const spacing=size*0.10;
  let total=0;
  const widths=chars.map(c=>{const w=ctx.measureText(c).width;total+=w+spacing;return w;});
  total-=spacing;
  const segs=[];
  let L=0;
  for(let i=0;i<pts.length-1;i++){
    const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);
    segs.push({a:pts[i],b:pts[i+1],d,at:L}); L+=d;
  }
  if(L < total*1.25) return false;
  let dist=Math.max(0,(L-total)*startFrac);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=Math.max(2.2,size*0.3);
  ctx.strokeStyle='rgba(228,206,158,.90)'; ctx.lineJoin='round';
  const placed=[];
  for(let i=0;i<chars.length;i++){
    const d=dist+widths[i]/2;
    let s=segs.find(g=>d>=g.at && d<=g.at+g.d) || segs[segs.length-1];
    const t2=Math.max(0,Math.min(1,(d-s.at)/(s.d||1)));
    const x=s.a[0]+(s.b[0]-s.a[0])*t2, y=s.a[1]+(s.b[1]-s.a[1])*t2;
    let ang=Math.atan2(s.b[1]-s.a[1], s.b[0]-s.a[0]);
    if(Math.abs(ang)>Math.PI/2) ang+=Math.PI;
    placed.push({c:chars[i],x,y,ang});
    dist+=widths[i]+spacing;
  }
  placed.forEach(p=>{
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ang);
    ctx.strokeText(p.c,0,-size*0.42); ctx.restore();
  });
  ctx.fillStyle=color;
  placed.forEach(p=>{
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.ang);
    ctx.fillText(p.c,0,-size*0.42); ctx.restore();
  });
  return true;
}

function drawSites(vis){
  const inv=1/view.s;

  // Milford: walled town with banner, as on the reference
  const hx=wx(HOME.lon), hy=wy(HOME.lat);
  ctx.save();
  ctx.strokeStyle=INK; ctx.fillStyle=LAND_HI; ctx.lineWidth=1.5*inv; ctx.lineJoin='round';
  ctx.beginPath(); ctx.rect(hx-6*inv,hy-5*inv,12*inv,8*inv); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<4;i++){ ctx.rect(hx-6*inv+i*3.2*inv, hy-7.6*inv, 2*inv, 2.8*inv); }
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx,hy-7.6*inv); ctx.lineTo(hx,hy-15.5*inv); ctx.stroke();
  ctx.fillStyle='#8c2f18';
  ctx.beginPath(); ctx.moveTo(hx,hy-15.5*inv); ctx.lineTo(hx+9*inv,hy-12.8*inv); ctx.lineTo(hx,hy-10.2*inv); ctx.closePath(); ctx.fill();
  haloText('MILFORD',hx,hy+13*inv,12.5*inv,'#7d2b1a','',1.0*inv);
  ctx.restore();

  SITES.forEach((s,i)=>{
    if(!activeCat[s.c]) return;
    const x=wx(s.lon), y=wy(s.lat);
    if(!vis(x,y,60)) return;
    const sel=(i===selected), hov=(i===hovered);
    const S=(sel?1.35:1)*inv;
    const col=CAT[s.c].color;
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle=INK; ctx.lineWidth=1.15*S;

    if(s.c==='hike'){
      // twin peaks
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(x-5.4*S,y+2.2*S); ctx.lineTo(x-1.4*S,y-5.4*S);
      ctx.lineTo(x+1.2*S,y-1.2*S); ctx.lineTo(x+3.0*S,y-4.0*S);
      ctx.lineTo(x+6.0*S,y+2.2*S); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if(s.c==='walk'){
      // waymarker post with pennant
      ctx.beginPath(); ctx.moveTo(x,y+2.4*S); ctx.lineTo(x,y-6.2*S); ctx.stroke();
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(x,y-6.2*S); ctx.lineTo(x+6.2*S,y-4.4*S); ctx.lineTo(x,y-2.6*S);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if(s.c==='preserve'){
      // single broad tree
      ctx.beginPath(); ctx.moveTo(x,y+2.4*S); ctx.lineTo(x,y-1.6*S); ctx.stroke();
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x,y-3.8*S,4.0*S,0,6.283); ctx.fill(); ctx.stroke();
    } else if(s.c==='open'){
      // open field: three tufts on a baseline
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(x,y-1.2*S,3.4*S,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x-4.6*S,y+2.0*S); ctx.lineTo(x+4.6*S,y+2.0*S); ctx.stroke();
    } else {
      // water authority: tower keep
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.rect(x-3.4*S,y-5.6*S,6.8*S,7.8*S); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      for(let k=0;k<3;k++) ctx.rect(x-3.4*S+k*2.6*S, y-7.6*S, 1.7*S, 2.2*S);
      ctx.fill(); ctx.stroke();
    }

    if(sel){
      ctx.strokeStyle='rgba(140,47,24,.9)'; ctx.lineWidth=1.1*S;
      ctx.beginPath(); ctx.arc(x,y-1.6*S,11*S,0,6.283); ctx.stroke();
      for(let k=0;k<8;k++){
        const a=k*Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(x+Math.cos(a)*12.4*S, y-1.6*S+Math.sin(a)*12.4*S);
        ctx.lineTo(x+Math.cos(a)*15.4*S, y-1.6*S+Math.sin(a)*15.4*S);
        ctx.stroke();
      }
    }
    ctx.restore();

    if(view.s>1.15||sel||hov)
      haloText(s.n,x,y-(sel?18:11)*inv,(sel?13:11)*inv,LABEL,'',0.4*inv);
  });
}

let parchPattern=null;
const snap={cv:document.createElement('canvas'),ok:false,s:1,x:0,y:0,px:0,py:0,w:0,h:0};
let interacting=false, idleTimer=null;

function beginInteract(){
  interacting=true;
  if(idleTimer) clearTimeout(idleTimer);
}
function endInteract(delay){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ interacting=false; dirty=true; }, delay===undefined?110:delay);
}

function renderFull(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const px=Math.round(w*0.28), py=Math.round(h*0.28);
  const sw=w+px*2, sh=h+py*2;
  if(snap.cv.width!==Math.round(sw*dpr)||snap.cv.height!==Math.round(sh*dpr)){
    snap.cv.width=Math.round(sw*dpr); snap.cv.height=Math.round(sh*dpr);
  }
  const sctx=snap.cv.getContext('2d');
  const prev=ctx; ctx=sctx;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,sw,sh);
  ctx.save();
  ctx.translate(view.x+px, view.y+py); ctx.scale(view.s,view.s);
  padX=px; padY=py;
  drawWorld();
  padX=0; padY=0;
  ctx.restore();
  ctx=prev;
  snap.s=view.s; snap.x=view.x; snap.y=view.y;
  snap.px=px; snap.py=py; snap.w=sw; snap.h=sh; snap.ok=true;
  blit();
}

function blit(){
  const w=stage.clientWidth, h=stage.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=LAND;
  ctx.fillRect(0,0,w,h);
  if(snap.ok){
    const k=view.s/snap.s;
    const wx0=(-snap.px-snap.x)/snap.s, wy0=(-snap.py-snap.y)/snap.s;
    const dx=wx0*view.s+view.x, dy=wy0*view.s+view.y;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(snap.cv, 0,0,snap.cv.width,snap.cv.height, dx,dy, snap.w*k, snap.h*k);
  }
  if(!parchPattern) parchPattern=ctx.createPattern(parchCanvas,'repeat');
  ctx.globalCompositeOperation='multiply';
  ctx.globalAlpha=0.5;
  ctx.fillStyle=parchPattern;
  ctx.fillRect(0,0,w,h);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  drawFrame();
}

function loop(){
  if(inertia) stepInertia();
  if(dirty){ dirty=false; interacting ? blit() : renderFull(); }
  requestAnimationFrame(loop);
}

let inertia=null;
function stepInertia(){
  view.x+=inertia.vx; view.y+=inertia.vy;
  inertia.vx*=0.92; inertia.vy*=0.92;
  dirty=true;
  if(Math.hypot(inertia.vx,inertia.vy)<0.4){ inertia=null; endInteract(30); }
}

function fitSites(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const usableH=h, pad=isPhone()?26:60;
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  SITES.forEach(s=>{
    a=Math.min(a,wx(s.lon)); b=Math.max(b,wx(s.lon));
    c=Math.min(c,wy(s.lat)); d=Math.max(d,wy(s.lat));
  });
  const s=Math.min((w-pad*2)/(b-a),(usableH-pad*2)/(d-c));
  view.s=clampScale(s);
  view.x=w/2-((a+b)/2)*view.s;
  view.y=usableH/2-((c+d)/2)*view.s;
  dirty=true;
}
function fitAll(){
  const w=stage.clientWidth, h=stage.clientHeight;
  const pad=isPhone()?18:40;
  const usableH=h;
  const x0=wx(-73.80),x1=wx(-71.75),y0=wy(42.10),y1=wy(40.88);
  const s=Math.min((w-pad*2)/(x1-x0),(usableH-pad*2)/(y1-y0));
  minScale=Math.min(0.18, s*0.75);
  view.s=s;
  view.x=w/2-((x0+x1)/2)*s;
  view.y=usableH/2-((y0+y1)/2)*s;
  dirty=true;
}

let drag=null;
cv.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};stage.classList.add('drag');beginInteract();});
window.addEventListener('mouseup',e=>{
  if(drag&&!drag.moved){
    const i=pick(e);
    if(i>=0) select(i); else clearSelection();
  }
  drag=null; stage.classList.remove('drag'); endInteract();
});
window.addEventListener('mousemove',e=>{
  if(drag){
    if(Math.abs(e.clientX-drag.x)>3||Math.abs(e.clientY-drag.y)>3) drag.moved=true;
    view.x=drag.vx+(e.clientX-drag.x); view.y=drag.vy+(e.clientY-drag.y); dirty=true;
  } else if(!isTouch) hoverAt(e);
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  beginInteract(); endInteract(160);
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const [wx0,wy0]=worldOf(mx,my);
  view.s=clampScale(view.s*(1-Math.sign(e.deltaY)*0.12));
  view.x=mx-wx0*view.s; view.y=my-wy0*view.s; dirty=true;
},{passive:false});

const isTouch = (window.matchMedia && window.matchMedia('(hover:none)').matches) || ('ontouchstart' in window);
const isPhone = () => window.innerWidth <= 860;

let tp=null;
function midpoint(e){
  const r=cv.getBoundingClientRect();
  let x=0,y=0;
  for(const t of e.touches){ x+=t.clientX-r.left; y+=t.clientY-r.top; }
  return [x/e.touches.length, y/e.touches.length];
}
function spread(e){
  return Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                    e.touches[0].clientY-e.touches[1].clientY);
}
cv.addEventListener('touchstart',e=>{
  const r=cv.getBoundingClientRect();
  inertia=null; beginInteract();
  if(e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    tp={mode:'pan',px,py,vx:view.x,vy:view.y,sx:px,sy:py,t0:Date.now(),moved:false,
        lx:px,ly:py,lt:Date.now(),vX:0,vY:0};
  } else if(e.touches.length===2){
    const [mx,my]=midpoint(e);
    tp={mode:'pinch',d:spread(e),mx,my,moved:true};
  }
},{passive:false});

cv.addEventListener('touchmove',e=>{
  if(!tp) return;
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  if(tp.mode==='pan' && e.touches.length===1){
    const px=e.touches[0].clientX-r.left, py=e.touches[0].clientY-r.top;
    if(Math.abs(px-tp.sx)>6||Math.abs(py-tp.sy)>6) tp.moved=true;
    const now=Date.now(), dt=Math.max(1,now-tp.lt);
    tp.vX=(px-tp.lx)/dt*16; tp.vY=(py-tp.ly)/dt*16;
    tp.lx=px; tp.ly=py; tp.lt=now;
    view.x=tp.vx+(px-tp.sx); view.y=tp.vy+(py-tp.sy);
    dirty=true;
  } else if(e.touches.length===2){
    if(tp.mode!=='pinch'){ const [mx,my]=midpoint(e); tp={mode:'pinch',d:spread(e),mx,my,moved:true}; return; }
    const d=spread(e), [mx,my]=midpoint(e);
    const [wx0,wy0]=worldOf(mx,my);
    if(tp.d>0) view.s=clampScale(view.s*(d/tp.d));
    view.x=mx-wx0*view.s; view.y=my-wy0*view.s;
    tp.d=d; tp.mx=mx; tp.my=my;
    dirty=true;
  }
},{passive:false});

let lastTap=0;
cv.addEventListener('touchend',e=>{
  if(tp && tp.mode==='pan' && tp.moved && Date.now()-tp.lt<90 && Math.hypot(tp.vX,tp.vY)>3){
    inertia={vx:Math.max(-38,Math.min(38,tp.vX)), vy:Math.max(-38,Math.min(38,tp.vY))};
  } else if(e.touches.length===0){ endInteract(); }
  if(tp && tp.mode==='pan' && !tp.moved && Date.now()-tp.t0<400){
    const i=pickAt(tp.sx,tp.sy);
    const now=Date.now();
    if(i>=0){ select(i); }
    else if(now-lastTap<300){ zoomAt(tp.sx,tp.sy,1.6); }
    else { clearSelection(); }
    lastTap=now;
  }
  if(e.touches.length===0) tp=null;
},{passive:true});
cv.addEventListener('touchcancel',()=>{tp=null;inertia=null;endInteract()},{passive:true});

function pickAt(sx,sy){
  const [mx,my]=worldOf(sx,sy);
  let best=-1,bd=1e9;
  SITES.forEach((s,i)=>{
    if(!activeCat[s.c]) return;
    const d=Math.hypot(wx(s.lon)-mx, wy(s.lat)-my);
    if(d<bd){bd=d;best=i;}
  });
  return bd < (isTouch?22:11)/view.s ? best : -1;
}
function pick(e){
  const r=cv.getBoundingClientRect();
  return pickAt(e.clientX-r.left, e.clientY-r.top);
}
function hoverAt(e){
  const i=pick(e);
  if(i!==hovered){ hovered=i; dirty=true; }
  const r=cv.getBoundingClientRect();
  if(i>=0){
    const s=SITES[i];
    tip.querySelector('.n').textContent=s.n;
    tip.querySelector('.m').textContent=s.town+' · '+s.min+' min drive';
    tip.style.left=(e.clientX-r.left)+'px'; tip.style.top=(e.clientY-r.top-14)+'px';
    tip.style.opacity=1; cv.style.cursor='pointer';
  } else { tip.style.opacity=0; cv.style.cursor=''; }
}

function siteRow(i){ return document.querySelector('.site[data-i="'+i+'"]'); }
function siteInfo(i){ return document.querySelector('.info[data-i="'+i+'"]'); }

function select(i){
  if(selected>=0 && selected!==i){
    const pi=siteInfo(selected); if(pi) pi.classList.remove('show');
    const pr=siteRow(selected); if(pr) pr.classList.remove('on');
  }
  selected=i; dirty=true;
  const s=SITES[i], box=siteInfo(i), row=siteRow(i);
  if(!box) return;
  box.innerHTML =
    '<div class="ihead"><h3>'+s.n+'</h3>'+
      '<button class="x" aria-label="Close details">\u2715</button></div>'+
    '<div class="sub"><i style="background:'+CAT[s.c].color+'"></i>'+CAT[s.c].label+' \u00b7 '+s.town+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+s.min+'</b><span>min drive</span></div>'+
      '<div class="stat"><b>'+s.mi+'</b><span>mi from Milford</span></div>'+
      '<div class="stat"><b>'+Math.round(elevFt(s.lat,s.lon))+'</b><span>feet</span></div>'+
    '</div>'+
    '<p class="desc">'+s.d+'</p>'+
    '<div class="pk"><h4>Best parking</h4><p>'+s.p+'</p></div>';
  box.classList.add('show');
  box.querySelector('.x').onclick=ev=>{ ev.stopPropagation(); clearSelection(); };
  if(row){ row.classList.add('on'); row.scrollIntoView({block:'nearest',behavior:'smooth'}); }
  panTo(i);
}

function clearSelection(){
  if(selected>=0){
    const b=siteInfo(selected); if(b) b.classList.remove('show');
    const r=siteRow(selected); if(r) r.classList.remove('on');
  }
  selected=-1; dirty=true;
}

function panTo(i){
  const s=SITES[i], w=stage.clientWidth, h=stage.clientHeight;
  const ts=Math.max(view.s, isPhone()?1.0:1.15);
  const cy=h/2;
  const from={s:view.s,x:view.x,y:view.y};
  const to={s:ts,x:w/2-wx(s.lon)*ts,y:cy-wy(s.lat)*ts};
  const t0=performance.now();
  beginInteract();
  (function step(now){
    const t=Math.min(1,(now-t0)/520), e=1-Math.pow(1-t,3);
    view.s=from.s+(to.s-from.s)*e; view.x=from.x+(to.x-from.x)*e; view.y=from.y+(to.y-from.y)*e;
    dirty=true;
    if(t<1) requestAnimationFrame(step); else endInteract(20);
  })(t0);
}

document.getElementById('b-in').onclick=()=>{beginInteract();zoomBy(1.35);endInteract(140)};
document.getElementById('b-out').onclick=()=>{beginInteract();zoomBy(1/1.35);endInteract(140)};
let resetToggle=0;
document.getElementById('b-reset').onclick=()=>{
  clearSelection();
  beginInteract();
  fitAll();
  endInteract(140);
};
function zoomBy(k){
  const w=stage.clientWidth/2,h=stage.clientHeight/2;
  const [x0,y0]=worldOf(w,h);
  view.s=clampScale(view.s*k);
  view.x=w-x0*view.s; view.y=h-y0*view.s; dirty=true;
}

function buildPanel(){
  const f=document.getElementById('filters');
  Object.entries(CAT).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed','true');
    b.innerHTML='<i style="background:'+v.color+'"></i>'+v.label;
    b.onclick=()=>{
      activeCat[k]=!activeCat[k]; b.setAttribute('aria-pressed',activeCat[k]);
      document.querySelectorAll('.site,.info').forEach(el=>el.classList.toggle('off',!activeCat[el.dataset.c]));
      if(selected>=0&&!activeCat[SITES[selected].c]) clearSelection();
      dirty=true;
    };
    f.appendChild(b);
  });
  const list=document.getElementById('list');
  BANDS.forEach((label,bi)=>{
    const hd=document.createElement('div'); hd.className='band'; hd.textContent=label; list.appendChild(hd);
    SITES.forEach((s,i)=>{
      if(s.b!==BANDKEY[bi]) return;
      const row=document.createElement('div');
      row.className='site'; row.dataset.i=i; row.dataset.c=s.c;
      row.innerHTML='<span class="dot" style="background:'+CAT[s.c].color+'"></span>'+
        '<span class="nm">'+s.n+'<span class="tw">'+s.town+' \u00b7 '+s.mi+' miles</span></span>'+
        '<span class="el">'+s.min+' min</span>';
      row.onclick=()=>{ selected===i ? clearSelection() : select(i); };
      if(!isTouch){
        row.onmouseenter=()=>{hovered=i;dirty=true};
        row.onmouseleave=()=>{hovered=-1;dirty=true};
      }
      list.appendChild(row);

      const box=document.createElement('div');
      box.className='info'; box.dataset.i=i; box.dataset.c=s.c;
      list.appendChild(box);
    });
  });
}

let lastW=window.innerWidth, lastH=window.innerHeight;
window.addEventListener('resize',()=>{
  const w=window.innerWidth, h=window.innerHeight;
  const bigChange = w!==lastW || Math.abs(h-lastH)>140;
  resize();
  if(bigChange) fitAll();
  lastW=w; lastH=h;
});
window.addEventListener('orientationchange',()=>{ setTimeout(()=>{resize();fitAll()},260); });
resize();
buildPanel();
fitAll();
loop();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{dirty=true});
</script>
</body>
